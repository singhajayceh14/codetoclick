<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="rail" id="rail">
    <div class="rail-brand">
      <a class="brandmark" href="#" id="brand-home" aria-label="Code to Click, go to dashboard">
        <svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><use href="#mark"></use></svg>
        <span class="brandtext">
          <span class="w">Code<span class="to">to</span>Click</span>
          <span class="ws">Profitability Intelligence</span>
        </span>
      </a>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <span id="rail-currency">USD &middot; monthly ledger</span>
      <span class="num" id="rail-count"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn nav-btn" id="nav-toggle" aria-label="Collapse or expand navigation" aria-expanded="true">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-panel"></use></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-spacer"></div>
      <div class="ctl-group" role="group" aria-label="Reporting month">
        <button class="ctl-step" id="m-prev" aria-label="Previous month">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
        <button class="ctl-main" id="m-label" aria-label="Choose reporting month">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-calendar"></use></svg>
          <span class="ctl-text"></span>
        </button>
        <button class="ctl-step" id="m-next" aria-label="Next month">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
      </div>
      <button class="ctl-flat" id="compare-btn" aria-label="Comparison period">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-swap"></use></svg>
        <span class="ctl-text" id="compare-text"></span>
      </button>
      <div class="qa">
        <button class="btn btn-primary btn-sm qa-btn" id="new-btn" aria-haspopup="menu" aria-expanded="false" data-tip="New record (N)">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"></use></svg><span class="qa-word">New</span>
        </button>
        <div class="qa-pop" id="new-pop" role="menu" hidden></div>
      </div>
      <div class="topbar-acts">
        <button class="icon-btn" id="insight-btn" aria-label="Insights" data-tip="Insights for this period">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell"></use></svg>
          <span class="dot" id="insight-dot" hidden></span>
        </button>
        <button class="icon-btn" id="help-btn" aria-label="Keyboard shortcuts and help" data-tip="Shortcuts &amp; help">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-help"></use></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Switch colour theme" data-tip="Theme">
          <svg class="ico th-sun" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"></use></svg>
          <svg class="ico th-moon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
        <button class="avatar" id="profile-btn" aria-label="Workspace" data-tip="Code to Click workspace">CC</button>
      </div>
    </header>

    <div class="periodbar">
      <div class="periods" id="periods" role="group" aria-label="Reporting period"></div>
      <div class="stamp" id="stamp"></div>
    </div>

    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" id="dlg-form">
    <div class="dlg-head">
      <div><h2 id="dlg-title"></h2><div class="sub" id="dlg-sub"></div></div>
      <button class="dlg-x" value="cancel" type="submit" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="dlg-body"></div>
    <div class="dlg-foot"><div id="dlg-msg" class="muted" style="font-size:12px"></div><div id="dlg-actions" style="display:flex;gap:8px"></div></div>
  </form>
</dialog>
