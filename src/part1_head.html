  .content{padding:18px 16px 56px}
}

/* --- tablet: the crumb takes its own line, periods span the width --------- */
@media (max-width:760px){
  .topbar{height:56px}
  .topbar-acts{gap:0}
  #help-btn{display:none}
  .crumbs{max-width:40vw}
  .periodbar{flex-direction:column;align-items:stretch;gap:10px}
  .periods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
  .periods button{padding:7px 6px;text-align:center}
  .stamp{align-self:flex-start}
  .panel-head{padding:14px 16px}
  .panel-body{padding:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
}

/* --- phone: one column, nothing wider than the screen --------------------- */
@media (max-width:600px){
  .topbar{padding:0 12px}
  .periodbar{padding:12px 12px 0}
  .content{padding:14px 12px 56px}
  .avatar{display:none}
  #insight-btn{display:none}
  .periods{grid-template-columns:repeat(3,minmax(0,1fr))}
  .periods button:last-child:nth-child(3n+1){grid-column:1/-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:14px 16px 12px}
  .tile .t-value{font-size:26px;margin-top:10px}
  .tile .t-spark{margin:12px -16px -12px}
  .panel + .panel{margin-top:12px}
  .stack{gap:14px}
  h1{font-size:25px;line-height:1.18}
  .page-head{margin-bottom:18px}
  .panel-head{flex-wrap:wrap;row-gap:8px}
  .panel-head > *{min-width:0}
  .sumcell{padding:14px 16px}
  .sumcell:nth-child(2n){border-right:0}
  /* toolbars scroll sideways rather than push the page wide */
  .dt-bar{gap:8px;padding:8px 10px}
  .dt-bar .grow{flex:1 1 100%;order:-1}
  .search{min-width:0;width:100%}
  .seg-toggle{overflow-x:auto;scrollbar-width:none;max-width:100%}

  /* dialogs go full-screen, as they do on every native platform */
  dialog{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border:0;border-radius:0;
    display:flex;flex-direction:column}

/* ===== sign in ============================================================
   A gate, not a security boundary — the real check arrives with the API.
   Two panels: brand on the left, form on the right; stacks under 860px. */
.signin{position:fixed;inset:0;z-index:60;display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);overflow:auto}

  font-weight:650;letter-spacing:-.024em;max-width:15ch}

/* Identity on the settings Account panel. The email was being clipped when it
   shared a fixed control column with the role chip. */
.set-ident{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.set-ident .em{font-size:13px;color:var(--text-2);word-break:break-all}

.si-form{display:grid;gap:18px}

/* A field is the input with its own label inside it. The label lifts clear on
   focus, or once there is a value, so each field carries its name without a
   second line of text stacked above it. Input first in the DOM, so the label
   and the reveal button can be addressed as following siblings. */
.si-field{position:relative}
/* Scoped to .si-field so these beat the app's generic input[type="text"]
   rule, which is (0,1,1) and would otherwise win. It has to: revealing the
   password switches the input to type=text, and without this the field
   collapses from 56px to 32px mid-interaction. */
.si-field .si-in{width:100%;height:56px;padding:23px 14px 7px;border:1px solid var(--border-strong);
  border-radius:var(--r-md);background:var(--layer);color:var(--text);font:inherit;font-size:14.5px;
  transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.si-field .si-in:hover{border-color:var(--text-3)}
.si-field .si-in:focus{outline:none;border-color:var(--focus);background:var(--bg);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.si-field .si-in:-webkit-autofill{-webkit-text-fill-color:var(--text);
  box-shadow:0 0 0 100px var(--layer) inset}
.si-lab{position:absolute;left:15px;top:17px;font-size:14.5px;color:var(--text-3);
  pointer-events:none;transform-origin:0 0;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),color .18s ease}
.si-field .si-in:focus~.si-lab,.si-field .si-in:not(:placeholder-shown)~.si-lab{transform:translateY(-10px) scale(.78)}
.si-field .si-in:focus~.si-lab{color:var(--focus)}

/* The ruled line drawn under a focused field. A ledger's own gesture, and the
   only motion on this screen that is not answering a click. */
.si-field::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:2px;
  background:var(--focus);border-radius:0 0 var(--r-md) var(--r-md);
  transform:scaleX(0);transform-origin:0 50%;pointer-events:none;
  transition:transform .26s cubic-bezier(.2,.7,.3,1)}
.si-field:focus-within::after{transform:scaleX(1)}
.si-field.bad .si-in{border-color:var(--err)}
.si-field.bad::after{background:var(--err);transform:scaleX(1)}
.si-field.bad .si-lab{color:var(--err)}

.si-field.pw .si-in{padding-right:52px}
.si-peek{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  display:grid;place-items:center;border:0;border-radius:var(--r-xs);background:transparent;
  color:var(--text-3);cursor:pointer;transition:background-color .15s ease,color .15s ease}
.si-peek:hover{background:var(--layer-hover);color:var(--text)}
.si-peek:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.si-peek .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.si-peek .i-off{display:none}
.si-peek[aria-pressed="true"] .i-on{display:none}
.si-peek[aria-pressed="true"] .i-off{display:block}

/* Own token, not --brand-accent: that one is lightened in dark mode for links,
   and white text on it falls to 2.98:1. This holds 5.3:1 in both themes. */
.si-btn{height:50px;margin-top:2px;border:0;border-radius:var(--r-md);background:#4f46e5;color:#fff;
  font:inherit;font-size:14.5px;font-weight:560;letter-spacing:-.008em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 1px 2px rgba(79,70,229,.3),0 8px 20px -8px rgba(79,70,229,.55);
  transition:filter .15s ease,transform .12s ease,box-shadow .15s ease}
.si-btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px);
  box-shadow:0 1px 2px rgba(79,70,229,.3),0 12px 24px -10px rgba(79,70,229,.6)}
.si-btn:active:not(:disabled){transform:translateY(0)}
.si-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .si-btn{background:#5b56ea}}
:root[data-theme="dark"] .si-btn{background:#5b56ea}
.si-btn:disabled{opacity:.62;cursor:default;box-shadow:none;transform:none}

/* --err on --err-bg is 4.41:1 in light, just under AA for body text, so the
   sign-in error states its own darker red. Dark theme's --err already passes. */
.si-err{display:flex;gap:10px;align-items:flex-start;background:var(--err-bg);
  border:1px solid var(--err-line);color:#b91c1c;border-radius:var(--r-md);
  padding:12px 14px;font-size:13px;line-height:1.45;
  animation:si-drop .24s cubic-bezier(.2,.7,.3,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .si-err{color:var(--err)}}
:root[data-theme="dark"] .si-err{color:var(--err)}
.si-err[hidden]{display:none}
.si-err .ico{width:16px;height:16px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2.2}
.si-err .t{font-weight:600}
.si-err .h{display:block;margin-top:3px;opacity:.85;font-weight:400}
.si-err .h[hidden]{display:none}
@keyframes si-drop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
@keyframes si-shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.si-card.shake{animation:si-shake .48s cubic-bezier(.36,.07,.19,.97)}
.si-spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.42);border-top-color:#fff;
  border-radius:50%;animation:si-turn .7s linear infinite}
@keyframes si-turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .si-spin{animation-duration:2.4s}
  .si-card.shake,.si-err{animation:none}
  .si-in,.si-lab,.si-field::after,.si-btn,.si-peek{transition:none}}
