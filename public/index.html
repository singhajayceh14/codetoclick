      var tr = el('<div class="p360-block"><div class="blk-head"><h4>Utilisation</h4>' +
        '<span class="blk-note">avg ' + avg.toFixed(0) + '% over ' + hist.length + ' months</span></div></div>');
      tr.appendChild(el('<div class="util-spark">' + U.sparkline(hist.map(function (x) { return x.pct / 100; }), 'var(--m-revenue)', 300, 56,
        { labels: hist.map(function (x) { return C.mshort(x.m); }), name: 'Allocated', fmt: 'pct' }) + '</div>'));
      var ht = '<table class="grid mini"><thead><tr><th>Month</th><th class="n">Allocated</th><th class="n">Projects</th><th class="n">Bench</th></tr></thead><tbody>';
      hist.slice(-6).reverse().forEach(function (x) {
        ht += '<tr' + (x.m === month ? ' class="now"' : '') + '><td>' + esc(C.mshort(x.m)) + (x.m === month ? ' <span class="tag">now</span>' : '') + '</td>' +
          '<td class="n">' + x.pct + '%</td><td class="n">' + x.n + '</td>' +
          '<td class="n">' + (x.bench > 0.5 ? '<span class="warn-ink">' + money(x.bench) + '</span>' : '<span class="muted">—</span>') + '</td></tr>';
      });
      tr.appendChild(el(ht + '</tbody></table>'));
      panel.appendChild(tr);
    }

    panel.appendChild(el('<footer class="p360-foot">Every change here writes to <strong>' + esc(C.mlabel(month)) +
      '</strong> only. Earlier months keep the allocation they closed with.</footer>'));
    return panel;
  }

  /* ---------- the people list ---------------------------------------------- */
  function peopleList(s, month, rows) {
    var a = st(s);
    var wrap = el('<div class="wb-list"></div>');
    wrap.appendChild(el('<div class="wl-head"><span>Person</span><span class="r">Cost</span><span>Capacity</span><span class="r">Total</span><span class="r">Status</span></div>'));
    var list = el('<div class="wl-body" role="listbox" aria-label="People"></div>');
    if (!rows.length) list.appendChild(el(U.emptyState('No one matches', 'Clear a filter or widen the search.', '', 'users')));
    rows.forEach(function (emp) {
      var on = a.sel === emp.id;
      var row = el('<button class="wl-row' + (on ? ' on' : '') + '" type="button" role="option" aria-selected="' + on + '">' +
        '<span class="who"><span class="avatar-sm" style="--hue:' + hueOf(emp.dept) + '">' + esc(initials(emp.name)) + '</span>' +
        '<span class="who-t"><strong>' + esc(emp.name) + '</strong><span class="sub">' + esc(emp.title) + ' &middot; ' + esc(emp.dept) + '</span></span></span>' +
        '<span class="num r cost">' + money(emp.monthlyCost) + '</span>' +
        '</button>');
      var capCell = el('<span class="cap"></span>');
      capCell.appendChild(capacityBar(emp));
      row.appendChild(capCell);
      row.appendChild(el('<span class="num r tot"><b>' + emp.allocatedPct + '%</b></span>'));
      row.appendChild(el('<span class="r stat">' + statusPill(emp) + '</span>'));
      row.addEventListener('click', function () { a.sel = on ? null : emp.id; refresh(); });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  /* ---------- the project 360 ---------------------------------------------- */
  function project360(s, month, p) {
    var a = st(s), r = C.rollup(month);
    var cl = H.clientOf(p.id) || {};
    var panel = el('<section class="p360" aria-label="' + esc(p.name) + '"></section>');
    var head = el('<header class="p360-head">' +
      '<span class="avatar-lg sq" style="--hue:' + hueOf(p.id) + '">' + icon('projects') + '</span>' +
      '<div class="p360-id"><h3>' + esc(p.name) + '</h3><div class="p360-sub">' + esc(cl.name || '') + ' &middot; ' + esc(p.type) + '</div></div>' +
      '<button class="icon-btn p360-x" type="button" aria-label="Close" data-tip="Close">' + icon('x') + '</button></header>');
    head.querySelector('.p360-x').addEventListener('click', function () { a.team = null; refresh(); });
    panel.appendChild(head);

    panel.appendChild(el('<div class="p360-facts">' +
      '<div><span class="f-l">Revenue</span><span class="f-v num">' + money(p.revenue) + '</span></div>' +
      '<div><span class="f-l">Team cost</span><span class="f-v num">' + money(p.empCost) + '</span></div>' +
      '<div><span class="f-l">Other cost</span><span class="f-v num">' + money(p.otherCost) + '</span></div>' +
      '<div><span class="f-l">Margin</span><span class="f-v">' + U.marginPill(p.margin) + '</span></div></div>'));

    var ed = el('<div class="p360-block"><div class="blk-head"><h4>Team for ' + esc(C.mlabel(month)) + '</h4>' +
      '<span class="blk-note">' + p.team.length + ' people</span></div></div>');
    var lines = el('<div class="alloc-lines"></div>');
    p.team.slice().sort(function (x, y) { return y.amount - x.amount; }).forEach(function (t) {
      var emp = r.byEmployee[t.empId];
      var freeCap = 100 - emp.allocatedPct + t.pct;
      var line = el('<div class="alloc-line">' +
        '<span class="avatar-sm" style="--hue:' + hueOf(emp.dept) + '">' + esc(initials(emp.name)) + '</span>' +
        '<span class="nm"><strong>' + esc(emp.name) + '</strong><small>' + esc(emp.title) + ' &middot; ' + emp.allocatedPct + '% allocated overall</small></span>' +
        '<span class="amt num">' + money(t.amount) + '</span></div>');
      line.insertBefore(control(t.pct, freeCap, hueOf(p.id), function (v) {
        var m = mapOf(month, emp.id);
        if (v <= 0) delete m[p.id]; else m[p.id] = v;
        write(month, emp.id, m, emp.name + ' on ' + p.name); refresh();
      }), line.querySelector('.amt'));
      var rm = el('<button class="row-act danger" type="button" data-tip="Take off this project" aria-label="Remove">' + icon('trash') + '</button>');
      rm.addEventListener('click', function () {
        var m = mapOf(month, emp.id); delete m[p.id];
        write(month, emp.id, m, 'removing ' + emp.name + ' from ' + p.name); refresh();
      });
      line.appendChild(rm);
      lines.appendChild(line);
    });
    if (!p.team.length) lines.appendChild(el(U.emptyState('Nobody on this project', 'Add someone with free capacity below.', '', 'users')));
    ed.appendChild(lines);

    var candidates = Object.keys(r.byEmployee).map(function (id) { return r.byEmployee[id]; })
      .filter(function (e) { return e.allocatedPct < 100 && !e.lines.some(function (l) { return l.projectId === p.id; }); })
      .sort(function (x, y) { return y.unallocated - x.unallocated; });
    var add = el('<div class="alloc-add"><select aria-label="Add someone to this project"><option value="">' +
      (candidates.length ? 'Add someone with free capacity…' : 'Everyone is fully allocated') + '</option>' +
      candidates.map(function (e) { return '<option value="' + e.id + '">' + esc(e.name) + ' — ' + (100 - e.allocatedPct) + '% free (' + money(e.unallocated) + ')</option>'; }).join('') +
      '</select><span class="muted">' + candidates.length + ' available</span></div>');
    var sel = add.querySelector('select');
    sel.disabled = !candidates.length;
    sel.addEventListener('change', function () {
      if (!sel.value) return;
      var e2 = r.byEmployee[sel.value], m = mapOf(month, sel.value);
      m[p.id] = Math.min(100 - e2.allocatedPct, step() * 4);
      write(month, sel.value, m, 'adding ' + e2.name + ' to ' + p.name); refresh();
    });
    ed.appendChild(add);
    panel.appendChild(ed);

    /* cost history for the project */
    var months = H.trailing12(month);
    var hist = months.map(function (m) { var x = C.rollup(m).byProject[p.id]; return x ? { m: m, cost: x.empCost, rev: x.revenue, margin: x.margin } : null; }).filter(Boolean);
    if (hist.length > 1) {
      var tr = el('<div class="p360-block"><div class="blk-head"><h4>Team cost and margin</h4><span class="blk-note">' + hist.length + ' months</span></div></div>');
      tr.appendChild(el('<div class="util-spark">' + U.sparkline(hist.map(function (x) { return x.margin; }), 'var(--m-profit)', 300, 56,
        { labels: hist.map(function (x) { return C.mshort(x.m); }), name: 'Margin', fmt: 'pct' }) + '</div>'));
      var ht = '<table class="grid mini"><thead><tr><th>Month</th><th class="n">Team cost</th><th class="n">Revenue</th><th class="n">Margin</th></tr></thead><tbody>';
      hist.slice(-6).reverse().forEach(function (x) {
        ht += '<tr' + (x.m === month ? ' class="now"' : '') + '><td>' + esc(C.mshort(x.m)) + (x.m === month ? ' <span class="tag">now</span>' : '') + '</td>' +
          '<td class="n">' + money(x.cost) + '</td><td class="n">' + money(x.rev) + '</td><td class="n">' + U.marginPill(x.margin) + '</td></tr>';
      });
      tr.appendChild(el(ht + '</tbody></table>'));
      panel.appendChild(tr);
    }
    panel.appendChild(el('<footer class="p360-foot">Changing a percentage here moves cost onto or off <strong>' + esc(p.name) + '</strong> in ' + esc(C.mlabel(month)) + ' immediately.</footer>'));
    return panel;
  }

  function projectList(s, month) {
    var a = st(s), r = C.rollup(month);
    var projects = Object.keys(r.byProject).map(function (id) { return r.byProject[id]; }).sort(function (x, y) { return y.empCost - x.empCost; });
    var prevM = C.maddMonths(month, -1);
    var prev = C.MONTHS.indexOf(prevM) !== -1 ? C.rollup(prevM).byProject : {};
    var t = U.table([
      { key: 'name', label: 'Project', cell: function (p) { return '<span class="dotsw" style="background:' + hueOf(p.id) + '"></span><strong>' + esc(p.name) + '</strong><div class="muted" style="font-size:12px;padding-left:16px">' + esc((H.clientOf(p.id) || {}).name || '') + '</div>'; } },
      { key: 'team', label: 'People', num: true, sortVal: function (p) { return p.team.length; }, cell: function (p) { return p.team.length; } },
      { key: 'empCost', label: 'Team cost', num: true, cell: function (p) { return money(p.empCost); } },
      { key: 'delta', label: 'vs ' + C.mshort(prevM), num: true, sortVal: function (p) { return p.empCost - ((prev[p.id] || {}).empCost || 0); },
        cell: function (p) { return prev[p.id] ? U.deltaChip(p.empCost, prev[p.id].empCost, { inverse: true }) : '<span class="muted">new</span>'; } },
      { key: 'revenue', label: 'Revenue', num: true, cell: function (p) { return money(p.revenue); } },
      { key: 'margin', label: 'Margin', num: true, cell: function (p) { return U.marginPill(p.margin); } }
    ], projects, {
      sortKey: 'empCost', id: 'alloc-projects', exportable: false, search: false,
      rowClass: function (p) { return a.team === p.id ? 'on' : ''; },
      onRow: function (p) { a.team = a.team === p.id ? null : p.id; refresh(); }
    });
    var w = el('<div class="wb-list"></div>');
    w.appendChild(t);
    return w;
  }

  /* ---------- matrix ------------------------------------------------------- */
  function matrixView(month, rows) {
    var r = C.rollup(month);
    var used = Object.keys(r.byProject).filter(function (pid) {
      return rows.some(function (e) { return e.lines.some(function (l) { return l.projectId === pid; }); });
    }).sort(function (a, b) { return r.byProject[a].name.localeCompare(r.byProject[b].name); });
    var h = '<div class="panel"><div class="dt-scroll capped"><table class="grid"><thead><tr><th class="stick">Employee</th>';
    used.forEach(function (pid) { h += '<th class="n"><span class="dotsw" style="background:' + hueOf(pid) + '"></span>' + esc(r.byProject[pid].name) + '</th>'; });
    h += '<th class="n">Internal</th><th class="n">Total</th><th class="n">Bench</th></tr></thead><tbody>';
    rows.forEach(function (e) {
      h += '<tr><td class="stick" style="white-space:nowrap"><strong>' + esc(e.name) + '</strong></td>';
      used.forEach(function (pid) {
        var l = e.lines.filter(function (x) { return x.projectId === pid; })[0];
        h += '<td class="n">' + (l ? '<span data-tip="' + money(l.amount) + '">' + l.pct + '%</span>' : '<span class="muted">·</span>') + '</td>';
      });
      var il = e.lines.filter(function (x) { return x.projectId === null; })[0];
      h += '<td class="n">' + (il ? il.pct + '%' : '<span class="muted">·</span>') + '</td>';
      h += '<td class="n"><strong>' + e.allocatedPct + '%</strong></td>';
      h += '<td class="n">' + (e.unallocated > 0.5 ? '<span class="warn-ink">' + money(e.unallocated) + '</span>' : '<span class="muted">—</span>') + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><td class="stick">Cost booked</td>';
    used.forEach(function (pid) { h += '<td class="n">' + moneyK(r.byProject[pid].empCost) + '</td>'; });
    h += '<td class="n">' + moneyK(r.company.internalEmpCost) + '</td><td class="n"></td><td class="n">' +
      moneyK(r.company.unallocatedEmpCost) + '</td></tr></tfoot></table></div></div>';
    return el(h);
  }

  /* ================= the screen =========================================== */
  V.allocations = function (s) {
    var a = st(s), month = s.month, r = C.rollup(month), c = r.company;
    var f = document.createDocumentFragment();

    f.appendChild(H.head('Allocation',
      'Split each person’s month across projects. Editing <strong>' + esc(C.mlabel(month)) + '</strong> never touches another month.'));

    /* --- summary cards ---------------------------------------------------- */
    var all = Object.keys(r.byEmployee).map(function (id) { return r.byEmployee[id]; });
    var full = all.filter(function (e) { return e.allocatedPct === 100; }).length;
    var under = all.filter(function (e) { return e.allocatedPct < 100; }).length;
    var over = all.filter(function (e) { return e.allocatedPct > 100; }).length;
    f.appendChild(el(U.sumStrip([
      { label: 'Payroll this month', value: moneyK(c.employeeCost), foot: c.headcount + ' employees', tip: 'Exact: ' + money(c.employeeCost) },
      { label: 'On client projects', value: moneyK(c.projectEmpCost), foot: pct(c.projectEmpCost / c.employeeCost) + ' of payroll', tip: 'Payroll that reached a billable project. Exact: ' + money(c.projectEmpCost) },
      { label: 'Internal', value: moneyK(c.internalEmpCost), foot: pct(c.internalEmpCost / c.employeeCost) + ' non-billable', tip: 'Internal time and non-billable projects. Exact: ' + money(c.internalEmpCost) },
      { label: 'On the bench', value: moneyK(c.unallocatedEmpCost), foot: pct(c.unallocatedEmpCost / c.employeeCost) + ' unallocated', tip: 'Payroll with no allocation at all. Exact: ' + money(c.unallocatedEmpCost) },
      { label: 'Fully allocated', value: full + ' <small class="of">/ ' + all.length + '</small>', foot: '<span class="pill good">at 100%</span>', tip: 'People whose month adds up to exactly 100%.' },
      { label: 'Needs attention', value: String(under + over), foot: (under ? '<span class="pill watch">' + under + ' under</span> ' : '') + (over ? '<span class="pill crit">' + over + ' over</span>' : (under ? '' : '<span class="pill good">none</span>')), tip: 'Under- or over-allocated people this month.' }
    ])));

    /* --- toolbar ---------------------------------------------------------- */
    var bar = el('<div class="wb-bar"></div>');
    var search = el('<label class="search"><span class="ic">' + U.icon('search') + '</span><input type="text" placeholder="Search people or projects" value="' + esc(a.q) + '"></label>');
    var qi = search.querySelector('input');
    qi.addEventListener('input', function () { a.q = qi.value; refresh(); var n = document.querySelector('.wb-bar .search input'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
    bar.appendChild(search);
    function select(label, cur, opts, onPick) {
      var w = el('<select aria-label="' + esc(label) + '"><option value="">' + esc(label) + '</option>' +
        opts.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(o.l) + '</option>'; }).join('') + '</select>');
      w.addEventListener('change', function () { onPick(w.value); refresh(); });
      bar.appendChild(w); return w;
    }
    select('All departments', a.dept, H.dedupe(C.EMPLOYEES.map(function (e) { return e.dept; })).sort().map(function (d) { return { v: d, l: d }; }), function (v) { a.dept = v; });
    select('Any status', a.status, [{ v: 'under', l: 'Under-allocated' }, { v: 'full', l: 'Fully allocated' }, { v: 'over', l: 'Over-allocated' }, { v: 'none', l: 'Not allocated at all' }], function (v) { a.status = v; });
    select('Any project', a.project, Object.keys(r.byProject).map(function (id) { return { v: id, l: r.byProject[id].name }; }).sort(function (x, y) { return x.l.localeCompare(y.l); }), function (v) { a.project = v; });
    bar.appendChild(el('<span class="grow"></span>'));
    var toggle = el('<div class="seg-toggle" role="group" aria-label="View"></div>');
    [['employee', 'By person', 'users'], ['project', 'By project', 'projects'], ['matrix', 'Matrix', 'dashboard']].forEach(function (v) {
      var b = el('<button type="button" aria-pressed="' + (a.view === v[0]) + '">' + icon(v[2]) + '<span>' + v[1] + '</span></button>');
      b.addEventListener('click', function () { a.view = v[0]; refresh(); });
      toggle.appendChild(b);
    });
    bar.appendChild(toggle);
    var prevM = C.maddMonths(month, -1);
    var copy = H.btn('Copy from ' + C.mshort(prevM), '', function () { confirmCopy(month, prevM); }, 'compare');
    copy.disabled = C.MONTHS.indexOf(prevM) === -1;
    bar.appendChild(copy);
    var un = H.btn('Undo', '', undo);
    un.disabled = !undoStack.length;
    un.setAttribute('data-tip', undoStack.length ? 'Revert: ' + undoStack[undoStack.length - 1].label : 'Nothing to undo');
    bar.appendChild(un);
    f.appendChild(bar);

    /* --- rows ------------------------------------------------------------- */
    var q = a.q.trim().toLowerCase();
    var rows = all.filter(function (e) {
      if (a.dept && e.dept !== a.dept) return false;
      if (a.project && !e.lines.some(function (l) { return l.projectId === a.project; })) return false;
      if (a.status === 'under' && e.allocatedPct >= 100) return false;
      if (a.status === 'full' && e.allocatedPct !== 100) return false;
      if (a.status === 'over' && e.allocatedPct <= 100) return false;
      if (a.status === 'none' && e.allocatedPct !== 0) return false;
      if (q) {
        var hay = (e.name + ' ' + e.title + ' ' + e.dept + ' ' + e.lines.map(function (l) { return l.projectId ? H.projName(l.projectId) : 'internal'; }).join(' ')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (x, y) { return (x.allocatedPct - y.allocatedPct) || (y.monthlyCost - x.monthlyCost); });

    var wb = el('<div class="wb"></div>');
    if (a.view === 'employee') {
      wb.appendChild(peopleList(s, month, rows));
      var selEmp = a.sel && r.byEmployee[a.sel];
      wb.appendChild(selEmp ? person360(s, month, selEmp)
        : el('<aside class="p360 empty">' + U.emptyState('Pick a person', 'Select someone on the left to see their whole month — capacity, cost, the projects they charge, and how their utilisation has moved.', '', 'users') + '</aside>'));
      f.appendChild(wb);
    } else if (a.view === 'project') {
      wb.appendChild(projectList(s, month));
      var selP = a.team && r.byProject[a.team];
      wb.appendChild(selP ? project360(s, month, selP)
        : el('<aside class="p360 empty">' + U.emptyState('Pick a project', 'Select a project on the left to staff it and see its cost, revenue and margin history.', '', 'projects') + '</aside>'));
      f.appendChild(wb);
    } else {
      f.appendChild(matrixView(month, rows));
    }

    /* --- bench ------------------------------------------------------------ */
    if (a.view !== 'project') {
      var bench = all.filter(function (e) { return e.unallocated > 0.5; }).sort(function (x, y) { return y.unallocated - x.unallocated; });
      f.appendChild(H.section('Bench', money(c.unallocatedEmpCost) + ' unallocated across ' + bench.length + ' people'));
      var bl = el('<div class="bench"></div>');
      if (!bench.length) bl.appendChild(el(U.emptyState('Everyone is fully allocated', 'Nothing is on the bench this month.', '', 'trend')));
      bench.slice(0, 12).forEach(function (e) {
        var card = el('<button class="bench-card" type="button">' +
          '<span class="avatar-sm" style="--hue:' + hueOf(e.dept) + '">' + esc(initials(e.name)) + '</span>' +
          '<span class="bc-t"><strong>' + esc(e.name) + '</strong><span class="sub">' + esc(e.dept) + '</span></span>' +
          '<span class="bc-v"><b class="num">' + money(e.unallocated) + '</b><span class="sub">' + (100 - e.allocatedPct) + '% free</span></span></button>');
        card.addEventListener('click', function () {
          a.view = 'employee'; a.sel = e.id; a.status = ''; a.dept = ''; a.q = ''; refresh();
          var node = document.querySelector('.p360'); if (node) node.scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
        bl.appendChild(card);
      });
      if (bench.length > 12) bl.appendChild(el('<div class="bench-more">' + (bench.length - 12) + ' more with free capacity — filter by “Under-allocated” above to see them all</div>'));
      f.appendChild(bl);
    }
    return f;
  };

  // the employee page hands off to this screen rather than carrying its own editor
  root.App.openAllocation = function (empId) {
    var a = st(root.App.state);
    a.view = 'employee'; a.q = ''; a.dept = ''; a.status = ''; a.project = ''; a.sel = empId;
    root.App.go('allocations');
    setTimeout(function () { var n = document.querySelector('.p360'); if (n) n.scrollIntoView({ block: 'start' }); }, 0);
  };

  function confirmCopy(month, prevM) {
    var body = el('<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div class="callout">This replaces every allocation in <strong>' + esc(C.mlabel(month)) +
      '</strong> with the one from <strong>' + esc(C.mlabel(prevM)) + '</strong>. ' +
      'Lines for projects that are not running in ' + esc(C.mlabel(month)) + ' are dropped. ' +
      esc(C.mlabel(prevM)) + ' itself is not touched, and you can undo this.</div></div>');
    var go = el('<button class="btn btn-primary" type="button">Copy ' + C.mshort(prevM) + ' → ' + C.mshort(month) + '</button>');
    go.addEventListener('click', function () {
      pushUndo(month, 'copying ' + C.mlabel(prevM) + ' forward');
      var res = C.copyAllocations(prevM, month);
      document.getElementById('dlg').close();
      refresh();
      U.toast('Copied ' + res.copied + ' allocations from ' + C.mlabel(prevM), {
        kind: 'success', action: { label: 'Undo', fn: undo },
        detail: res.dropped ? res.dropped + ' line(s) dropped for projects not running this month' : null
      });
    });
    root.App.openDialog('Copy allocation forward', body, [go], C.mlabel(prevM) + ' → ' + C.mlabel(month));
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================================
   Settings.

   Everything on this screen is live: change a control and the whole product
   reformats, re-bands or re-calendars on the spot. Choices are kept in this
   browser so the next visit opens the way you left it.
   ========================================================================== */
(function (root) {
  'use strict';
  var C = root.CTC, U = root.UI, V = root.VIEWS, H = root.VIEWHELP;
  var money = U.money, moneyK = U.moneyK, pct = U.pct, esc = U.esc, el = U.el;

  var CURRENCIES = [
    { v: 'USD', l: 'US dollar (USD)', sym: '$', loc: 'en-US' },
    { v: 'EUR', l: 'Euro (EUR)', sym: '€', loc: 'de-DE' },
    { v: 'GBP', l: 'Pound sterling (GBP)', sym: '£', loc: 'en-GB' },
    { v: 'INR', l: 'Indian rupee (INR)', sym: '₹', loc: 'en-IN' },
    { v: 'AED', l: 'UAE dirham (AED)', sym: 'AED ', loc: 'en-AE' },
    { v: 'SGD', l: 'Singapore dollar (SGD)', sym: 'S$', loc: 'en-SG' },
    { v: 'AUD', l: 'Australian dollar (AUD)', sym: 'A$', loc: 'en-AU' },
    { v: 'CAD', l: 'Canadian dollar (CAD)', sym: 'C$', loc: 'en-CA' }
  ];
  var DEFAULTS = {
    theme: 'system', density: 'comfortable',
    currency: 'USD', scale: 'international', pctDp: 1,
    bandHealthy: 35, bandWatch: 20,
    allocStep: 5, fiscalStart: 1, navCollapsed: false, navGroups: {},
    defaultPeriod: 'month', landing: 'dashboard'
  };
  var state = null;

  function load() {
    var out = {};
    Object.keys(DEFAULTS).forEach(function (k) { out[k] = DEFAULTS[k]; });
    try {
      var raw = localStorage.getItem('c2c-settings');
      if (raw) {
        var saved = JSON.parse(raw);
        Object.keys(DEFAULTS).forEach(function (k) { if (saved[k] != null) out[k] = saved[k]; });
      }
    } catch (e) { }
    return out;
  }
  function save() { try { localStorage.setItem('c2c-settings', JSON.stringify(state)); } catch (e) { } }

  function apply() {
    var cur = CURRENCIES.filter(function (c) { return c.v === state.currency; })[0] || CURRENCIES[0];
    U.setFormat({ symbol: cur.sym, locale: cur.loc, scale: state.scale, pctDp: +state.pctDp });
    U.BANDS.healthy = state.bandHealthy / 100;
    U.BANDS.watch = state.bandWatch / 100;
    C.setFiscalStart(+state.fiscalStart);
    U.setDensity(state.density === 'compact');
    var r = document.documentElement;
    if (state.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', state.theme);
    var foot = document.getElementById('rail-count');
    if (foot) foot.textContent = C.MONTHS.length + ' months';
    var cl = document.getElementById('rail-currency');
    if (cl) cl.textContent = state.currency + ' · monthly ledger';
  }
  function set(k, v) { state[k] = v; save(); if (k === 'density') U.setDensity(v === 'compact'); apply(); }

  root.SET = {
    get: function () { return state || (state = load()); },
    set: set, apply: apply, currencies: CURRENCIES, defaults: DEFAULTS,
    reset: function () { state = null; try { localStorage.removeItem('c2c-settings'); } catch (e) { } state = load(); apply(); }
  };
  state = load();

  /* ---------- controls ----------------------------------------------------- */
  function row(label, hint, control) {
    var r = el('<div class="set-row"><div class="set-lab"><strong>' + esc(label) + '</strong>' +
      (hint ? '<span>' + hint + '</span>' : '') + '</div></div>');
    r.appendChild(control);
    return r;
  }
  /* Change your own password. Available to every role, viewers included -
     locking a read-only account out of its own credentials helps nobody. */
  function myPasswordForm() {
    var cur  = U.field({ label: 'Current password', type: 'password', required: true });
    var pair = U.passwordPair();
    var msg  = el('<div style="min-height:17px;font-size:12px"></div>');
    var go   = H.btn('Change password', 'btn-primary', function () {
      msg.textContent = ''; msg.className = '';
      cur.clear();
      if (!cur.value()) { cur.fail('Enter your current password.'); return; }
      if (!pair.validate()) return;
      if (cur.value() === pair.value()) { pair.fields[0].fail('That is already your password.'); return; }
      go.disabled = true;
      C.setOwnPassword(cur.value(), pair.value()).then(function (out) {
        go.disabled = false;
        if (out && out.ok) {
          cur.input.value = ''; cur.clear(); pair.clear();
          msg.className = 'ok';
          msg.textContent = 'Password changed. Any other sign-in for your account has been signed out.';
          U.toast('Password changed', { kind: 'success' });
        } else {
          msg.className = 'err';
          msg.textContent = (out && out.data && out.data.message) || 'That change could not be saved.';
        }
      });
    });
    var w = el('<div style="display:flex;flex-direction:column;gap:11px;min-width:min(420px,100%)"></div>');
    w.appendChild(U.formGrid([cur].concat(pair.fields)));
    w.appendChild(msg);
    var bar = el('<div></div>'); bar.appendChild(go); w.appendChild(bar);
    return w;
  }

  function seg(value, options, onPick) {
    var w = el('<div class="seg-toggle" role="group"></div>');
    options.forEach(function (o) {
      var b = el('<button type="button" aria-pressed="' + (String(o.v) === String(value)) + '">' + esc(o.l) + '</button>');
      b.addEventListener('click', function () { onPick(o.v); });
      w.appendChild(b);
    });
    return w;
  }
  function select(value, options, onPick) {
    var w = el('<select>' + options.map(function (o) {
      return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(value) ? ' selected' : '') + '>' + esc(o.l) + '</option>';
    }).join('') + '</select>');
    w.addEventListener('change', function () { onPick(w.value); });
    return w;
  }

  /* ---------- the screen --------------------------------------------------- */
  V.settings = function (s) {
    var f = document.createDocumentFragment();
    var S = root.SET.get();
    function change(k, v) { set(k, v); root.App.render(); }

    f.appendChild(H.head('Settings',
      'Every control here takes effect immediately across the product, and is remembered in this browser.',
      [H.btn('Restore defaults', '', function () { root.SET.reset(); root.App.render(); })]));

    /* --- appearance --- */
    f.appendChild(H.section('Appearance'));
    var app = el('<div class="set-list"></div>');
    app.appendChild(row('Theme', 'System follows your operating system setting.',
      seg(S.theme, [{ v: 'system', l: 'System' }, { v: 'light', l: 'Light' }, { v: 'dark', l: 'Dark' }],
        function (v) { change('theme', v); })));
    app.appendChild(row('Navigation', 'Collapse the side navigation to icons only. The header button toggles it too.',
      seg(S.navCollapsed ? 'icons' : 'full', [{ v: 'full', l: 'Labels' }, { v: 'icons', l: 'Icons only' }],
        function (v) { set('navCollapsed', v === 'icons'); root.App.renderNav(); root.App.render(); })));
    app.appendChild(row('Table density', 'Compact fits roughly a third more rows on screen.',
      seg(S.density, [{ v: 'comfortable', l: 'Comfortable' }, { v: 'compact', l: 'Compact' }],
        function (v) { change('density', v); })));
    f.appendChild(U.panel('Display', null, app, true));

    /* --- numbers --- */
    f.appendChild(H.section('Numbers and currency'));
    var num = el('<div class="set-list"></div>');
    num.appendChild(row('Currency', 'Changes the symbol and digit grouping. Figures are <strong>not</strong> converted — the ledger stays in its recorded amounts.',
      select(S.currency, root.SET.currencies.map(function (c) { return { v: c.v, l: c.l }; }), function (v) { change('currency', v); })));
    num.appendChild(row('Large numbers', 'How abbreviated figures are written on tiles and charts.',
      seg(S.scale, [{ v: 'international', l: 'K / M' }, { v: 'indian', l: 'Lakh / Crore' }, { v: 'full', l: 'Full digits' }],
        function (v) { change('scale', v); })));
    num.appendChild(row('Percentage precision', 'Decimal places on every margin and share.',
      seg(String(S.pctDp), [{ v: '0', l: '0' }, { v: '1', l: '1' }, { v: '2', l: '2' }],
        function (v) { change('pctDp', +v); })));
    var sample = C.rollup(s.month).company;
    num.appendChild(row('Preview', 'Live sample using this month’s figures.',
      el('<div class="set-preview"><span><b>' + money(sample.revenue) + '</b>full</span>' +
        '<span><b>' + moneyK(sample.revenue) + '</b>abbreviated</span>' +
        '<span><b>' + pct(sample.margin) + '</b>margin</span>' +
        '<span><b>' + moneyK(sample.employeeCost) + '</b>employee cost</span></div>')));
    f.appendChild(U.panel('Formatting', null, num, true));

    /* --- calendar --- */
    f.appendChild(H.section('Reporting calendar'));
    var cal = el('<div class="set-list"></div>');
    var months = C.MONTH_NAMES.map(function (n, i) { return { v: i + 1, l: n }; });
    cal.appendChild(row('Financial year starts in', 'Drives Quarter, Year to date and Full year everywhere. Monthly records are untouched.',
      select(S.fiscalStart, months, function (v) { change('fiscalStart', +v); })));
    var q = C.monthsFor('quarter', s.month), y = C.monthsFor('ytd', s.month), fy = C.monthsFor('year', s.month);
    cal.appendChild(row('Resolves to', 'For the reporting month ' + esc(C.mlabel(s.month)) + '.',
      el('<div class="set-preview"><span><b>' + esc(C.fiscalLabel(s.month)) + '</b>financial year</span>' +
        '<span><b>Q' + C.mquarter(s.month) + '</b>' + esc(C.mshort(q[0]) + ' – ' + C.mshort(q[q.length - 1])) + '</span>' +
        '<span><b>' + y.length + ' months</b>year to date</span>' +
        '<span><b>' + esc(C.mshort(fy[0]) + ' – ' + C.mshort(fy[fy.length - 1])) + '</b>full year</span></div>')));
    f.appendChild(U.panel('Financial year', null, cal, true));

    /* --- margin bands, with live counts --- */
    f.appendChild(H.section('Margin bands'));
    var bandBox = el('<div class="set-list"></div>');
    var counts = el('<div class="set-preview"></div>');
    function drawCounts() {
      var rows = C.aggregateBy([s.month], 'project');
      var b = { healthy: 0, watch: 0, critical: 0, loss: 0 };
      rows.forEach(function (r) { b[U.band(r.margin).key]++; });
      counts.innerHTML =
        '<span><b class="pill good">' + b.healthy + '</b>healthy</span>' +
        '<span><b class="pill watch">' + b.watch + '</b>watch</span>' +
        '<span><b class="pill crit">' + b.critical + '</b>critical</span>' +
        '<span><b class="pill loss">' + b.loss + '</b>loss making</span>';
    }
    function slider(key, label, hint, min, max) {
      var wrap = el('<div class="set-slider"><input type="range" min="' + min + '" max="' + max + '" step="1" value="' + S[key] + '">' +
        '<output>' + S[key] + '%</output></div>');
      var inp = wrap.querySelector('input'), out = wrap.querySelector('output');
      inp.addEventListener('input', function () {
        out.textContent = inp.value + '%';
        state[key] = +inp.value;
        U.BANDS.healthy = state.bandHealthy / 100; U.BANDS.watch = state.bandWatch / 100;
        drawCounts();
      });
      inp.addEventListener('change', function () { change(key, +inp.value); });
      return row(label, hint, wrap);
    }
    bandBox.appendChild(slider('bandHealthy', 'Healthy at or above', 'Anything between the two thresholds is Watch.', 5, 80));
    bandBox.appendChild(slider('bandWatch', 'Critical below', 'A negative margin is always Loss making.', 0, 60));
    bandBox.appendChild(row('Projects in each band', 'Recounts as you drag, for ' + esc(C.mlabel(s.month)) + '.', counts));
    drawCounts();
    if (S.bandWatch >= S.bandHealthy) {
      bandBox.appendChild(el('<div class="callout" style="border-left-color:var(--err)">The critical threshold sits at or above the healthy one, so nothing can land in Watch. Lower it to open the middle band.</div>'));
    }
    f.appendChild(U.panel('Thresholds', 'Used by the dashboard, project analytics and the management report', bandBox, true));

    /* --- allocation + defaults --- */
    f.appendChild(H.section('Allocation and defaults'));
    var g = el('<div class="grid-2"></div>');
    var al = el('<div class="set-list"></div>');
    al.appendChild(row('Percentage step', 'How much the − and + buttons move an allocation.',
      seg(String(S.allocStep), [{ v: '1', l: '1%' }, { v: '5', l: '5%' }, { v: '10', l: '10%' }],
        function (v) { change('allocStep', +v); })));
    g.appendChild(U.panel('Allocation', null, al, true));
    var df = el('<div class="set-list"></div>');
    df.appendChild(row('Opening screen', 'Where the product starts.',
      select(S.landing, [{ v: 'dashboard', l: 'Dashboard' }, { v: 'allocations', l: 'Allocation' },
      { v: 'projects', l: 'Projects' }, { v: 'report-management', l: 'Management report' }],
        function (v) { change('landing', v); })));
    df.appendChild(row('Default period', 'Applied on screens that accept a period.',
      select(S.defaultPeriod, [{ v: 'month', l: 'This month' }, { v: 'quarter', l: 'Quarter' },
      { v: 'ytd', l: 'Year to date' }, { v: 'trailing12', l: 'Last 12 months' }],
        function (v) { change('defaultPeriod', v); })));
    g.appendChild(U.panel('Defaults', null, df, true));
    f.appendChild(g);

    /* --- account --- */
    var who = root.AUTH && root.AUTH.user ? root.AUTH.user() : null;
    f.appendChild(H.section('Account'));
    var acct = el('<div class="set-list"></div>');
    if (who) {
      acct.appendChild(row('Signed in as', 'Your role decides what you may change. It is set by the owner.',
        el('<div class="set-preview"><span><b>' + esc(who.email || '') + '</b></span>' +
           '<span><b>' + esc(who.role || '') + '</b>role</span></div>')));
    }
    acct.appendChild(row('Change my password',
      'You stay signed in here. Every other sign-in for your account is ended, on this computer and any other.',
      myPasswordForm()));
    if (who && who.role === 'owner') {
      acct.appendChild(row('Reset someone else', 'Owners can set a new password for any account in the organization.',
        H.btn('Open administration', '', function () { root.App.go('admin', { tab: 'accounts' }); })));
    }
    f.appendChild(U.panel('Account', null, acct, true));

    /* --- data --- */
    f.appendChild(H.section('Data'));
    var data = el('<div class="set-list"></div>');
    data.appendChild(row('Saved in this browser', 'Every change is saved automatically. To clear everything and enter your own records, or to bring the demo back, go to Administration → Backup & restore.', H.btn('Open administration', '', function () { root.App.go('admin', { tab: 'backup' }); })));
    data.appendChild(row('Scope', 'What this prototype holds.',
      el('<div class="set-preview"><span><b>' + C.MONTHS.length + '</b>months</span>' +
        '<span><b>' + C.CLIENTS.length + '</b>clients</span>' +
        '<span><b>' + C.PROJECTS.length + '</b>projects</span>' +
        '<span><b>' + C.EMPLOYEES.length + '</b>employees</span></div>')));
    f.appendChild(U.panel('Prototype data', null, data, true));

    var about = el('<div style="font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:11px">' +
      '<p style="margin:0"><strong style="color:var(--text)">Month is the unit of record.</strong> Revenue, employee cost, allocation and other cost are stored per month. Quarters, year to date and full year are sums of those months — there is no separate annual store to drift out of line.</p>' +
      '<p style="margin:0"><strong style="color:var(--text)">History does not move.</strong> Editing an allocation writes to the selected month only. Change October and September keeps the numbers it closed with.</p>' +
      '<p style="margin:0"><strong style="color:var(--text)">Rollup chain.</strong> Annual CTC → monthly cost → monthly allocation → project employee cost → + other project cost → project total cost → project profit and margin → client → company.</p>' +
      '<p style="margin:0"><strong style="color:var(--text)">Project margin vs company margin.</strong> A project only carries the cost booked to it. Bench time, internal work and company-level cost sit above the project line, which is why the company margin is the lower of the two. The dashboard shows the bridge between them.</p>' +
      '<p style="margin:0">Built for <strong style="color:var(--text)">Code to Click</strong> — AI-first Salesforce consulting. Names and figures are generated sample data shaped around the firm’s real service lines and sectors.</p>' +
      '</div>');
    f.appendChild(U.panel('How the numbers work', 'Worth reading once', about));
    return f;
  };

  /* apply saved choices, then repaint with them in force */
  apply();
  if (root.App) {
    var st = root.App.state;
    if (st.route === 'dashboard' && state.landing !== 'dashboard') st.route = state.landing;
    if (state.defaultPeriod !== 'month') st.period = state.defaultPeriod;
    root.App.render();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================================
   Administration.

   The register of record: create, amend, archive and delete clients, projects,
   people and software licences, plus a full backup you can take away and
   restore. The licence pane itself is built in part13, next to the engine
   that spreads a licence over its period — this screen only hosts it.

   Two rules the screen keeps visible, because they are the whole point of a
   monthly ledger:
     · an amendment applies from the reporting month forward — closed months
       keep the numbers they closed with;
     · deletion is the exception. It strips the record from every month, so it
       is confirmed separately from archiving, which preserves history.
   ========================================================================== */
(function (root) {
  'use strict';
  var C = root.CTC, U = root.UI, V = root.VIEWS, H = root.VIEWHELP;
  var money = U.money, pct = U.pct, esc = U.esc, el = U.el;

  var TABS = [
    { v: 'clients', l: 'Clients', i: 'clients', n: function () { return C.CLIENTS.length; } },
    { v: 'projects', l: 'Projects', i: 'projects', n: function () { return C.PROJECTS.length; } },
    { v: 'employees', l: 'People', i: 'employees', n: function () { return C.EMPLOYEES.length; } },
    { v: 'licences', l: 'Licences', i: 'licence', n: function () { return C.LICENCES.length; } },
    { v: 'backup', l: 'Backup & restore', i: 'archive', n: null },
    /* Owner only. The server enforces this too - hiding a tab is not a
       permission, and api/mutate.js assumes it is called directly. */
    { v: 'accounts', l: 'Accounts', i: 'employees', n: null,
      when: function () { return root.AUTH && root.AUTH.role() === 'owner'; } }
  ];
  function visibleTabs() {
    return TABS.filter(function (t) { return !t.when || t.when(); });
  }
  var TYPES = ['Fixed project', 'Retainer', 'Time & materials', 'Milestone'];
  var DISC = [
    { v: 'eng', l: 'Build / configuration' }, { v: 'data', l: 'Data 360' },
    { v: 'devops', l: 'Platform' }, { v: 'support', l: 'AMS' }
  ];

  function st(s) { if (!s.admin) s.admin = { tab: 'clients' }; if (s.params && s.params.tab) { s.admin.tab = s.params.tab; delete s.params.tab; } return s.admin; }
  function refresh() { var y = window.scrollY; root.App.render(); window.scrollTo(0, y); }

  /* ---------- form plumbing ------------------------------------------------ */
  var field = U.field, grid = U.formGrid, section = U.formSection;
  function form(rows) {
    var box = el('<div style="display:flex;flex-direction:column;gap:18px"></div>');
    rows.forEach(function (r) { if (r) box.appendChild(r); });
    return box;
  }
  function monthOpts() { return C.MONTHS.map(function (m) { return { v: m, l: C.mlabel(m) }; }); }
  function curSymbol() {
    var S = root.SET ? root.SET.get() : null;
    var c = S && root.SET.currencies.filter(function (x) { return x.v === S.currency; })[0];
    return c ? c.sym.trim() : '$';
  }
  function saved(what, name, detail) {
    U.toast(what + ' ' + name, { kind: 'success', detail: detail });
  }

  /* ---------- client ------------------------------------------------------- */
  function clientDialog(id) {
    var c = id ? C.byId(C.CLIENTS, id) : null;
    var name = field({ label: 'Client name', required: true, value: c ? c.name : '', placeholder: 'e.g. Ashfield University' });
    var ind = field({
      label: 'Sector', type: 'select', value: c ? c.industry : 'Higher education',
      options: ['Higher education', 'Nonprofit', 'Professional services', 'Retail'].map(function (x) { return { v: x, l: x }; }),
      hint: 'Code to Click reports by sector.'
    });
    var since = field({ label: 'Client since', type: 'select', value: c ? c.since : root.App.state.month, options: monthOpts(), hint: 'Reporting only — it creates no revenue.' });
    var body = form([grid([name, ind]), since]);
    var go = el('<button class="btn btn-primary" type="button">' + (c ? 'Save changes' : 'Create client') + '</button>');
    go.addEventListener('click', function () {
      var n = name.value().trim();
      if (!n) return name.fail('Give the client a name.');
      var clash = C.CLIENTS.filter(function (x) { return x.name.toLowerCase() === n.toLowerCase() && x.id !== id; })[0];
      if (clash) return name.fail('There is already a client called ' + clash.name + '.');
      if (c) C.updateClient(id, { name: n, industry: ind.value(), since: since.value() });
      else C.addClient({ name: n, industry: ind.value(), since: since.value() });
      document.getElementById('dlg').close();
      saved(c ? 'Updated' : 'Added', n, c ? null : 'Add a project to start booking revenue against it.');
      refresh();
    });
    root.App.openDialog(c ? 'Edit client' : 'New client', body, [go],
      c ? 'Changes apply everywhere immediately. Records already booked are untouched.' : 'A client is a reporting grouping; revenue is booked to its projects.');
  }

  /* ---------- project ------------------------------------------------------ */
  function projectDialog(id) {
    var p = id ? C.byId(C.PROJECTS, id) : null;
    var m = root.App.state.month;
    var name = field({ label: 'Project name', required: true, value: p ? p.name : '', placeholder: 'e.g. Agentforce Service Rollout' });
    var client = field({
      label: 'Client', required: true, type: 'select', value: p ? p.clientId : (C.CLIENTS[0] || {}).id,
      options: C.CLIENTS.slice().sort(function (a2, b2) { return a2.name.localeCompare(b2.name); })
        .map(function (c) { return { v: c.id, l: c.name }; })
    });
    var type = field({ label: 'Engagement type', type: 'select', value: p ? p.type : 'Fixed project', options: TYPES.map(function (t) { return { v: t, l: t }; }) });
    var disc = field({ label: 'Delivery discipline', type: 'select', value: p ? p.disc : 'eng', options: DISC, hint: 'Used when suggesting who to staff it with.' });
    var start = field({ label: 'Starts', type: 'select', value: p ? p.start : m, options: monthOpts(), hint: 'The first month it can carry revenue or people.' });
    var rev = field({
      label: 'Revenue for ' + C.mlabel(m), type: 'number', step: 100, min: 0, prefix: curSymbol(),
      value: p ? (C.snapshot(m).revenue[p.id] || 0) : '', placeholder: '0',
      hint: p ? 'Changes <strong>' + esc(C.mlabel(m)) + '</strong> only — other months keep their own figure.'
        : 'Booked into every month from the start month onwards. Any single month can be changed later.'
    });
    var bill = el('<label class="chk"><input type="checkbox"' + (!p || p.billable !== false ? ' checked' : '') + '><span><strong>Billable project</strong>' +
      '<small>Earns revenue and has a margin. Untick for internal tooling, R&amp;D, pre-sales or a free pilot: its cost is tracked in full but counted as internal time and overhead, and it never appears in margin rankings.</small></span></label>');
    var billIn = bill.querySelector('input');
    function syncBill() { rev.hidden = !billIn.checked; }
    billIn.addEventListener('change', syncBill); syncBill();
    var body = form([
      grid([name, client]), grid([type, disc]), bill, section('Money'), grid([start, rev])
    ]);
    var go = el('<button class="btn btn-primary" type="button">' + (p ? 'Save changes' : 'Create project') + '</button>');
    go.addEventListener('click', function () {
      var n = name.value().trim();
      if (!n) return name.fail('Give the project a name.');
      if (!client.value()) return client.fail('Create a client first — the list is empty.');
      var billable = billIn.checked;
      var amount = !billable || rev.value() === '' ? null : Math.max(0, +rev.value() || 0);
      if (p) {
        C.updateProject(id, { name: n, clientId: client.value(), type: type.value(), disc: disc.value(), start: start.value(), billable: billable });
        if (amount != null && C.isActiveProj(C.byId(C.PROJECTS, id), m)) C.setRevenue(m, id, amount);
        saved('Updated', n, amount != null ? C.mlabel(m) + ' revenue set to ' + money(amount) : null);
      } else {
        C.addProject({ clientId: client.value(), name: n, type: type.value(), disc: disc.value(), start: start.value(), billable: billable, revenue: amount || 0 });
        saved('Added', n, amount ? money(amount) + ' a month from ' + C.mlabel(start.value()) + '. Staff it from the Allocation screen.'
          : 'Staff it from the Allocation screen to start putting cost against it.');
      }
      document.getElementById('dlg').close();
      refresh();
    });
    root.App.openDialog(p ? 'Edit project' : 'New project', body, [go],
      p ? 'Edits apply from ' + C.mlabel(m) + '. Closed months keep the figures they closed with.' : null);
  }

  function archiveDialog(id) {
    var p = C.byId(C.PROJECTS, id);
    var when = field({ label: 'Runs until the end of', type: 'select', value: p.end || root.App.state.month, options: monthOpts() });
    var body = form([
      el('<div class="callout">Archiving closes <strong>' + esc(p.name) + '</strong> after the month you choose. ' +
        'Every month up to and including it keeps its revenue, cost and allocation exactly as recorded — nothing is erased.</div>'),
      when
    ]);
    var go = el('<button class="btn btn-primary" type="button">Archive project</button>');
    go.addEventListener('click', function () {
      C.archiveProject(id, when.value());
      document.getElementById('dlg').close();
      U.toast(p.name + ' archived', { kind: 'success', detail: 'Runs to the end of ' + C.mlabel(when.value()) + '. History is intact.' });
      refresh();
    });
    root.App.openDialog('Archive project', body, [go], 'The safe way to stop a project — history stays exactly as reported.');
  }

  /* ---------- employee ----------------------------------------------------- */
  function employeeDialog(id) {
    var e0 = id ? C.byId(C.EMPLOYEES, id) : null;
    var m = root.App.state.month;
    var cur = id && C.rollup(m).byEmployee[id];
    var name = field({ label: 'Name', required: true, value: e0 ? e0.name : '', placeholder: 'Full name' });
    var title = field({ label: 'Role', value: e0 ? e0.title : '', placeholder: 'e.g. Salesforce Developer' });
    var dept = field({
      label: 'Department', type: 'select', value: e0 ? e0.dept : 'Development',
      options: H.dedupe(C.EMPLOYEES.map(function (x) { return x.dept; })).sort().map(function (d) { return { v: d, l: d }; })
    });
    var disc = field({ label: 'Delivery discipline', type: 'select', value: e0 ? e0.disc : 'eng', options: DISC });
    var join = field({ label: 'Joining month', type: 'select', value: e0 ? e0.join : m, options: monthOpts(), hint: 'No cost is carried before this month.' });
    var ctc = field({
      label: 'Annual CTC', required: true, type: 'number', step: 600, min: 0, prefix: curSymbol(),
      value: cur ? cur.ctc : (e0 ? e0.baseCtc : 48000),
      hint: e0 ? 'Applies from <strong>' + esc(C.mlabel(m)) + '</strong> forward. Earlier months keep the cost they closed with.'
        : 'Divided by twelve to give the monthly cost.'
    });
    var out = U.readout('<b>' + money(0) + '</b> monthly cost');
    function calc() { out.innerHTML = '<b>' + money((+ctc.value() || 0) / 12) + '</b> monthly cost, charged from ' + esc(C.mlabel(join.value())); }
    ctc.input.addEventListener('input', calc);
    join.input.addEventListener('change', calc);
    calc();
    var body = form([
      grid([name, title]), grid([dept, disc]),
      section('Cost'), grid([join, ctc]), out
    ]);
    var go = el('<button class="btn btn-primary" type="button">' + (e0 ? 'Save changes' : 'Add person') + '</button>');
    go.addEventListener('click', function () {
      var n = name.value().trim(), v = +ctc.value() || 0;
      if (!n) return name.fail('Give this person a name.');
      if (v <= 0) return ctc.fail('Enter an annual CTC above zero.');
      if (e0) {
        C.updateEmployee(id, { name: n, title: title.value().trim() || 'Consultant', dept: dept.value(), disc: disc.value(), join: join.value() });
        var changed = v !== (cur ? cur.ctc : e0.baseCtc);
        if (changed) C.setEmployeeCtc(id, v, m);
        saved('Updated', n, changed ? 'CTC ' + money(v) + ' from ' + C.mlabel(m) + ' — earlier months unchanged.' : null);
      } else {
        C.addEmployee({ name: n, title: title.value().trim() || 'Consultant', dept: dept.value(), disc: disc.value(), ctc: v, join: join.value() });
        saved('Added', n, money(v / 12) + ' a month. Allocate them to start charging projects.');
      }
      document.getElementById('dlg').close();
      refresh();
    });
    root.App.openDialog(e0 ? 'Edit person' : 'Add a person', body, [go],
      e0 ? 'Pay changes apply from ' + C.mlabel(m) + ' forward.' : null);
  }

  /* ---------- delete, with the consequence spelled out --------------------- */
  function deleteDialog(kind, id) {
    var item = kind === 'client' ? C.byId(C.CLIENTS, id)
      : kind === 'project' ? C.byId(C.PROJECTS, id) : C.byId(C.EMPLOYEES, id);
    if (!item) return;
    var impact = [];
    if (kind === 'client') {
      var ps = C.clientProjects(id);
      impact.push(ps.length + ' project' + (ps.length === 1 ? '' : 's') + ' and every revenue, cost and allocation record attached to them');
      if (ps.length) impact.push('projects removed: ' + ps.map(function (p) { return p.name; }).join(', '));
    } else if (kind === 'project') {
      var months = C.MONTHS.filter(function (m) { return C.rollup(m).byProject[id]; });
      impact.push('revenue and cost in ' + months.length + ' month' + (months.length === 1 ? '' : 's'));
      impact.push('every allocation line pointing at it');
    } else {
      var ms = C.MONTHS.filter(function (m) { return C.rollup(m).byEmployee[id]; });
      impact.push('payroll cost in ' + ms.length + ' month' + (ms.length === 1 ? '' : 's'));
      impact.push('every allocation this person carries');
    }
    var confirm = field({ label: 'Type the name to confirm', required: true, placeholder: item.name,
      hint: 'Exactly: <strong>' + esc(item.name) + '</strong>' });
    var body = form([
      el('<div class="callout" style="border-left-color:var(--err)"><strong>This rewrites closed months.</strong> ' +
        'Deleting removes the record from the whole ledger, so months already reported will change. ' +
        (kind === 'project' ? 'To stop a project without touching history, archive it instead. ' : '') +
        'Take a backup first if you may need it back.</div>'),
      el('<div><div class="eyebrow" style="margin-bottom:6px">What goes</div><ul class="ol">' +
        impact.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'),
      confirm
    ]);
    var go = el('<button class="btn" type="button" style="background:var(--err);border-color:var(--err);color:#fff;font-weight:600">Delete permanently</button>');
    go.addEventListener('click', function () {
      if (confirm.value().trim() !== item.name) { confirm.fail('That is not the exact name, so nothing was deleted.'); return; }
      if (kind === 'client') C.deleteClient(id);
      else if (kind === 'project') C.deleteProject(id);
      else C.deleteEmployee(id);
      document.getElementById('dlg').close();
      U.toast('Deleted ' + item.name, { kind: 'error', detail: 'Removed from every month. Restore a backup if this was a mistake.' });
      refresh();
    });
    root.App.openDialog('Delete ' + kind, body, [go], 'This one cannot be undone from inside the product.');
  }

  /* ---------- row actions --------------------------------------------------- */
  /* Icon buttons rather than words: three text buttons cost ~180px of every
     row, three icons cost ~96px, and that width goes back to the columns that
     carry the numbers. The label survives as the accessible name, the hover
     tooltip, and the data-act the table's onAction reads back.               */
  var ACTS = {
    Edit: { icon: 'edit', tip: 'Edit details' },
    Delete: { icon: 'trash', tip: 'Delete from every month', danger: true },
    Archive: { icon: 'archive', tip: 'Close the project, keep its history' },
    Allocate: { icon: 'sliders', tip: 'Open the allocation workbench' }
  };
  function actionCell(list) {
    return '<div class="row-acts">' + list.map(function (label) {
      var a = ACTS[label] || { icon: 'edit', tip: label };
      return '<button type="button" class="row-act' + (a.danger ? ' danger' : '') +
        '" data-act="' + esc(label) + '" aria-label="' + esc(a.tip) + '" data-tip="' + esc(a.tip) + '">' +
        U.icon(a.icon) + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- tab bar -------------------------------------------------------
     Carbon line tabs: icon, label, and a live count of what is on each
     register, so the section header doubles as a summary.                    */
  function tabBar(a) {
    var bar = el('<div class="tabbar" role="tablist" aria-label="Administration sections"></div>');
    var btns = visibleTabs().map(function (t) {
      var on = a.tab === t.v;
      var b = el('<button type="button" role="tab" aria-selected="' + on + '" tabindex="' + (on ? 0 : -1) + '">' +
        U.icon(t.i) + '<span>' + esc(t.l) + '</span>' +
        (t.n ? '<em class="cnt">' + t.n() + '</em>' : '') + '</button>');
      b.addEventListener('click', function () { if (a.tab !== t.v) { a.tab = t.v; refresh(); } });
      bar.appendChild(b);
      return b;
    });
    bar.addEventListener('keydown', function (e) {
      var i = btns.indexOf(document.activeElement);
      if (i < 0) return;
      var to = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1
        : e.key === 'Home' ? 0 : e.key === 'End' ? btns.length - 1 : -1;
      if (to < 0 && to !== 0) return;
      e.preventDefault();
      btns[(to + btns.length) % btns.length].focus();
    });
    return bar;
  }

  /* ---------- the screen ---------------------------------------------------- */
  V.admin = function (s) {
    var a = st(s), m = s.month, f = document.createDocumentFragment();
    f.appendChild(H.head('Administration',
      'The register of record for clients, projects, people and software licences. Amendments apply from <strong>' +
      esc(C.mlabel(m)) + '</strong> forward; closed months keep what they closed with.'));

    f.appendChild(tabBar(a));

    if (a.tab === 'clients') f.appendChild(clientsPane(m));
    else if (a.tab === 'projects') f.appendChild(projectsPane(m));
    else if (a.tab === 'employees') f.appendChild(peoplePane(m));
    else if (a.tab === 'licences') f.appendChild(root.App.licencePane ? root.App.licencePane(m) : el('<div class="empty">Licences are unavailable.</div>'));
    else if (a.tab === 'accounts') f.appendChild(accountsPane());
    else f.appendChild(backupPane());
    return f;
  };

  function clientsPane(m) {
    var wrap = el('<div></div>');
    var r = C.rollup(m);
    var rows = C.CLIENTS.map(function (c) {
      var live = r.byClient[c.id];
      return {
        id: c.id, name: c.name, industry: c.industry, since: c.since,
        projects: C.clientProjects(c.id).length,
        revenue: live ? live.revenue : 0, margin: live ? live.margin : null
      };
    });
    var t = U.table([
      { key: 'name', label: 'Client', cell: function (x) { return '<strong>' + esc(x.name) + '</strong>'; } },
      { key: 'industry', label: 'Sector', cell: function (x) { return '<span class="tag">' + esc(x.industry) + '</span>'; } },
      { key: 'since', label: 'Since', cell: function (x) { return C.mshort(x.since); }, sortVal: function (x) { return C.mindex(x.since); } },
      { key: 'projects', label: 'Projects', num: true, cell: function (x) { return x.projects; } },
      { key: 'revenue', label: 'Revenue ' + C.mshort(m), num: true, cell: function (x) { return x.revenue ? money(x.revenue) : '<span class="muted">—</span>'; } },
      { key: 'margin', label: 'Margin', num: true, cell: function (x) { return x.margin == null ? '<span class="muted">—</span>' : U.marginPill(x.margin); } },
      {
        key: 'act', label: '', sortable: false, num: true, hideable: false, noExport: true,
        cell: function () { return actionCell(['Edit', 'Delete']); }
      }
    ], rows, {
      title: 'Client register', subtitle: 'Code to Click · ' + C.mlabel(m), exportName: 'Client register',
      sortKey: 'name', sortDir: 1, id: 'admin-clients',
      onAction: function (x, label) {
        if (label === 'Edit') clientDialog(x.id); else deleteDialog('client', x.id);
      }
    });
    var add = H.btn('New client', 'btn-primary', function () { clientDialog(null); }, 'plus');
    wrap.appendChild(U.panel('Clients', C.CLIENTS.length + ' on the register', t, true, add));
    return wrap;
  }

  function projectsPane(m) {
    var wrap = el('<div></div>');
    var r = C.rollup(m);
    var rows = C.PROJECTS.map(function (p) {
      var live = r.byProject[p.id];
      var cl = C.byId(C.CLIENTS, p.clientId);
      return {
        id: p.id, name: p.name, client: cl ? cl.name : '—', type: p.type,
        start: p.start, end: p.end,
        status: p.end && C.mindex(p.end) < C.mindex(m) ? 'Archived' : (C.isActiveProj(p, m) ? 'Running' : 'Not started'),
        revenue: live ? live.revenue : 0, margin: live ? live.margin : null
      };
    });
    var t = U.table([
      { key: 'name', label: 'Project', cell: function (x) { return '<strong>' + esc(x.name) + '</strong>'; } },
      { key: 'client', label: 'Client', cell: function (x) { return esc(x.client); } },
      { key: 'type', label: 'Type', cell: function (x) { return '<span class="tag">' + esc(x.type) + '</span>'; } },
      {
        key: 'status', label: 'Status', cell: function (x) {
          var cls = x.status === 'Running' ? 'good' : x.status === 'Archived' ? 'neutral' : 'watch';
          return '<span class="pill ' + cls + '">' + x.status + '</span>';
        }
      },
      { key: 'window', label: 'Runs', sortable: false, cell: function (x) { return C.mshort(x.start) + ' → ' + (x.end ? C.mshort(x.end) : 'open'); } },
      { key: 'revenue', label: 'Revenue ' + C.mshort(m), num: true, cell: function (x) { return x.revenue ? money(x.revenue) : '<span class="muted">—</span>'; } },
      { key: 'margin', label: 'Margin', num: true, cell: function (x) { return x.margin == null ? '<span class="muted">—</span>' : U.marginPill(x.margin); } },
      {
        key: 'act', label: '', sortable: false, num: true, hideable: false, noExport: true,
        cell: function () { return actionCell(['Edit', 'Archive', 'Delete']); }
      }
    ], rows, {
      title: 'Project register', subtitle: 'Code to Click · ' + C.mlabel(m), exportName: 'Project register',
      sortKey: 'name', sortDir: 1, id: 'admin-projects',
      onAction: function (x, label) {
        if (label === 'Edit') projectDialog(x.id);
        else if (label === 'Archive') archiveDialog(x.id);
        else deleteDialog('project', x.id);
      }
    });
    var add = H.btn('New project', 'btn-primary', function () { projectDialog(null); }, 'plus');
    wrap.appendChild(U.panel('Projects', C.PROJECTS.length + ' on the register · ' + rows.filter(function (x) { return x.status === 'Running'; }).length + ' running in ' + C.mlabel(m), t, true, add));
    return wrap;
  }

  function peoplePane(m) {
    var wrap = el('<div></div>');
    var r = C.rollup(m);
    var rows = C.EMPLOYEES.map(function (e) {
      var live = r.byEmployee[e.id];
      return {
        id: e.id, name: e.name, title: e.title, dept: e.dept, join: e.join,
        ctc: live ? live.ctc : 0, monthly: live ? live.monthlyCost : 0,
        alloc: live ? live.allocatedPct : null
      };
    });
    var t = U.table([
      { key: 'name', label: 'Name', cell: function (x) { return '<strong>' + esc(x.name) + '</strong><div class="muted" style="font-size:12px">' + esc(x.title) + '</div>'; } },
      { key: 'dept', label: 'Department', cell: function (x) { return '<span class="tag">' + esc(x.dept) + '</span>'; } },
      { key: 'join', label: 'Joined', cell: function (x) { return C.mshort(x.join); }, sortVal: function (x) { return C.mindex(x.join); } },
      { key: 'ctc', label: 'Annual CTC', num: true, cell: function (x) { return x.ctc ? money(x.ctc) : '<span class="muted">—</span>'; } },
      { key: 'monthly', label: 'Monthly cost', num: true, cell: function (x) { return x.monthly ? money(x.monthly) : '<span class="muted">—</span>'; } },
      {
        key: 'alloc', label: 'Allocated', num: true, cell: function (x) {
          if (x.alloc == null) return '<span class="muted">not yet joined</span>';
          var cls = x.alloc === 100 ? 'good' : x.alloc > 100 ? 'crit' : 'watch';
          return '<span class="pill ' + cls + '">' + x.alloc + '%</span>';
        }
      },
      {
        key: 'act', label: '', sortable: false, num: true, hideable: false, noExport: true,
        cell: function () { return actionCell(['Edit', 'Allocate', 'Delete']); }
      }
    ], rows, {
      title: 'People register', subtitle: 'Code to Click · ' + C.mlabel(m), exportName: 'People register',
      sortKey: 'name', sortDir: 1, id: 'admin-people',
      onAction: function (x, label) {
        if (label === 'Edit') employeeDialog(x.id);
        else if (label === 'Allocate') root.App.openAllocation(x.id);
        else deleteDialog('employee', x.id);
      }
    });
    var add = H.btn('Add person', 'btn-primary', function () { employeeDialog(null); }, 'plus');
    wrap.appendChild(U.panel('People', C.EMPLOYEES.length + ' on the register', t, true, add));
    return wrap;
  }

  /* ---------- backup and restore -------------------------------------------- */
  function backupPane() {
    var wrap = el('<div class="stack"></div>');

    var take = el('<div class="set-list"></div>');
    var dlBtn = H.btn('Download backup (.json)', 'btn-primary', function () {
      var state = C.exportState();
      var stamp = new Date().toISOString().slice(0, 10);
      root.EXP.saveFile('codetoclick-backup-' + stamp + '.json', JSON.stringify(state, null, 1));
    }, 'download');
    take.appendChild(rowOf('Full backup', 'Every client, project and person, plus the complete monthly ledger — revenue, costs and allocation for all ' +
      C.MONTHS.length + ' months. One JSON file that restores the product exactly as it stands.', dlBtn));

    var csvBtn = H.btn('Registers as CSV', '', function () {
      root.EXP.exportCSV({
        name: 'Client register', title: 'Client register', subtitle: 'Code to Click',
        cols: [{ label: 'Client' }, { label: 'Sector' }, { label: 'Since' }, { label: 'Projects', num: true }],
        rows: C.CLIENTS.map(function (c) { return [c.name, c.industry, C.mlabel(c.since), String(C.clientProjects(c.id).length)]; })
      });
    }, 'download');
    take.appendChild(rowOf('Registers as spreadsheets', 'Each register also exports from its own tab — the Export button above every table offers Excel, PDF and clipboard.', csvBtn));
    wrap.appendChild(U.panel('Take a backup', 'Keep one before any deletion', take, true));

    var put = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');
    put.appendChild(el('<div class="callout" style="border-left-color:var(--warn-line)"><strong>Restoring replaces everything.</strong> ' +
      'Every client, project, person and month in this session is overwritten by the file. Take a backup first if the current state matters.</div>'));
    var file = el('<input type="file" accept="application/json,.json">');
    var status = el('<div class="err" style="min-height:18px"></div>');
    var pending = null;
    var restore = H.btn('Restore from this file', '', function () {
      if (!pending) { status.className = 'err'; status.textContent = 'Choose a backup file first.'; return; }
      var res = C.importState(pending);
      if (!res.ok) { status.className = 'err'; status.textContent = res.error; return; }
      status.className = 'ok';
      status.textContent = 'Restored ' + res.clients + ' clients, ' + res.projects + ' projects, ' +
        res.employees + ' people and ' + res.months + ' months.';
      U.toast('Backup restored', { kind: 'success', detail: status.textContent });
      pending = null;
      refresh();
    }, 'upload');
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { pending = JSON.parse(rd.result); status.className = 'ok'; status.textContent = 'Read ' + f.name + ' — press Restore to apply it.'; }
        catch (err) { pending = null; status.className = 'err'; status.textContent = 'That file is not valid JSON.'; }
      };
      rd.readAsText(f);
    });
    var fileWrap = el('<div class="fld"><span class="fl-label">Backup file</span></div>');
    fileWrap.appendChild(file);
    fileWrap.appendChild(el('<div class="fl-hint">A .json file taken from this screen.</div>'));
    put.appendChild(fileWrap);
    put.appendChild(restore);
    put.appendChild(status);
    wrap.appendChild(U.panel('Restore', null, put));

    /* ---- your data or the demo ------------------------------------------- */
    var own = C.dataMode() === 'own';
    var data = el('<div class="set-list"></div>');
    var saved = C.persistedAt();
    data.appendChild(rowOf('What this browser holds',
      (own ? '<span class="pill good">Your data</span> Only records you created. ' : '<span class="pill neutral">Demo data</span> The generated sample company. ') +
      'Every change is saved in this browser automatically' + (saved ? ' — last saved ' + esc(new Date(saved).toLocaleString()) : '') +
      '. Use a backup file to move it to another computer.',
      el('<div class="set-preview"><span><b>' + C.CLIENTS.length + '</b>clients</span><span><b>' + C.PROJECTS.length + '</b>projects</span>' +
        '<span><b>' + C.EMPLOYEES.length + '</b>people</span><span><b>' + C.LICENCES.length + '</b>licences</span></div>')));

    var clearBtn = H.btn('Clear all data', 'btn-danger', function () { clearDialog(); }, 'trash');
    data.appendChild(rowOf('Start with an empty company', 'Removes every client, project, person, licence and every month of revenue, cost and allocation, so you can enter your own records and check every calculation from zero. Take a backup first if you want the demo back later.', clearBtn));

    var demoBtn = H.btn('Restore demo data', '', function () {
      root.App.openDialog('Restore the demo company?',
        el('<div class="callout" style="border-left-color:var(--warn-line)">This replaces everything in this browser with the generated sample company. Records you created are lost unless you have a backup.</div>'),
        [H.btn('Restore demo', 'btn-primary', function () {
          C.restoreDemo(); document.getElementById('dlg').close();
          U.toast('Demo data restored', { kind: 'success', detail: C.CLIENTS.length + ' clients, ' + C.PROJECTS.length + ' projects, ' + C.EMPLOYEES.length + ' people across ' + C.MONTHS.length + ' months.' });
          root.App.go('dashboard');
        })], 'No undo — only a backup file brings your records back.');
    });
    data.appendChild(rowOf('Back to the sample company', own ? 'Puts the generated demo back so you can compare against the reference figures (September 2026: revenue $285,400, cost $187,200, margin 34.4%).' : 'Rebuilds the sample company from scratch, discarding every edit made here.', demoBtn));
    wrap.appendChild(U.panel('Your data', 'No undo on either of these', data, true));
    return wrap;
  }

  function clearDialog() {
    var body = el('<div class="stack" style="gap:14px"></div>');
    body.appendChild(el('<div class="callout" style="border-left-color:var(--err-line)"><strong>This empties the whole product.</strong> ' +
      C.CLIENTS.length + ' clients, ' + C.PROJECTS.length + ' projects, ' + C.EMPLOYEES.length + ' people, ' + C.LICENCES.length + ' licences and all ' + C.MONTHS.length + ' months of records are removed. There is no undo.</div>'));
    var typed = U.field({ label: 'Type CLEAR to confirm', type: 'text', placeholder: 'CLEAR' });
    body.appendChild(typed);
    var go = H.btn('Clear everything', 'btn-danger', function () {
      if (typed.value().trim().toUpperCase() !== 'CLEAR') return typed.fail('Type CLEAR in capitals to confirm.');
      C.clearAll();
      document.getElementById('dlg').close();
      U.toast('All data cleared', { kind: 'warn', detail: 'You are starting from an empty company. Add a client first, then a project, then people.' });
      root.App.go('admin', { tab: 'backup' });
    }, 'trash');
    root.App.openDialog('Clear all data', body, [go], 'Start from an empty company');
  }
  /* ---------- accounts ------------------------------------------------------ */
  function accountsPane() {
    var wrap = el('<div class="stack"></div>');
    var me = root.AUTH && root.AUTH.user ? root.AUTH.user() : null;
    var others = C.USERS.filter(function (u) { return !me || u.email !== me.email; });

    var list = el('<div class="set-list"></div>');
    C.USERS.forEach(function (u) {
      var mine = me && u.email === me.email;
      list.appendChild(rowOf(u.name || u.email,
        esc(u.email) + ' &middot; ' + esc(u.role) + (mine ? ' &middot; this is you' : '') +
        (u.active === false ? ' &middot; <span class="tag">inactive</span>' : ''),
        el('<span class="tag">' + esc(u.role) + '</span>')));
    });
    wrap.appendChild(U.panel('Accounts', C.USERS.length + ' sign-in' + (C.USERS.length === 1 ? '' : 's') +
      ' in this organization', list, true));

    var put = el('<div style="display:flex;flex-direction:column;gap:12px"></div>');
    put.appendChild(el('<div class="callout" style="border-left-color:var(--warn-line)">' +
      '<strong>A reset signs that person out everywhere.</strong> Every session they have open ends ' +
      'immediately, which is the point if the password leaked. They will need the new password to get ' +
      'back in, so tell them what it is.</div>'));

    if (!others.length) {
      put.appendChild(el('<div class="empty">There is no other account in this organization to reset.</div>'));
      wrap.appendChild(U.panel('Reset a password', null, put, true));
      return wrap;
    }

    var pick = U.field({ label: 'Account', type: 'select', required: true,
      options: others.map(function (u) {
        return { v: u.email, l: (u.name || u.email) + ' - ' + u.email + ' (' + u.role + ')' };
      }) });
    var pair = U.passwordPair('New password for this account');
    var msg  = el('<div style="min-height:17px;font-size:12px"></div>');
    var go   = H.btn('Reset this password', 'btn-primary', function () {
      msg.textContent = ''; msg.className = '';
      if (!pair.validate()) return;
      go.disabled = true;
      C.adminSetPassword(pick.value(), pair.value()).then(function (out) {
        go.disabled = false;
        if (out && out.ok) {
          pair.clear();
          msg.className = 'ok';
          msg.textContent = 'Password reset for ' + pick.value() + '. Their sessions have ended.';
          U.toast('Password reset', { kind: 'success', detail: pick.value() + ' must sign in again.' });
        } else {
          msg.className = 'err';
          msg.textContent = (out && out.data && out.data.message) || 'That change could not be saved.';
        }
      });
    });
    put.appendChild(U.formGrid([pick].concat(pair.fields)));
    put.appendChild(msg);
    var bar = el('<div></div>'); bar.appendChild(go); put.appendChild(bar);
    put.appendChild(el('<div class="fl-hint">To change your own password, use Settings - it keeps you ' +
      'signed in and asks for your current one.</div>'));
    wrap.appendChild(U.panel('Reset a password', 'Owner only', put, true));
    return wrap;
  }

  function rowOf(label, hint, control) {
    var r = el('<div class="set-row"><div class="set-lab"><strong>' + esc(label) + '</strong><span>' + hint + '</span></div></div>');
    r.appendChild(control);
    return r;
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================================
   Software and licences.

   A licence is bought once and paid for over a period; the product spreads the
   price evenly across the months of that period and charges each month's
   share to the people who use it. Project-specific licences are project cost,
   split across that project's team for the month. Company-wide licences are
   overhead, split across everyone on payroll. Each person's share sits beside
   their payroll as "software cost", so their loaded cost is visible.

   The charge is derived from the register every time a month is computed; it
   is never typed into a month, so a licence edited today re-states the months
   it covers. That is the honest behaviour for a contract: the price and the
   period are facts about the purchase, not about the month.
   ========================================================================== */
(function (root) {
  'use strict';
  var C = root.CTC, U = root.UI, V = root.VIEWS, H = root.VIEWHELP;
  var money = U.money, moneyK = U.moneyK, pct = U.pct, esc = U.esc, el = U.el, icon = U.icon;
  var field = U.field, grid = U.formGrid, section = U.formSection;

  function monthOpts() { return C.MONTHS.map(function (m) { return { v: m, l: C.mlabel(m) }; }); }
  function monthly(l) { return l.price / l.months; }
  function periodLabel(l) { return C.mshort(l.start) + ' → ' + C.mshort(C.licenceEnd(l)); }
  function statusOf(l, month) {
    if (C.licenceActive(l, month)) return { cls: 'good', label: 'Active' };
    if (C.mindex(month) < C.mindex(l.start)) return { cls: 'watch', label: 'Starts ' + C.mshort(l.start) };
    return { cls: 'neutral', label: 'Ended ' + C.mshort(C.licenceEnd(l)) };
  }
  function refresh() { var y = window.scrollY; root.App.render(); window.scrollTo(0, y); }

  /* ---------- add / edit dialog --------------------------------------------- */
  root.App.dialogs.licence = function (id) { licenceDialog(id || null); };
  function licenceDialog(id) {
    var l = id ? C.byId(C.LICENCES, id) : null;
    var s = root.App.state;
    var name = field({ label: 'Licence', required: true, value: l ? l.name : '', placeholder: 'e.g. Salesforce Developer Pro Sandbox' });
    var vendor = field({ label: 'Vendor', value: l ? l.vendor : '', placeholder: 'e.g. Salesforce' });
    var price = field({ label: 'Total price', type: 'number', min: 0, step: 100, prefix: (root.SET && root.SET.get().currency === 'INR') ? '₹' : '$', value: l ? l.price : 0, required: true });
    var start = field({ label: 'Licence starts', type: 'select', value: l ? l.start : s.month, options: monthOpts() });
    var months = field({ label: 'Period (months)', type: 'number', min: 1, max: 60, step: 1, value: l ? l.months : 12, required: true, hint: 'The price is spread evenly over these months.' });
    var note = field({ label: 'Note', value: l ? l.note : '', placeholder: 'Optional' });
    var out = U.readout('');

    function sync() {
      var pr = +price.value() || 0, n = Math.max(1, +months.value() || 1);
      var per = pr / n, st = start.value(), end = C.maddMonths(st, n - 1);
      var carriers = C.rollup(s.month).company.headcount;
      var inMonth = C.mindex(s.month) >= C.mindex(st) && C.mindex(s.month) <= C.mindex(end);
      out.set('<strong>' + money(per) + ' a month</strong> from ' + esc(C.mshort(st)) + ' to ' + esc(C.mshort(end)) +
        (inMonth ? ' · in ' + esc(C.mshort(s.month)) + (carriers ? ' that is <strong>' + money(per / carriers) + '</strong> each across ' + carriers + ' people, reaching projects through their allocation' : ', but nobody is on payroll yet') : ' · not in ' + esc(C.mshort(s.month))));
    }
    [price, start, months].forEach(function (f) { f.input.addEventListener('input', sync); f.input.addEventListener('change', sync); });
    sync();
