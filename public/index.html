    display:flex;flex-direction:column}
  dialog[open]{display:flex}
  dialog > form{display:flex;flex-direction:column;flex:1;min-height:0}
  .dlg-head{padding:16px 16px 12px}
  .dlg-body{flex:1;min-height:0;max-height:none;padding:18px 16px}
  .dlg-foot{padding:12px 16px;gap:10px}
  .dlg-foot .btn{flex:1 1 auto;min-width:0}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .toast-stack{left:12px;right:12px;bottom:12px;transform:none;width:auto}
  /* the section rule wraps rather than forcing the page wide */
  .section{flex-wrap:wrap;row-gap:4px;margin:26px 0 12px}
  .section h2{white-space:normal}
  .section .note{white-space:normal;flex:1 1 100%;order:3;font-size:11.5px}
  .section .rule{order:2;min-width:24px}
  /* workbench list: capacity bar and status fold under the name on a phone */
  .wl-head{display:none}
  .wl-row{grid-template-columns:minmax(0,1fr) auto;row-gap:8px;padding:10px 12px}
  .wl-row .cost{display:none}
  .wl-row .cap{grid-column:1 / -1}
  .wl-row .stat{display:none}
  .wb-bar{padding:10px 12px}
  .wb-bar select{flex:1 1 40%;min-width:0}
  .wb-bar .search{flex:1 1 100%}
  .p360-head,.p360-cap,.p360-block{padding-left:14px;padding-right:14px}
  .p360-facts > div{padding:10px 12px}
  .alloc-add{flex-wrap:wrap}
  .alloc-add .muted{flex:1 1 100%}
}

@media (max-width:440px){
  .tiles,.kpis{grid-template-columns:minmax(0,1fr)}
  .sumstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sumcell:nth-child(2n){border-right:0}
  .sumcell{border-bottom:1px solid var(--border-sub)}

/* ---- revenue grid (editable months × projects) ---- */
.rg-wrap{overflow:auto;max-height:72vh;overscroll-behavior-x:contain;scrollbar-width:thin}

table.rg thead th{position:sticky;top:0;z-index:3;background:var(--layer-2);color:var(--text-2);font-size:12px;font-weight:600;
  border-bottom:1px solid var(--border);height:44px}
table.rg th.rg-m{cursor:pointer;line-height:1.1}

  box-shadow:1px 0 0 var(--border);padding-left:12px;overflow:hidden;text-overflow:ellipsis}

/* ---- getting started ---- */
.gs{display:flex;flex-direction:column}

  background:var(--sel-bg);color:var(--sel-ink)}

/* ---- checkbox row in forms ---- */

.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}

  border-radius:var(--r-sm);font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;text-align:left}

/* ===== sign in ============================================================
   A gate, not a security boundary — the real check arrives with the API.
   Two panels: brand on the left, form on the right; stacks under 860px. */
.signin{position:fixed;inset:0;z-index:60;display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);overflow:auto}
.signin[hidden]{display:none}
.app[hidden]{display:none!important}
.si-brand{position:relative;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(28px,4vw,56px);color:#fff;overflow:hidden;
  background:linear-gradient(145deg,#1b2b6b 0%,#3730a3 42%,#6d28d9 100%)}
.si-brand::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 420px at 82% 12%,rgba(37,191,241,.32),transparent 62%),
             radial-gradient(560px 400px at 8% 92%,rgba(122,95,248,.34),transparent 60%)}
.si-brand>*{position:relative;z-index:1}
.si-logo{display:flex;align-items:center;gap:12px}
.si-logo .mk{width:38px;height:38px;flex:none}
.si-logo .w{font-size:19px;font-weight:650;letter-spacing:-.02em;color:#fff}
.si-logo .to{color:#8fd6f5;font-weight:500;font-size:.78em;padding:0 .1em}
.si-logo .ws{display:block;font-size:11.5px;color:rgba(255,255,255,.72);
  letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.si-pitch h2{font-size:clamp(24px,2.5vw,34px);line-height:1.2;color:#fff;
  font-weight:650;letter-spacing:-.024em;max-width:15ch}
.si-pitch p{margin:14px 0 0;color:rgba(255,255,255,.8);font-size:14.5px;max-width:44ch;line-height:1.6}
.si-points{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:11px}
.si-points li{display:flex;gap:10px;align-items:flex-start;color:rgba(255,255,255,.9);font-size:13.5px}
.si-points .ico{width:17px;height:17px;flex:none;margin-top:2px;color:#8fd6f5;
  fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.si-foot{font-size:12px;color:rgba(255,255,255,.6)}

.si-panel{display:flex;align-items:center;justify-content:center;padding:clamp(24px,4vw,48px)}
.si-card{width:100%;max-width:392px}
.si-card h1{font-size:25px;letter-spacing:-.024em;margin-bottom:6px}
.si-lede{color:var(--text-3);font-size:13.5px;margin:0 0 26px}
.si-form{display:grid;gap:16px}
.si-lab{display:block;font-size:12.5px;font-weight:550;color:var(--text-2);margin-bottom:6px;letter-spacing:-.004em}
.si-in{width:100%;height:44px;padding:0 13px;border:1px solid var(--border-strong);
  border-radius:var(--r-2);background:var(--layer);color:var(--text);font-size:14.5px;
  transition:border-color .12s,box-shadow .12s}
.si-in:hover{border-color:var(--text-3)}
.si-in:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.si-in[aria-invalid="true"]{border-color:var(--err)}
.si-pw{position:relative}
.si-pw .si-in{padding-right:62px}
.si-peek{position:absolute;right:6px;top:6px;height:32px;padding:0 10px;border:0;border-radius:var(--r-1);
  background:transparent;color:var(--text-3);font-size:12.5px;font-weight:550;cursor:pointer}
.si-peek:hover{background:var(--layer-hover);color:var(--text-2)}
/* Own token, not --brand-accent: that one is lightened in dark mode for links,
   and white text on it falls to 2.98:1. This holds 5.3:1 in both themes. */
.si-btn{height:44px;border:0;border-radius:var(--r-2);background:#4f46e5;color:#fff;
  font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:filter .12s}

.si-err{display:flex;gap:9px;align-items:flex-start;background:var(--err-bg);border:1px solid var(--err-line);

/* ============================================================================

   Data model + rollup engine.

   Design rule that drives everything below: the atomic financial record is

(function (root) {

  /* ---------- deterministic RNG (mulberry32) -------------------------------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    var h = 2166136261 >>> 0;

    // Internal (non-billable) work absorbs a slice of what is left.
    emps.forEach(function (e) {
      var free = cap[e.id] - used[e.id];
      if (free <= 0) return;
      var r = seeded(e.id + month + 'int')();
      if (r < 0.72) assign(e.id, 'INTERNAL', Math.min(free, r < 0.28 ? 15 : 10));

    return { alloc: alloc, cost: cost, cap: cap, used: used };
  }

  /* ---------- software licences ---------------------------------------------
     A licence is a purchase with a price and a period. Its monthly charge is
     price ÷ months, for every month inside the period. The charge is split
     equally across everyone on payroll that month, and each person's share
     follows their allocation into the projects they work on; the part of a
     share that sits on internal time or the bench is company overhead. Each
     person carries their share as "software cost" beside their payroll, so
     the loaded cost of a person is visible.                                  */
  var LICENCES = [
    ['L01', 'Salesforce Developer Pro Sandbox', 'Salesforce', 6000, '2026-01', 12, 'Sandbox for the Agentforce rollout'],
    ['L02', 'Copado CI/CD', 'Copado', 4800, '2025-10', 12, 'Release pipeline'],
    ['L03', 'Slack Business+', 'Slack', 9000, '2026-01', 12, ''],
    ['L04', 'GitHub Enterprise', 'GitHub', 7200, '2025-09', 12, ''],
    ['L05', 'Figma Organization', 'Figma', 3600, '2026-03', 12, '']
  ].map(function (r) {
    return { id: r[0], name: r[1], vendor: r[2], price: r[3], start: r[4], months: r[5], note: r[6] };
  });
  function licenceEnd(l) { return maddMonths(l.start, l.months - 1); }
  function licenceActive(l, month) {
    return mindex(month) >= mindex(l.start) && mindex(month) <= mindex(licenceEnd(l));
  }
  function licenceCharge(l, month) { return licenceActive(l, month) ? l.price / l.months : 0; }
  function licencesFor(month) { return LICENCES.filter(function (l) { return licenceActive(l, month); }); }
  function seedLicenceTotal(month) {
    return SEED_LICENCES.reduce(function (t, l) { return t + licenceCharge(l, month); }, 0);
  }
  var SEED_LICENCES = LICENCES.slice();   // the seed set, so normalisation ignores runtime additions

  /* ---------- demo data vs your data ------------------------------------------

     only records are the ones the operator creates. Either way, the current
     state is autosaved in this browser and restored on the next visit.       */
  var SEED = JSON.parse(JSON.stringify({ clients: CLIENTS, projects: PROJECTS, employees: EMPLOYEES, licences: LICENCES }));
  var DATA_MODE = 'demo';
  var STORAGE_KEY = 'c2c-data';
  function dataMode() { return DATA_MODE; }
  function emptyMonth(month) { return { month: month, revenue: {}, alloc: {}, empCost: {}, other: [] }; }

  function buildOtherCosts(month, revenue, empCostTotal) {
    var otherTotal = TARGET[month][1] - empCostTotal - seedLicenceTotal(month);
    var live = PROJECTS.filter(function (p) { return isActiveProj(p, month); });
    var projectShare = 0.90;
    var rows = [];              // {projectId|null, category, amount}
    COST_CATEGORIES.forEach(function (cat, ci) {
      var catTotal = otherTotal * CATEGORY_MIX[ci];
      var companyPart = Math.round(catTotal * (1 - projectShare));
      var pool = catTotal - companyPart;
      var weights = live.map(function (p) {
        var w = revenue[p.id] * (0.19 - 0.10 * p.health) * overrun(p.id, month);
        return w * jitter(p.id + month + cat, 0.35);
      });
      var wsum = weights.reduce(function (a, b) { return a + b; }, 0);
      var acc = 0;
      live.forEach(function (p, i) {
        var v = i === live.length - 1 ? Math.round(pool - acc) : Math.round(pool * weights[i] / wsum);
        acc += v;
        if (v > 0) rows.push({ projectId: p.id, category: cat, amount: v });
      });
      if (companyPart > 0) rows.push({ projectId: null, category: cat, amount: companyPart });
    });
    return rows;
  }

  function buildMonth(month) {
    if (DATA_MODE === 'own') return emptyMonth(month);
    /* The sample company only has targets up to DEMO_MONTH. Once the clock
       passes it there is nothing to generate, and an empty month is the honest
       answer - the alternative is TARGET[month] coming back undefined and every
       figure on the screen throwing. */
    if (!TARGET[month]) return emptyMonth(month);
    var revenue = buildRevenue(month);
    var a = buildAllocations(month, revenue);
    var empCostTotal = 0;
    Object.keys(a.cost).forEach(function (id) { empCostTotal += a.cost[id]; });
    var other = buildOtherCosts(month, revenue, empCostTotal);
    return {
      month: month,
      revenue: revenue,          // projectId -> $
      alloc: a.alloc,            // empId -> {projectId|'INTERNAL': pct}
      empCost: a.cost,           // empId -> monthly $
      other: other               // [{projectId|null, category, amount}]
    };
  }

  function snapshot(month) {

  MONTHS.forEach(snapshot);

     output; nothing recomputes finance on its own.                             */
  var cache = {};

  /* ---------- server sync -------------------------------------------------
     The database is the record. The browser keeps a working copy so the UI
     stays instant, sends every change to /api/mutate, and reloads from the
     server if a change is refused - so a rejected write can never leave the
     screen showing something the database does not agree with.             */
  var SYNC = { on: false, pending: 0, onError: null, onBusy: null };

    if (SYNC.onBusy) SYNC.onBusy(SYNC.pending > 0);
  }

  function sync(op, args, quiet) {
    if (!SYNC.on) return Promise.resolve({ ok: true });

    return fetch('/api/mutate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ op: op, args: args })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
    }).then(function (out) {
      busy(-1);
      if (!out.ok) {
        var msg = (out.data && out.data.message) || 'That change could not be saved.';
        if (!quiet && SYNC.onError) SYNC.onError(msg, out.status);
      }
      return out;
    }).catch(function () {
      busy(-1);
      if (SYNC.onError) SYNC.onError('Could not reach the server. Your change was not saved.', 0);
      return { ok: false };
    });
  }

  /* Replace the whole working copy with what the server holds. */
  function applyServerState(st) {
    CLIENTS.length = 0;   (st.clients   || []).forEach(function (x) { CLIENTS.push(x); });
    PROJECTS.length = 0;  (st.projects  || []).forEach(function (x) { PROJECTS.push(x); });
    EMPLOYEES.length = 0; (st.employees || []).forEach(function (x) { EMPLOYEES.push(x); });
    LICENCES.length = 0;  (st.licences  || []).forEach(function (x) { LICENCES.push(x); });
    Object.keys(STORE).forEach(function (k) { delete STORE[k]; });
    MONTHS.forEach(function (m) { STORE[m] = emptyMonth(m); });
    Object.keys(st.ledger || {}).forEach(function (m) {
      var src = st.ledger[m];
      if (!STORE[m]) STORE[m] = emptyMonth(m);
      STORE[m].revenue = src.revenue || {};
      STORE[m].alloc   = src.alloc   || {};
      STORE[m].empCost = src.empCost || {};
      STORE[m].other   = src.other   || [];
    });
    USERS.length = 0; (st.users || []).forEach(function (x) { USERS.push(x); });
    Object.keys(PERIOD_STATUS).forEach(function (k) { delete PERIOD_STATUS[k]; });
    (st.periods || []).forEach(function (p) {
      if (p && p.month) PERIOD_STATUS[p.month] = p.status === 'closed' ? 'closed' : 'open';
    });
    if (st.org && st.org.fiscalStart) FISCAL_START = st.org.fiscalStart;
    DATA_MODE = 'own';
    cache = {};
  }

  function loadFromServer() {
    return fetch('/api/state', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.state) return false;
        SYNC.on = false;
        applyServerState(d.state);
        SYNC.on = true;
        return true;
      })
      .catch(function () { return false; });

  /* Passwords. Unlike the figure mutations these are async on purpose: there is

  function setOwnPassword(current, next) {

  }
  function adminSetPassword(email, next) {

  }

  function forgetPersisted() { }

  function rollup(month) {
    if (cache[month]) return cache[month];
    var s = snapshot(month);
    var live = PROJECTS.filter(function (p) { return isActiveProj(p, month); });
    var emps = EMPLOYEES.filter(function (e) { return isActiveEmp(e, month); });

    var byProject = {}, byEmployee = {}, byClient = {};
    live.forEach(function (p) {
      byProject[p.id] = {
        id: p.id, clientId: p.clientId, name: p.name, type: p.type, billable: p.billable !== false,
        revenue: p.billable === false ? 0 : (s.revenue[p.id] || 0), empCost: 0, otherCost: 0, byCategory: {}, team: []
      };
    });

    emps.forEach(function (e) {
      var mc = s.empCost[e.id] != null ? s.empCost[e.id] : monthlyCost(e, month);
      var a = s.alloc[e.id] || {};
      var allocated = 0, internal = 0, lines = [];
      Object.keys(a).forEach(function (key) {
        var pct = a[key], amt = mc * pct / 100;
        allocated += amt;

        else {
          var bp = byProject[key];
          if (bp) { bp.empCost += amt; bp.team.push({ empId: e.id, pct: pct, amount: amt }); }
          /* time on a non-billable project is internal time: it earns nothing */

        }
      });

        allocatedPct: Object.keys(a).reduce(function (t, k) { return t + a[k]; }, 0),
        allocated: allocated, internal: internal,
        projectCost: allocated - internal,
        unallocated: mc - allocated,

    });

    var companyOther = 0, otherByCategory = {};
    COST_GROUPS.forEach(function (c) { otherByCategory[c] = 0; });
    s.other.forEach(function (r) {

    });

    /* software licences: derived from the register, never typed into a month.
       Every licence is used by the whole company: its monthly charge is split
       equally across everyone on payroll, and each person's share then follows
       their allocation — 60% on a project puts 60% of their share on that
       project's other cost; internal time, non-billable work and bench go to
       company overhead. So a project's software cost is exactly the software
       carried by the people working on it, in proportion to their time. */
    var licenceTotal = 0, licenceProject = 0, licenceCompany = 0, licenceLines = [];
    var empIds = Object.keys(byEmployee);
    empIds.forEach(function (k) { byEmployee[k].toolCost = 0; byEmployee[k].tools = []; });
    licencesFor(month).forEach(function (l) {
      var charge = licenceCharge(l, month);
      if (!charge) return;

      var share = empIds.length ? charge / empIds.length : 0, toProjects = {}, toCompany = 0;
      empIds.forEach(function (eid) {

        e.toolCost += share;
        e.tools.push({ licenceId: l.id, name: l.name, amount: share });
        var placed = 0;
        e.lines.forEach(function (ln) {

          var bp = ln.projectId && byProject[ln.projectId];
          if (bp) {

            bp.byCategory['Software licences'] = (bp.byCategory['Software licences'] || 0) + amt;
            toProjects[ln.projectId] = (toProjects[ln.projectId] || 0) + amt;
            if (bp.billable) licenceProject += amt; else { licenceCompany += amt; }
          } else { companyOther += amt; licenceCompany += amt; toCompany += amt; }   /* internal time */
        });
        var idle = share - placed;                                                    /* bench */
        if (idle > 1e-9) { companyOther += idle; licenceCompany += idle; toCompany += idle; }
      });
      if (!empIds.length) { companyOther += charge; licenceCompany += charge; toCompany += charge; }
      licenceLines.push({ id: l.id, name: l.name, charge: charge, carriers: empIds.length, share: share, projects: toProjects, company: toCompany });
    });
    otherByCategory['Software licences'] = licenceTotal;
    Object.keys(byEmployee).forEach(function (k) { byEmployee[k].loadedCost = byEmployee[k].monthlyCost + byEmployee[k].toolCost; });

    Object.keys(byProject).forEach(function (id) {
      var p = byProject[id];
      p.totalCost = p.empCost + p.otherCost;
      p.profit = p.revenue - p.totalCost;
      p.margin = p.revenue ? p.profit / p.revenue : 0;
      p.team.sort(function (x, y) { return y.amount - x.amount; });
    });

    CLIENTS.forEach(function (c) {
      var ps = Object.keys(byProject).map(function (k) { return byProject[k]; })
        .filter(function (p) { return p.clientId === c.id; });
      if (!ps.length) return;
      var r = 0, ec = 0, oc = 0;
      ps.forEach(function (p) { r += p.revenue; ec += p.empCost; oc += p.otherCost; });
      byClient[c.id] = {
        id: c.id, name: c.name, industry: c.industry, projects: ps,
        revenue: r, empCost: ec, otherCost: oc, totalCost: ec + oc,
        profit: r - ec - oc, margin: r ? (r - ec - oc) / r : 0
      };
    });

    var totals = { revenue: 0, projectEmpCost: 0, projectOtherCost: 0, nonBillableEmpCost: 0, nonBillableOtherCost: 0, nonBillable: 0 };
    Object.keys(byProject).forEach(function (k) {
      var bp = byProject[k];
      if (bp.billable) { totals.revenue += bp.revenue; totals.projectEmpCost += bp.empCost; totals.projectOtherCost += bp.otherCost; }

    });

    var empTotal = 0, internalTotal = 0, unallocTotal = 0;
    Object.keys(byEmployee).forEach(function (k) {

      internalTotal += byEmployee[k].internal;

    });

    var otherTotal = 0;
    COST_GROUPS.forEach(function (c) { otherTotal += otherByCategory[c] || 0; });

    var company = {
      month: month,
      revenue: totals.revenue,
      employeeCost: empTotal,
      otherCost: otherTotal,
      totalCost: empTotal + otherTotal,
      profit: totals.revenue - empTotal - otherTotal,
      allocatedEmpCost: empTotal - unallocTotal,
      projectEmpCost: totals.projectEmpCost,
      internalEmpCost: internalTotal,
      unallocatedEmpCost: unallocTotal,
      companyOtherCost: companyOther,
      projectContribution: totals.revenue - totals.projectEmpCost - totals.projectOtherCost,
      otherByCategory: otherByCategory,

      licences: licenceLines,
      nonBillableEmpCost: totals.nonBillableEmpCost, nonBillableOtherCost: totals.nonBillableOtherCost, nonBillableProjects: totals.nonBillable,
      activeClients: Object.keys(byClient).length,
      activeProjects: Object.keys(byProject).length,
      headcount: emps.length
    };
    company.margin = company.revenue ? company.profit / company.revenue : 0;

    var out = { month: month, company: company, byProject: byProject, byClient: byClient, byEmployee: byEmployee };
    cache[month] = out;
    return out;
  }

  /* ---------- period aggregation (always a sum over months) ------------------ */
  function aggregate(months) {
    var acc = {
      months: months, revenue: 0, employeeCost: 0, otherCost: 0, totalCost: 0, profit: 0,
      projectEmpCost: 0, internalEmpCost: 0, unallocatedEmpCost: 0, companyOtherCost: 0,
      projectContribution: 0, otherByCategory: {}
    };
    COST_GROUPS.forEach(function (c) { acc.otherByCategory[c] = 0; });
    acc.licenceCost = 0;
    months.forEach(function (m) {
      var c = rollup(m).company;
      acc.revenue += c.revenue; acc.employeeCost += c.employeeCost; acc.otherCost += c.otherCost;
      acc.totalCost += c.totalCost; acc.profit += c.profit;
      acc.projectEmpCost += c.projectEmpCost; acc.internalEmpCost += c.internalEmpCost;
      acc.unallocatedEmpCost += c.unallocatedEmpCost; acc.companyOtherCost += c.companyOtherCost;
      acc.projectContribution += c.projectContribution;
      COST_GROUPS.forEach(function (cat) { acc.otherByCategory[cat] += c.otherByCategory[cat] || 0; });
      acc.licenceCost += c.licenceCost || 0;
    });
    acc.margin = acc.revenue ? acc.profit / acc.revenue : 0;
    var last = months[months.length - 1];
    if (last) {
      var lc = rollup(last).company;
      acc.activeClients = lc.activeClients; acc.activeProjects = lc.activeProjects; acc.headcount = lc.headcount;
    }

  }

  function aggregateBy(months, dim) {
    // dim: 'client' | 'project'
    var out = {};
    months.forEach(function (m) {
      var r = rollup(m);
      var src = dim === 'client' ? r.byClient : r.byProject;
      Object.keys(src).forEach(function (id) {
        var row = src[id];
        if (!out[id]) out[id] = { id: id, name: row.name, clientId: row.clientId, billable: row.billable !== false, revenue: 0, empCost: 0, otherCost: 0, months: 0 };
        out[id].revenue += row.revenue; out[id].empCost += row.empCost;
        out[id].otherCost += row.otherCost; out[id].months++;
      });
    });
    return Object.keys(out).map(function (id) {
      var r = out[id];
      r.totalCost = r.empCost + r.otherCost;
      r.profit = r.revenue - r.totalCost;
      r.margin = r.revenue ? r.profit / r.revenue : 0;
      return r;
    });
  }

  /* ---------- period resolution --------------------------------------------- */
  function monthsFor(period, anchor, custom) {
    var i = mindex(anchor), p = mparse(anchor), out = [];
    function clamp(list) {
      return list.filter(function (m) { return MONTHS.indexOf(m) !== -1; });
    }
    switch (period) {
      case 'month': return [anchor];
      case 'prev': return clamp([maddMonths(anchor, -1)]);
      case 'quarter': {
        var qs = mindex(fiscalYearStart(anchor)) + Math.floor(fiscalOffset(anchor) / 3) * 3;
        for (var k = 0; k < 3; k++) out.push(mfromIndex(qs + k));
        return clamp(out);
      }
      case 'ytd': {
        var ys = mindex(fiscalYearStart(anchor));
        for (var m = ys; m <= i; m++) out.push(mfromIndex(m));
        return clamp(out);
      }
      case 'year': {
        var ys2 = mindex(fiscalYearStart(anchor));
        for (var m2 = 0; m2 < 12; m2++) out.push(mfromIndex(ys2 + m2));
        return clamp(out);
      }
      case 'trailing12': {
        for (var k2 = 11; k2 >= 0; k2--) out.push(mfromIndex(i - k2));
        return clamp(out);
      }
      case 'custom': {
        if (!custom) return [anchor];
        var a = Math.min(mindex(custom[0]), mindex(custom[1]));
        var b = Math.max(mindex(custom[0]), mindex(custom[1]));
        for (var j = a; j <= b; j++) out.push(mfromIndex(j));
        return clamp(out);
      }
      default: return [anchor];
    }
  }

  /* ---------- mutation (prototype data entry) ------------------------------- */
  function setRevenue(month, projectId, amount) {
    sync('setRevenue', { month: month, projectId: projectId, amount: +amount || 0 });
    snapshot(month).revenue[projectId] = Math.max(0, Math.round(amount));
    invalidate(month);
  }
  function addCost(month, projectId, category, amount) {
    sync('addCost', { month: month, projectId: projectId, category: category, amount: +amount || 0 });
    snapshot(month).other.push({ projectId: projectId || null, category: category, amount: Math.round(amount) });
    invalidate(month);
  }
  function setAllocation(month, empId, map) {
    sync('setAllocation', { month: month, employeeId: empId, map: map });
    var total = Object.keys(map).reduce(function (t, k) { return t + (map[k] || 0); }, 0);
    if (total > 100) return { ok: false, error: 'Allocation totals ' + total + '%. Reduce it to 100% or less before saving.' };
    var clean = {};
    Object.keys(map).forEach(function (k) { if (map[k] > 0) clean[k] = map[k]; });
    snapshot(month).alloc[empId] = clean;

      if (!isActiveEmp(e, from) || !src[e.id]) { skipped++; dst[e.id] = {}; return; }
      var line = {}, any = false;
      Object.keys(src[e.id]).forEach(function (k) {
        if (k === 'INTERNAL') { line.INTERNAL = src[e.id][k]; any = true; return; }
        var pr = PROJECTS.filter(function (x) { return x.id === k; })[0];
        if (pr && isActiveProj(pr, to)) { line[k] = src[e.id][k]; any = true; } else dropped++;
      });
      dst[e.id] = line;
      if (any) copied++;
    });
    setAllocations(to, dst);
    return { copied: copied, dropped: dropped, skipped: skipped };
  }

  // discard every session edit and rebuild the generated ledger
  function resetData() {
    Object.keys(STORE).forEach(function (k) { delete STORE[k]; });
    invalidate();
    MONTHS.forEach(snapshot);
  }

  function addEmployee(rec) {
    var id = 'E' + String(EMPLOYEES.length + 1).padStart(2, '0');
    EMPLOYEES.push({
      id: id, name: rec.name, title: rec.title, dept: rec.dept,
      baseCtc: rec.ctc, join: rec.join, disc: rec.disc || 'eng', pinned: true
    });
    MONTHS.forEach(function (m) {
      if (mindex(m) >= mindex(rec.join)) { snapshot(m).empCost[id] = rec.ctc / 12; snapshot(m).alloc[id] = {}; }
    });
    invalidate();
    sync('addEmployee', { id: id, name: rec.name, title: rec.title, dept: rec.dept,

      .then(function (r) {

    if (cfg.zeroBase !== false) lo = Math.min(0, lo);
    var ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
    var fmt = cfg.tickFmt || tickMoney;

    var wrap = frame({ height: H, aria: cfg.aria || 'Monthly trend' }, function (svg, W, H, tip) {
      var PL = 52, PR = cfg.endLabels === false ? 16 : 64, PT = 14, PB = 26;
      var iw = W - PL - PR, ih = H - PT - PB;
      var X = function (i) { return PL + (months.length === 1 ? iw / 2 : i * iw / (months.length - 1)); };
      var Y = function (v) { return PT + ih - (v - y0) / (y1 - y0) * ih; };
      var defs = svgEl('defs'); svg.appendChild(defs);

      /* grid + y ticks: hairline, recessive */
      ticks.forEach(function (t) {
        svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(t) + .5, y2: Y(t) + .5, stroke: 'var(--grid)', 'stroke-width': 1 }));
        svg.appendChild(textEl(PL - 8, Y(t) + 4, fmt(t), { anchor: 'end', tabular: true }));
      });
      if (y0 < 0) svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(0), y2: Y(0), stroke: 'var(--axis)', 'stroke-width': 1 }));

      /* x labels: thin out to what fits */
      var every = Math.max(1, Math.ceil((months.length * 40) / iw)), last = months.length - 1;
      months.forEach(function (m, i) {
        if ((last - i) % every !== 0) return;
        svg.appendChild(textEl(X(i), H - 8, monthTick(m, i, months.length), { anchor: i === last ? 'end' : i === 0 ? 'start' : 'middle' }));
      });

      /* marks */
      var endPts = [];
      series.forEach(function (s) {
        var pts = s.values.map(function (v, i) { return [X(i), Y(v)]; });
        var d = smoothPath(pts);
        if (s.area) {
          var gid = 'g' + (++uid);
          var grad = svgEl('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
          grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': s.color, 'stop-opacity': .16 }));
          grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': s.color, 'stop-opacity': 0 }));
          defs.appendChild(grad);
          var base = Y(Math.max(y0, 0));
          svg.appendChild(svgEl('path', { d: d + ' L' + X(months.length - 1).toFixed(1) + ' ' + base.toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + base.toFixed(1) + ' Z', fill: 'url(#' + gid + ')' }));
        }
        svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
        var li = months.length - 1;
        svg.appendChild(svgEl('circle', { cx: X(li), cy: Y(s.values[li]), r: 4, fill: s.color, stroke: 'var(--layer)', 'stroke-width': 2 }));
        endPts.push({ y: Y(s.values[li]), v: s.values[li], s: s });
      });

      /* direct end labels, nudged apart only when they would overlap */
      if (cfg.endLabels !== false) {
        endPts.sort(function (a, b) { return a.y - b.y; });
        var lastY = -Infinity;
        endPts.forEach(function (e) {
          var y = Math.max(e.y, lastY + 13);
          lastY = y;
          var lx = X(months.length - 1) + 10;
          if (Math.abs(y - e.y) > 2) svg.appendChild(svgEl('line', { x1: lx - 4, y1: e.y, x2: lx - 1, y2: y, stroke: 'var(--border-strong)', 'stroke-width': 1 }));
          svg.appendChild(textEl(lx, y + 4, fmt(e.v), { fill: 'var(--text-2)', weight: 600, tabular: true }));
        });
      }

      /* hover: crosshair snaps to the month, one readout for every series */
      var cross = svgEl('line', { y1: PT, y2: PT + ih, stroke: 'var(--border-strong)', 'stroke-width': 1, opacity: 0 });
      svg.appendChild(cross);
      var dots = series.map(function (s) {
        var c = svgEl('circle', { r: 4, fill: s.color, stroke: 'var(--layer)', 'stroke-width': 2, opacity: 0 });
        svg.appendChild(c); return c;
      });
      var half = months.length > 1 ? iw / (months.length - 1) / 2 : iw / 2;
      months.forEach(function (m, i) {
        var r = svgEl('rect', { x: Math.max(PL - half, X(i) - half), y: PT, width: half * 2, height: ih, fill: 'transparent',
          style: cfg.onClickMonth ? 'cursor:pointer' : '' });
        r.addEventListener('mouseenter', function () {
          cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
          dots.forEach(function (dt, si) { dt.setAttribute('cx', X(i)); dt.setAttribute('cy', Y(series[si].values[i])); dt.setAttribute('opacity', 1); });
          tip.innerHTML = '<div class="t-head">' + esc(C.mlabel(m)) + '</div>' + series.map(function (s) {
            return '<div class="t-row"><span class="t-key"><span class="t-line" style="background:' + s.color + '"></span>' + esc(s.label) + '</span><span>' +
              (cfg.tipFmt ? cfg.tipFmt(s.values[i]) : money(s.values[i])) + '</span></div>';
          }).join('') + (cfg.onClickMonth ? '<div class="t-cta">Click to open this month →</div>' : '');
          pxTip(tip, wrap, X(i), 4);
        });
        r.addEventListener('mouseleave', function () {
          cross.setAttribute('opacity', 0); dots.forEach(function (d) { d.setAttribute('opacity', 0); }); tip.style.opacity = 0;
        });
        if (cfg.onClickMonth) r.addEventListener('click', function () { cfg.onClickMonth(m); });
        svg.appendChild(r);
      });
    });

    if (series.length > 1) {
      var lg = el('<div class="legend"></div>');
      series.forEach(function (s) {
        lg.appendChild(el('<div class="item"><span class="' + (s.area ? 'swatch' : 'lkey') + '" style="background:' + s.color + '"></span>' + esc(s.label) + '</div>'));
      });
      wrap.insertBefore(lg, wrap.firstChild);
    }
    return wrap;
  }

  /* ---------- column chart --------------------------------------------------- */
  function columnChart(cfg) {
    var months = cfg.months, values = cfg.values;
    var H = cfg.height || 220;
    var lo = Math.min(0, Math.min.apply(null, values)), hi = Math.max.apply(null, values);
    var ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
    var fmt = cfg.tickFmt || tickMoney;
    var max = Math.max.apply(null, values), maxI = values.indexOf(max);

    var wrap = frame({ height: H, aria: cfg.aria || 'Monthly values' }, function (svg, W, H, tip) {
      var PL = 52, PR = 12, PT = 22, PB = 26;
      var iw = W - PL - PR, ih = H - PT - PB;
      var Y = function (v) { return PT + ih - (v - y0) / (y1 - y0) * ih; };
      var step = iw / months.length;
      var bw = Math.min(24, Math.max(6, step - 6));         /* thin marks: never fill the slot */

      ticks.forEach(function (t) {
        svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(t) + .5, y2: Y(t) + .5, stroke: 'var(--grid)', 'stroke-width': 1 }));
        svg.appendChild(textEl(PL - 8, Y(t) + 4, fmt(t), { anchor: 'end', tabular: true }));
      });
      var every = Math.max(1, Math.ceil((months.length * 36) / iw)), last = months.length - 1;

      months.forEach(function (m, i) {
        var x = PL + i * step + (step - bw) / 2, v = values[i];
        var h = Math.abs(Y(v) - Y(0));
        var color = cfg.colorFor ? cfg.colorFor(v, i) : 'var(--s1)';
        var op = cfg.opacityFor ? cfg.opacityFor(v, i) : 1;
        var top = v >= 0 ? Y(v) : Y(0);
        var bar = svgEl('path', { d: roundTop(x, top, bw, h, 4, v < 0), fill: color, opacity: op });
        svg.appendChild(bar);
        /* one direct label: the extreme (or the current month when it is the last) */
        var label = (i === maxI || i === months.length - 1) && (cfg.labels !== false);
        if (label) svg.appendChild(textEl(x + bw / 2, top - 6, cfg.tipFmt ? cfg.tipFmt(v) : fmt(v),
          { anchor: 'middle', fill: 'var(--text-2)', weight: 600, tabular: true }));
        if ((last - i) % every === 0) svg.appendChild(textEl(x + bw / 2, H - 8, C.mabbr(m), { anchor: 'middle' }));
        var hit = svgEl('rect', { x: PL + i * step, y: PT, width: step, height: ih, fill: 'transparent',
          style: cfg.onClickMonth ? 'cursor:pointer' : '' });
        hit.addEventListener('mouseenter', function () {
          bar.setAttribute('opacity', Math.min(1, op * .7 + .3)); bar.setAttribute('filter', 'brightness(1.08)');
          tip.innerHTML = '<div class="t-head">' + esc(C.mlabel(m)) + '</div><div class="t-row"><span class="t-key"><span class="t-dot" style="background:' + color + '"></span>' +
            esc(cfg.label || 'Value') + '</span><span>' + (cfg.tipFmt ? cfg.tipFmt(v) : money(v)) + '</span></div>' +
            (cfg.onClickMonth ? '<div class="t-cta">Click to open this month →</div>' : '');
          pxTip(tip, wrap, x + bw / 2, 4);
        });
        hit.addEventListener('mouseleave', function () { bar.setAttribute('opacity', op); bar.removeAttribute('filter'); tip.style.opacity = 0; });
        if (cfg.onClickMonth) hit.addEventListener('click', function () { cfg.onClickMonth(m); });
        svg.appendChild(hit);
      });
      svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(0) + .5, y2: Y(0) + .5, stroke: 'var(--axis)', 'stroke-width': 1 }));
    });
    return wrap;
  }

  /* ---------- stacked column chart -------------------------------------------
     cfg.months, cfg.series: [{label, values, color}] stacked bottom-up in order.
     Tooltip lists every layer plus the stack total; cfg.extra(i) may append
     more tooltip rows (e.g. allocation) without drawing anything. */
  function stackedColumnChart(cfg) {
    var months = cfg.months, series = cfg.series;
    var H = cfg.height || 220;
    var totals = months.map(function (_, i) { return series.reduce(function (t, sr) { return t + Math.max(0, sr.values[i] || 0); }, 0); });
    var hi = Math.max.apply(null, totals.concat([0]));
    var ticks = niceTicks(0, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1] || 1;
    var fmt = cfg.tickFmt || tickMoney;
    var maxI = totals.indexOf(Math.max.apply(null, totals));

    var wrap = frame({ height: H, aria: cfg.aria || 'Stacked monthly values' }, function (svg, W, H, tip) {
      var PL = 52, PR = 12, PT = 22, PB = 26;
      var iw = W - PL - PR, ih = H - PT - PB;
      var Y = function (v) { return PT + ih - (v - y0) / (y1 - y0) * ih; };
      var step = iw / months.length;
      var bw = Math.min(26, Math.max(6, step - 6));
      ticks.forEach(function (t) {
        svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(t) + .5, y2: Y(t) + .5, stroke: 'var(--grid)', 'stroke-width': 1 }));
        svg.appendChild(textEl(PL - 8, Y(t) + 4, fmt(t), { anchor: 'end', tabular: true }));
      });
      var every = Math.max(1, Math.ceil((months.length * 36) / iw)), last = months.length - 1;
      months.forEach(function (m, i) {
        var x = PL + i * step + (step - bw) / 2, base = 0, parts = [];
        series.forEach(function (sr, k) {
          var v = Math.max(0, sr.values[i] || 0); if (!v) return;
          var top = Y(base + v), h = Y(base) - Y(base + v);
          var isTop = (base + v) >= totals[i] - 1e-6;
          var d = isTop ? roundTop(x, top, bw, h, 4, false) : 'M' + x + ' ' + top + 'h' + bw + 'v' + h + 'h' + (-bw) + 'z';
          var bar = svgEl('path', { d: d, fill: sr.color || 'var(--s' + (k + 1) + ')', opacity: cfg.faded && cfg.faded(i) ? .45 : 1 });
          svg.appendChild(bar); parts.push(bar); base += v;
        });
        if ((i === last || (i === maxI && (last - i) * step > 44)) && cfg.labels !== false && totals[i] > 0)
          svg.appendChild(textEl(x + bw / 2, Y(totals[i]) - 6, fmt(totals[i]), { anchor: 'middle', fill: 'var(--text-2)', weight: 600, tabular: true }));
        if ((last - i) % every === 0) svg.appendChild(textEl(x + bw / 2, H - 8, C.mabbr(m), { anchor: 'middle' }));
        var hit = svgEl('rect', { x: PL + i * step, y: PT, width: step, height: ih, fill: 'transparent', style: cfg.onClickMonth ? 'cursor:pointer' : '' });
        hit.addEventListener('mouseenter', function () {
          parts.forEach(function (b) { b.setAttribute('filter', 'brightness(1.08)'); });
          var rows = series.map(function (sr) {
            return '<div class="t-row"><span class="t-key"><span class="t-dot" style="background:' + (sr.color || '') + '"></span>' + esc(sr.label) + '</span><span>' + money(sr.values[i] || 0) + '</span></div>';
          }).join('');
          rows += '<div class="t-row t-line"><span class="t-key">' + esc(cfg.totalLabel || 'Total') + '</span><span><strong>' + money(totals[i]) + '</strong></span></div>';
          if (cfg.extra) rows += cfg.extra(i);
          tip.innerHTML = '<div class="t-head">' + esc(C.mlabel(m)) + '</div>' + rows + (cfg.onClickMonth ? '<div class="t-cta">Click to open this month →</div>' : '');
          pxTip(tip, wrap, x + bw / 2, 4);
        });
        hit.addEventListener('mouseleave', function () { parts.forEach(function (b) { b.removeAttribute('filter'); }); tip.style.opacity = 0; });
        if (cfg.onClickMonth) hit.addEventListener('click', function () { cfg.onClickMonth(m); });
        svg.appendChild(hit);
      });
      svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(0) + .5, y2: Y(0) + .5, stroke: 'var(--axis)', 'stroke-width': 1 }));
    });
    return wrap;
  }

  /* ---------- month pivot ------------------------------------------------------
     Metrics down the side, months across the top. cfg.months: ['2026-01',…];
     cfg.rows: [{label, sub, cell(month, i) -> html, cls, total(html)}];
     cfg.current: month to highlight; cfg.onMonth(month); cfg.flags: {month: text}
     shown as a marker under the header (e.g. an anniversary raise). */
  function pivot(cfg) {
    var months = cfg.months, cur = cfg.current;
    var wrap = el('<div class="pv-wrap"></div>');
    var h = '<table class="pv"><thead><tr><th class="pv-side">' + esc(cfg.corner || '') + '</th>';
    months.forEach(function (m) {
      var flag = cfg.flags && cfg.flags[m];
      h += '<th class="pv-m' + (m === cur ? ' cur' : '') + (cfg.onMonth ? ' go' : '') + '" data-m="' + m + '"' + (flag ? ' data-tip="' + esc(flag) + '"' : '') + '>' +
        '<span class="pv-mon">' + esc(C.mabbr(m)) + '</span><span class="pv-yr">' + m.slice(2, 4) + '</span>' + (flag ? '<i class="pv-flag"></i>' : '') + '</th>';
    });
    if (cfg.totalLabel) h += '<th class="pv-tot">' + esc(cfg.totalLabel) + '</th>';
    h += '</tr></thead><tbody>';
    cfg.rows.forEach(function (r) {
      h += '<tr class="' + (r.cls || '') + '"><th class="pv-side"><span class="pv-lab">' + esc(r.label) + '</span>' + (r.sub ? '<span class="pv-sub">' + esc(r.sub) + '</span>' : '') + '</th>';
      months.forEach(function (m, i) { h += '<td class="' + (m === cur ? 'cur' : '') + '">' + (r.cell(m, i) || '') + '</td>'; });
      if (cfg.totalLabel) h += '<td class="pv-tot">' + (r.total || '') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
    wrap.innerHTML = h;
    if (cfg.onMonth) wrap.querySelectorAll('th.pv-m').forEach(function (th) { th.addEventListener('click', function () { cfg.onMonth(th.getAttribute('data-m')); }); });
    /* land on the current month, not January */
    requestAnimationFrame(function () {
      var c = wrap.querySelector('th.pv-m.cur'); if (!c) return;
      var side = wrap.querySelector('th.pv-side').offsetWidth;
      wrap.scrollLeft = Math.max(0, c.offsetLeft - side - (wrap.clientWidth - side) / 2 + c.offsetWidth / 2);
    });
    return wrap;
  }

  /* ---------- waterfall -----------------------------------------------------
     steps: [{label, value, kind:'total'|'add'|'sub'}] — 'total' bars sit on
     the baseline, 'add'/'sub' float from the running balance.               */
  function waterfall(cfg) {
    /* Modern bridge: totals are solid columns, movements are floating blocks
       in their semantic colour, and a hairline steps between them so the eye
       follows the running balance rather than reading eight unrelated bars.
       Drawn at real pixel size like every other chart. */
    var steps = cfg.steps, H = cfg.height || 300;
    var run = 0, geo = [];
    steps.forEach(function (s) {
      if (s.kind === 'total') { geo.push({ s: s, from: 0, to: s.value }); run = s.value; }
      else { var from = run; run += s.value; geo.push({ s: s, from: from, to: run }); }
    });
    var hi = Math.max.apply(null, geo.map(function (g) { return Math.max(g.from, g.to); }));
    var lo = Math.min(0, Math.min.apply(null, geo.map(function (g) { return Math.min(g.from, g.to); })));
    var ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];

    var wrap = frame({ height: H, aria: cfg.aria || 'Profit bridge' }, function (svg, W, H, tip) {
      var PL = 52, PR = 12, PT = 26, PB = 48;
      var iw = W - PL - PR, ih = H - PT - PB;
      var Y = function (v) { return PT + ih - (v - y0) / (y1 - y0) * ih; };
      var step = iw / steps.length, bw = Math.min(48, Math.max(14, step - 24));

      ticks.forEach(function (t) {
        svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(t) + .5, y2: Y(t) + .5, stroke: 'var(--grid)', 'stroke-width': 1 }));
        svg.appendChild(textEl(PL - 8, Y(t) + 4, tickMoney(t), { anchor: 'end', tabular: true }));
      });
      svg.appendChild(svgEl('line', { x1: PL, x2: PL + iw, y1: Y(0) + .5, y2: Y(0) + .5, stroke: 'var(--border-strong)', 'stroke-width': 1 }));

      geo.forEach(function (g, i) {
        var x = PL + i * step + (step - bw) / 2;
        var top = Math.min(Y(g.from), Y(g.to)), bottom = Math.max(Y(g.from), Y(g.to));
        var h = Math.max(3, bottom - top);
        var isTotal = g.s.kind === 'total';
        var color = isTotal ? (i === geo.length - 1 ? 'var(--m-profit)' : 'var(--m-revenue)')
                            : g.s.value >= 0 ? 'var(--m-profit)' : 'var(--m-cost)';
        var base = isTotal ? 1 : .9;
        var p = svgEl('path', { d: isTotal ? roundTop(x, top, bw, h, 4) : roundRect(x, top, bw, h, 4), fill: color, opacity: base });
        svg.appendChild(p);
        if (i < geo.length - 1) {
          svg.appendChild(svgEl('line', {
            x1: x + bw + 3, x2: PL + (i + 1) * step + (step - bw) / 2 - 3, y1: Y(g.to) + .5, y2: Y(g.to) + .5,
            stroke: 'var(--border-strong)', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: .8
          }));
        }
        var vt = isTotal ? tickMoney(g.s.value) : (g.s.value >= 0 ? '+' : '−') + tickMoney(Math.abs(g.s.value)).replace('−', '');
        svg.appendChild(textEl(x + bw / 2, top - 8, vt, { anchor: 'middle', fill: isTotal ? 'var(--text)' : 'var(--text-2)', weight: isTotal ? 700 : 600, tabular: true }));

        /* wrapped category label, at most two lines */
        var words = g.s.label.split(' '), lines = [''], limit = Math.max(8, Math.floor(step / 6.2));
        words.forEach(function (w) {
          if ((lines[lines.length - 1] + ' ' + w).trim().length > limit) lines.push(w);
          else lines[lines.length - 1] = (lines[lines.length - 1] + ' ' + w).trim();
        });
        lines.slice(0, 2).forEach(function (ln, li) {
          svg.appendChild(textEl(x + bw / 2, PT + ih + 18 + li * 13, ln, { anchor: 'middle',
            fill: isTotal ? 'var(--text)' : 'var(--text-3)', weight: isTotal ? 600 : 450 }));
        });

        var hit = svgEl('rect', { x: PL + i * step, y: PT, width: step, height: ih, fill: 'transparent' });
        hit.addEventListener('mouseenter', function () {
          p.setAttribute('opacity', base * .68);
          tip.innerHTML = '<div class="t-head">' + esc(g.s.label) + '</div>' +
            '<div class="t-row"><span class="t-key">' + (isTotal ? 'Balance' : 'Movement') + '</span><span>' +
            (isTotal ? money(g.s.value) : signed(g.s.value)) + '</span></div>' +
            (isTotal ? '' : '<div class="t-row"><span class="t-key">Running</span><span>' + money(g.to) + '</span></div>') +
            (g.s.note ? '<div class="t-note">' + esc(g.s.note) + '</div>' : '');
          pxTip(tip, wrap, x + bw / 2, 4);
        });
        hit.addEventListener('mouseleave', function () { p.setAttribute('opacity', base); tip.style.opacity = 0; });
        svg.appendChild(hit);
      });
    });
    return wrap;
  }

  /* ---------- segmented composition bar -------------------------------------- */
  function segbar(rows, total, opts) {
    opts = opts || {};
    var wrap = el('<div></div>');
    var bar = el('<div class="segbar" role="img" aria-label="' + esc(opts.aria || 'Composition') + '"></div>');
    var legend = el('<div class="seg-legend"></div>');
    rows.forEach(function (r) {
      var share = total ? r.value / total : 0;
      var seg = el('<div class="seg" style="flex:' + Math.max(share, 0.004) + ' 0 0;background:' + r.color + '" title="' + esc(r.label) + ' · ' + money(r.value) + '"></div>');
      bar.appendChild(seg);
      var row = el('<div class="row"><span class="sw" style="background:' + r.color + '"></span>' +
        '<span class="lb">' + esc(r.label) + '</span><span class="vl">' + money(r.value) + '</span>' +
        '<span class="pc">' + (share * 100).toFixed(1) + '%</span></div>');
      row.addEventListener('mouseenter', function () { seg.style.opacity = .6; });
      row.addEventListener('mouseleave', function () { seg.style.opacity = 1; });
      if (r.onClick) { row.style.cursor = 'pointer'; row.addEventListener('click', r.onClick); }
      legend.appendChild(row);
    });
    wrap.appendChild(bar); wrap.appendChild(legend);
    return wrap;
  }

  /* ---------- horizontal breakdown ------------------------------------------ */
  function breakdown(rows, total) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }));
    var wrap = el('<div class="brk"></div>');
    rows.forEach(function (r) {
      var w = max ? r.value / max * 100 : 0;
      var share = total ? r.value / total * 100 : 0;
      wrap.appendChild(el('<div class="brk-row">' +
        '<span class="brk-lbl">' + esc(r.label) + '</span>' +
        '<span class="bar brk-bar"><span style="width:' + w.toFixed(1) + '%;background:' + (r.color || 'var(--s1)') + '"></span></span>' +
        '<span class="brk-val">' + money(r.value) + '</span>' +
        '<span class="brk-pct">' + share.toFixed(1) + '%</span>' +
        '</div>'));
    });
    return wrap;
  }

  /* ---------- bullet cell (bar behind a number, inside a table) -------------- */
  function bullet(value, max, color, text) {
    var w = max ? Math.max(0, Math.min(1, value / max)) * 100 : 0;

  }

  /* ---------- sparkline -----------------------------------------------------
     A monotone Catmull-Rom curve rather than a polyline: the trend reads as a
     shape instead of a zigzag, and the overshoot clamp keeps a spike from
     bulging past its own data point. The area is a two-stop wash so the line
     stays the figure and the fill stays the ground. Points are exposed as
     data attributes so the card can answer a hover with a real value.       */
  function smoothPath(pts) {
    if (pts.length < 3) return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {

      var t = 0.22;                                     /* tension: gentle, never loopy */
      var c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = p1[1] + (p2[1] - p0[1]) * t;
      var c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;

      d += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ',' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) +

    var Y = function (v) { return H - PB - (v - lo) / (hi - lo) * (H - PB * 2 - 4); };

      ' role="img" aria-label="' + esc(opts.aria || 'Trend, last ' + values.length + ' months') + '">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + d + ' L' + W + ' ' + Y(values[values.length - 1]).toFixed(1) + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="url(#' + id + ')"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="2.6" fill="' + color + '" ' +
      'stroke="var(--layer)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';

  /* ---------- data table -----------------------------------------------------
     One component behind every table in the product: sort, in-table search,
     column visibility, density, pagination, sticky header and first column,
     keyboard row navigation, and a pinned totals row. State is remembered per
     table shape, so a re-render does not throw away the reader's sort or page.

    opts = opts || {};

        sortKey: opts.sortKey || null, sortDir: opts.sortDir || -1,
        page: 0, q: '', hidden: {}, dense: !!(root.SET && root.SET.get().density === 'compact'),
        pageSize: opts.pageSize != null ? opts.pageSize : 25

    var wrap = el('<div class="dt"></div>');

    function visibleCols() {

    }

      wrap.innerHTML = '';

      var page = stt.pageSize ? data.slice(from, from + size) : data;

      /* ---- toolbar ---- */
      var hideable = cols.filter(function (c, i) { return i > 0 && c.hideable !== false && c.label; });
      var bar = el('<div class="dt-bar"></div>');
      bar.appendChild(el('<span class="count">' + (total === rows.length
        ? total + (total === 1 ? ' row' : ' rows')
        : total + ' of ' + rows.length + ' rows') + '</span>'));
      if (searchable) {
        var sb = el('<label class="search" style="min-width:180px;max-width:280px"><span class="ic">' + icon('search') + '</span>' +
          '<input type="text" placeholder="Filter these rows" value="' + esc(stt.q) + '" aria-label="Filter rows"></label>');
        var si = sb.querySelector('input');
        si.addEventListener('input', function () {
          stt.q = si.value; stt.page = 0; draw();

        });

      bar.appendChild(el('<span class="grow"></span>'));
      if (opts.toolbar) bar.appendChild(opts.toolbar);
      var tools = el('<div class="dt-tools"></div>');
      var dens = el('<button class="dt-tool" type="button" aria-pressed="' + stt.dense + '" title="Compact rows">' + icon('rows') + ' Compact</button>');
      dens.addEventListener('click', function () { stt.dense = !stt.dense; draw(); });
      tools.appendChild(dens);
      if (hideable.length) {
        var menu = el('<div class="dt-menu"></div>');
        var mb = el('<button class="dt-tool" type="button" title="Show or hide columns">' + icon('columns') + ' Columns</button>');
        var pop = el('<div class="dt-pop" hidden></div>');
        hideable.forEach(function (c) {
          var lab = el('<label><input type="checkbox"' + (stt.hidden[c.key] ? '' : ' checked') + '>' + esc(c.label) + '</label>');
          lab.querySelector('input').addEventListener('change', function (e) {
            if (e.target.checked) delete stt.hidden[c.key]; else stt.hidden[c.key] = 1;

        document.addEventListener('click', function () { if (pop) pop.hidden = true; });
        pop.addEventListener('click', function (e) { e.stopPropagation(); });

        tools.appendChild(menu);
      }
      if (root.EXP && opts.exportable !== false) {
        tools.appendChild(root.EXP.menu(function () {
          var visible = visibleCols().filter(function (c) { return !c.noExport; });
          return root.EXP.fromTable(visible, data, {
            name: opts.exportName || (opts.title || visible[0].label),
            title: opts.title || opts.exportName || 'Table export',
            subtitle: opts.subtitle || '',
            foot: opts.foot ? visible.map(function (c) { return opts.foot[c.key] || ''; }) : null
          });
        }));
      }
      bar.appendChild(tools);
      if (opts.bar !== false) wrap.appendChild(bar);

      /* ---- table ---- */
      // cap the height only when the table is not paginated — otherwise the
      // page size already bounds it and a nested scrollbar just gets in the way

      var h = '<table class="grid' + (stt.dense ? ' dense' : '') + '"><thead><tr>';
      vc.forEach(function (c, i) {
        var isSorted = stt.sortKey === c.key;
        h += '<th class="' + (c.num ? 'n ' : '') + (c.sortable === false ? '' : 'sortable ') +
          (isSorted ? 'sorted ' : '') + (sticky && i === 0 ? 'stick' : '') + '" data-k="' + esc(c.key) + '"' +
          (c.sortable === false ? '' : ' aria-sort="' + (isSorted ? (stt.sortDir === -1 ? 'descending' : 'ascending') : 'none') + '"') +
          (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) +
          (c.sortable === false ? '' : ' <span class="arrow">' + (isSorted && stt.sortDir === 1 ? '▲' : '▼') + '</span>') + '</th>';
      });

      if (!page.length) {

      }

        h += '<tr class="' + (opts.onRow ? 'clickable' : '') + (rc ? ' ' + rc : '') + '" data-i="' + i + '"' + (opts.onRow ? ' tabindex="0"' : '') + '>';
        vc.forEach(function (c, ci) {
          h += '<td class="' + (c.num ? 'n ' : '') + (stt.sortKey === c.key ? 'sorted ' : '') +

      wrap.appendChild(scroll);

      scroll.querySelectorAll('th.sortable').forEach(function (th) {
        th.addEventListener('click', function () {

          var row = page[+tr.dataset.i];
          tr.addEventListener('click', function () { opts.onRow(row); });
          tr.addEventListener('keydown', function (e) {

        var sizeSel = el('<label style="display:flex;align-items:center;gap:8px">Rows per page <select>' +
          PAGE_SIZES.map(function (n) {

          }).join('') + '</select></label>');

        right.appendChild(el('<span class="rng">' + (total ? (from + 1) + '–' + Math.min(from + size, total) : 0) + ' of ' + total + '</span>'));
        var pg = el('<div class="pg"></div>');

        var next = el('<button type="button" aria-label="Next page">▶</button>');

        next.addEventListener('click', function () { stt.page++; draw(); });

        pg.appendChild(el('<span style="padding:0 8px" class="rng">' + (stt.pageSize ? (stt.page + 1) + ' / ' + pages : '1 / 1') + '</span>'));

  /* ---------- toasts ---------------------------------------------------------

    error: 'M12 8v5M12 16.5v.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20.4h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',

  /* ---------- form primitives -------------------------------------------------

  var CARET = '<svg class="caret" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

    var ctl = el('<div class="fl-ctl"></div>');
    if (cfg.prefix) ctl.appendChild(el('<span class="affix">' + esc(cfg.prefix) + '</span>'));
    var input;

        return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(cfg.value) ? ' selected' : '') + '>' + esc(o.l) + '</option>';

  var PASSWORD_MIN = 10;

        a.clear(); b.clear();

  }

      '<div class="panel-body' + (flush ? ' flush' : '') + '"></div></section>');

  /* the slice of a person's software share that followed their allocation onto

  /* ---------- metric card ---------------------------------------------------

  function tile(cfg, value, footHtml, sparkHtml, accent) {
    var o = (cfg && typeof cfg === 'object') ? cfg
      : { label: cfg, value: value, foot: footHtml, spark: sparkHtml, accent: !!accent };

      (o.tip ? ' data-tip="' + esc(o.tip) + '"' : '') + '>' +
      '<div class="t-top">' +
      (ico ? '<span class="t-ico">' + icon(ico) + '</span>' : '') +
      '<span class="t-label">' + esc(o.label) + '</span></div>' +
      '<div class="t-value num">' + o.value + '</div>' +
      '<div class="t-foot">' + (o.foot || '') + '</div>' +
      (o.spark ? '<div class="t-spark">' + o.spark + '</div>' : '') +
