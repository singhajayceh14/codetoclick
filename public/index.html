    var body = el('<div style="display:flex;flex-direction:column;gap:18px"></div>');
    [section('Licence'), grid([name, vendor]), section('Money and period'), grid([price, months]), start, note, out].forEach(function (n) { body.appendChild(n); });

    var go = el('<button class="btn btn-primary" type="button">' + (l ? 'Save changes' : 'Add licence') + '</button>');
    go.addEventListener('click', function () {
      var n = name.value().trim();
      if (!n) return name.fail('Give the licence a name.');
      if (!(+price.value() > 0)) return price.fail('Enter the total price paid.');
      if (!(+months.value() >= 1)) return months.fail('At least one month.');
      var rec = { name: n, vendor: vendor.value().trim(), price: +price.value(), start: start.value(), months: +months.value(), note: note.value().trim() };
      if (l) C.updateLicence(l.id, rec); else C.addLicence(rec);
      document.getElementById('dlg').close();
      U.toast((l ? 'Updated ' : 'Added ') + n, { kind: 'success', detail: money(rec.price / rec.months) + ' a month, ' + C.mshort(rec.start) + ' → ' + C.mshort(C.maddMonths(rec.start, rec.months - 1)) + ', shared by everyone on payroll and charged to projects by allocation.' });
      refresh();
    });
    root.App.openDialog(l ? 'Edit licence' : 'Add a software licence', body, [go],
      'The price is spread evenly across the period, shared by everyone on payroll, and reaches projects through allocation.');
  }

  root.App.dialogs.licenceDelete = function (id) { deleteDialog(id); };
  function deleteDialog(id) {
    var l = C.byId(C.LICENCES, id); if (!l) return;
    var body = el('<div class="callout" style="border-left-color:var(--err)">Removing <strong>' + esc(l.name) + '</strong> takes ' + money(monthly(l)) +
      ' a month out of every month from ' + esc(C.mshort(l.start)) + ' to ' + esc(C.mshort(C.licenceEnd(l))) + '. Restore a backup to bring it back.</div>');
    var go = el('<button class="btn btn-danger" type="button">Remove licence</button>');
    go.addEventListener('click', function () {
      C.deleteLicence(id); document.getElementById('dlg').close();
      U.toast('Removed ' + l.name, { kind: 'error', detail: 'Its monthly charge is gone from every month it covered.' });
      refresh();
    });
    root.App.openDialog('Remove licence', body, [go], 'This cannot be undone from inside the product.');
  }

  /* ---------- the register, hosted by Manage data --------------------------
     Creating, amending and removing a licence is administration, so the
     register with its row actions lives on the Manage data screen; the
     Software and licences screen keeps the analysis and reads the same rows. */
  function registerRows(m) {
    var c = C.rollup(m).company;
    return C.LICENCES.map(function (l) {
      var line = c.licences.filter(function (x) { return x.id === l.id; })[0];
      return { id: l.id, name: l.name, vendor: l.vendor, price: l.price, months: l.months, note: l.note,
        toProjects: line ? line.charge - line.company : 0, toCompany: line ? line.company : 0,
        start: l.start, end: C.licenceEnd(l), monthly: monthly(l), charge: line ? line.charge : 0,
        carriers: line ? line.carriers : 0, share: line ? line.share : 0, st: statusOf(l, m) };
    });
  }
  function registerCols(withActions) {
    var cols = [
      { key: 'name', label: 'Licence', cell: function (x) { return '<strong>' + esc(x.name) + '</strong>' + (x.vendor ? '<div class="muted" style="font-size:12px">' + esc(x.vendor) + '</div>' : ''); } },
      { key: 'start', label: 'Period', cell: function (x) { return C.mshort(x.start) + ' → ' + C.mshort(x.end) + '<div class="muted" style="font-size:12px">' + x.months + ' months</div>'; }, sortVal: function (x) { return C.mindex(x.start); } },
      { key: 'price', label: 'Total price', num: true, cell: function (x) { return money(x.price); } },
      { key: 'monthly', label: 'Per month', num: true, cell: function (x) { return money(x.monthly); } },
      { key: 'carriers', label: 'Shared by', num: true, cell: function (x) { return x.charge ? x.carriers + ' people<div class="muted" style="font-size:12px">' + money(x.share) + ' each</div>' : '<span class="muted">—</span>'; }, sortVal: function (x) { return x.carriers; } },
      { key: 'toProjects', label: 'To projects', num: true, cell: function (x) { return x.charge ? money(x.toProjects) + '<div class="muted" style="font-size:12px">' + money(x.toCompany) + ' overhead</div>' : '<span class="muted">—</span>'; } },
      { key: 'st', label: 'Status', cell: function (x) { return '<span class="pill ' + x.st.cls + '">' + esc(x.st.label) + '</span>'; }, sortVal: function (x) { return x.st.label; } }
    ];
    if (withActions) cols.push({ key: 'act', label: '', sortable: false, num: true, hideable: false, noExport: true,
      cell: function () { return '<div class="row-acts"><button type="button" class="row-act" data-act="Edit" aria-label="Edit" data-tip="Edit licence">' + icon('edit') + '</button>' +
        '<button type="button" class="row-act danger" data-act="Delete" aria-label="Remove" data-tip="Remove licence">' + icon('trash') + '</button></div>'; } });
    return cols;
  }
  function registerTable(m, withActions) {
    var rows = registerRows(m);
    return U.table(registerCols(withActions), rows, {
      title: 'Software licences', subtitle: 'Code to Click · ' + C.mlabel(m), exportName: 'Licence register', id: withActions ? 'lic-admin' : 'licences',
      sortKey: 'monthly', sortDir: -1,
      empty: withActions ? 'No licences yet — add the first one above.' : 'No licences yet. Add them in Manage data → Licences.',
      onAction: withActions ? function (x, act) { if (act === 'Edit') licenceDialog(x.id); else deleteDialog(x.id); } : null,
      foot: { name: rows.length + ' licences', monthly: money(rows.reduce(function (a, x) { return a + x.monthly; }, 0)), price: money(rows.reduce(function (a, x) { return a + x.price; }, 0)) }
    });
  }

  /* Manage data hosts this pane under its own tab. */
  root.App.licencePane = function (m) {
    var f = document.createDocumentFragment(), c = C.rollup(m).company;
    f.appendChild(el('<div class="callout" style="margin-bottom:16px">A licence is a purchase: a price and a period. Its monthly charge is <strong>price ÷ months</strong>, ' +
      'shared equally by everyone on payroll, and each person’s share follows their allocation onto the projects they work on. ' +
      'Editing a licence restates every month it covers — the period is a fact about the purchase, not about the month.</div>'));
    var t = registerTable(m, true);
    var add = H.btn('Add licence', 'btn-primary', function () { licenceDialog(null); }, 'plus');
    var pn = U.panel('Licence register', C.LICENCES.length + ' on the register · ' + money(c.licenceCost) + ' charged in ' + C.mlabel(m), t, true, add);
    f.appendChild(pn);
    return f;
  };

  /* ---------- the screen ---------------------------------------------------- */
  V.licences = function (s) {
    var f = document.createDocumentFragment(), m = s.month, r = C.rollup(m), c = r.company;
    var t12 = H.trailing12(m);
    f.appendChild(H.head('Software and licences',
      'Every licence is spread evenly across its period and shared equally by everyone on payroll. ' +
      'Each person’s share follows their allocation: time on a project puts that part on the project’s other cost; internal time and bench go to company overhead.',
      [H.btn('Manage licences', 'btn-primary', function () { root.App.go('admin', { tab: 'licences' }); }, 'sliders')]));

    /* --- summary ---------------------------------------------------------- */
    var active = C.licencesFor(m);
    var lab = t12.map(function (x) { return C.mshort(x); });
    var series = t12.map(function (x) { return C.rollup(x).company.licenceCost; });
    var tiles = el('<div class="tiles"></div>');
    tiles.appendChild(U.tile({ kind: 'other', label: 'Licence cost this month', value: moneyK(c.licenceCost), foot: '<span>' + active.length + ' active of ' + C.LICENCES.length + '</span>',
      spark: U.sparkline(series, 'var(--m-other)', 300, 44, { labels: lab, name: 'Licences' }), accent: true, tip: 'Exact: ' + money(c.licenceCost) }));
    tiles.appendChild(U.tile({ kind: 'revenue', label: 'On projects', value: moneyK(c.licenceProjectCost), foot: '<span>' + pct(c.licenceCost ? c.licenceProjectCost / c.licenceCost : 0, 0) + ' of licence cost</span>', tip: 'The part of everyone’s software share that followed their allocation onto billable projects.' }));
    tiles.appendChild(U.tile({ kind: 'people', label: 'Overhead', value: moneyK(c.licenceCompanyCost), foot: '<span>internal time, non-billable and bench</span>', tip: 'The part of software shares carried by people who were not on a billable project.' }));
    tiles.appendChild(U.tile({ kind: 'cost', label: 'Per employee', value: money(c.headcount ? c.licenceCost / c.headcount : 0), foot: '<span>average software share</span>', tip: 'Licence cost ÷ headcount.' }));
    tiles.appendChild(U.tile({ kind: 'profit', label: 'Share of other cost', value: pct(c.otherCost ? c.licenceCost / c.otherCost : 0), foot: '<span>of ' + money(c.otherCost) + '</span>', tip: 'Licences as a share of all other cost this month.' }));
    tiles.appendChild(U.tile({ kind: 'margin', label: 'Annualised', value: moneyK(C.LICENCES.reduce(function (t, l) { return t + monthly(l) * 12; }, 0)), foot: '<span>if every licence ran all year</span>', tip: 'Sum of monthly charges × 12 across the whole register.' }));
    f.appendChild(tiles);

    /* --- register (read only; edits live in Manage data) --------------------- */
    f.appendChild(H.section('Licence register', C.LICENCES.length + ' on the register'));
    f.appendChild(U.panel('Register', 'Charges are recomputed for every month a licence covers · add, edit and remove them in Manage data → Licences',
      registerTable(m, false), true, H.btn('Manage', 'btn-sm', function () { root.App.go('admin', { tab: 'licences' }); }, 'sliders')));

    /* --- who carries it, and the year ------------------------------------- */
    var g = el('<div class="grid-2" style="margin-top:16px"></div>');
    var people = Object.keys(r.byEmployee).map(function (id) { return r.byEmployee[id]; })
      .filter(function (e) { return e.toolCost > 0.005; }).sort(function (a, b) { return b.toolCost - a.toolCost; });
    var pt = U.table([
      { key: 'name', label: 'Person', cell: function (e) { return '<strong>' + esc(e.name) + '</strong><div class="muted" style="font-size:12px">' + esc(e.dept) + '</div>'; } },
      { key: 'n', label: 'Licences', num: true, sortVal: function (e) { return e.tools.length; }, cell: function (e) { return e.tools.length; } },
      { key: 'toolCost', label: 'Software', num: true, cell: function (e) { return money(e.toolCost) + '<div class="muted" style="font-size:12px">' + money(U.toolOnProjects(e)) + ' on projects</div>'; } },
      { key: 'monthlyCost', label: 'Payroll', num: true, cell: function (e) { return money(e.monthlyCost); } },
      { key: 'loadedCost', label: 'Loaded cost', num: true, cell: function (e) { return '<strong>' + money(e.loadedCost) + '</strong>'; } }
    ], people, { title: 'Software cost by person', subtitle: C.mlabel(m), exportName: 'Software by person', id: 'lic-people', sortKey: 'toolCost', sortDir: -1, pageSize: 10,
      onRow: function (e) { root.App.go('employee', { id: e.id }); }, empty: 'No licence is charged to anyone in ' + C.mlabel(m) + '.' });
    g.appendChild(U.panel('Who carries it', C.mlabel(m) + ' · each person’s share of every licence they use', pt, true));
    g.appendChild(U.panel('Licence cost by month', 'Trailing twelve months', U.columnChart({
      months: t12, values: series, label: 'Licence cost', height: 236,
      colorFor: function () { return 'var(--m-other)'; }, opacityFor: function (v, i) { return t12[i] === m ? 1 : .45; },
      onClickMonth: function (x) { root.App.setMonth(x); }
    })));
    f.appendChild(g);
    return f;
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================================
   Revenue — one sheet for reading and writing.

   Projects down the side, months across the top, every cell editable in
   place. The grid is the record: what you see is what the month snapshots
   hold, plus any edits you have typed but not yet saved. Edits are kept in
   `pending` (month|project -> amount) so they survive filtering, searching
   and moving the reporting month; nothing touches a snapshot until Save.
   Only changed cells are written, one setRevenue per cell, so a month you
   did not touch is never restated.
   ========================================================================== */
(function (root) {
  'use strict';
  var C = root.CTC, U = root.UI, V = root.VIEWS, H = root.VIEWHELP;
  var money = U.money, moneyK = U.moneyK, esc = U.esc, el = U.el, icon = U.icon;
  var head = H.head, btn = H.btn, frag = H.frag, clientOf = H.clientOf;

  var pending = {};          // 'month|projectId' -> rounded amount, until saved or discarded
  var shut = {};             // clientId -> true when that client's rows are folded away
  var q = '';                // search text, kept while the grid redraws

  function key(m, pid) { return m + '|' + pid; }
  function num(v) { v = String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''); return v === '' ? NaN : +v; }
  function booked(m, pid) { return C.snapshot(m).revenue[pid] || 0; }
  function shown(m, pid) { var k = key(m, pid); return k in pending ? pending[k] : booked(m, pid); }
  function pendingMonths() { var o = {}; Object.keys(pending).forEach(function (k) { o[k.split('|')[0]] = 1; }); return Object.keys(o); }

  /* Which months run across the top: the reporting period when it spans more
     than one month, otherwise the six months up to the selected month. */
  function columns(s) {
    var p = H.periodBlock(s);
    if (p.months.length > 1) return { months: p.months, note: p.label };
    var out = [];
    for (var k = 5; k >= 0; k--) { var m = C.maddMonths(s.month, -k); if (C.MONTHS.indexOf(m) !== -1) out.push(m); }
    return { months: out, note: out.length + ' months to ' + C.mlabel(s.month) };
  }

  function visibleProjects(s, months) {
    var ql = q.trim().toLowerCase();
    return C.PROJECTS.filter(function (p) {
      if (p.billable === false) return false;            // cost centres never bill
      var cl = C.byId(C.CLIENTS, p.clientId) || {};
      if (s.filters.client && p.clientId !== s.filters.client) return false;
      if (s.filters.type && p.type !== s.filters.type) return false;
      if (ql && (p.name + ' ' + (cl.name || '') + ' ' + p.type).toLowerCase().indexOf(ql) === -1) return false;
      return months.some(function (m) { return C.isActiveProj(p, m); });
    }).sort(function (a, b) {
      var ca = (C.byId(C.CLIENTS, a.clientId) || {}).name || '', cb = (C.byId(C.CLIENTS, b.clientId) || {}).name || '';
      return ca.localeCompare(cb) || a.name.localeCompare(b.name);
    });
  }

  function spark(vals) { return U.sparkline(vals, 'var(--m-revenue)', 72, 22); }
  function chg(cur, prev) {
    if (!prev) return '<span class="muted">—</span>';
    var d = (cur - prev) / prev * 100;
    return '<span class="' + (d > 0.05 ? 'ok' : d < -0.05 ? 'bad' : 'muted') + '">' + (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(1) + '%</span>';
  }

  V.revenue = function (s) {
    var f = frag(), m0 = s.month, cols = columns(s), months = cols.months;
    var r0 = C.rollup(m0), prevM = C.maddMonths(m0, -1), rPrev = C.MONTHS.indexOf(prevM) !== -1 ? C.rollup(prevM) : null;

    /* ---- head + KPIs (booked figures) --------------------------------------- */
    var exp = root.EXP ? root.EXP.menu(function () { return spec(); }, 'Export') : null;
    if (exp) exp.classList.add('rg-export');
    f.appendChild(head('Revenue', 'Projects down, months across — type straight into the sheet. Showing ' + esc(cols.note) + '.',
      [exp, btn('Month sheet', 'btn-ghost', function () { root.App.dialogs.revenueSheet(m0); }, 'report'),
       btn('Add revenue', 'btn-primary', function () { root.App.dialogs.revenue({ month: m0 }); }, 'plus')].filter(Boolean)));

    var billing = Object.keys(r0.byProject).filter(function (k) { return r0.byProject[k].revenue > 0; }).length;
    var byClient = Object.keys(r0.byClient).map(function (k) { return r0.byClient[k]; }).sort(function (a, b) { return b.revenue - a.revenue; });
    var top = byClient[0];
    var colTotal = months.reduce(function (t, m) { return t + C.rollup(m).company.revenue; }, 0);
    var kp = '<div class="kpis">';
    kp += U.kpi('Revenue · ' + esc(C.mshort(m0)), money(r0.company.revenue), U.deltaChip(r0.company.revenue, rPrev ? rPrev.company.revenue : null) + ' <span>vs ' + esc(rPrev ? C.mshort(prevM) : '—') + '</span>', true);
    kp += U.kpi(months.length + ' months shown', money(colTotal), '<span>' + money(colTotal / months.length) + ' a month on average</span>');
    kp += U.kpi('Projects billing', String(billing), '<span>of ' + Object.keys(r0.byProject).length + ' active in ' + esc(C.mshort(m0)) + '</span>');
    kp += U.kpi('Largest client', top ? esc(top.name) : '—', top ? '<span>' + U.pct(top.revenue / (r0.company.revenue || 1)) + ' of ' + esc(C.mshort(m0)) + ' · ' + money(top.revenue) + '</span>' : '');
    kp += '</div>';
    f.appendChild(el(kp));

    /* ---- filters: client, type, search, fold ------------------------------- */
    var bar = H.filterBar(s, ['client', 'type'], function () { root.App.render(); });
    var search = el('<label class="search rg-search"><span class="ic">' + icon('search') + '</span><input type="search" placeholder="Find a project or client" aria-label="Find a project or client"></label>');
    var si = search.querySelector('input'); si.value = q;
    si.addEventListener('input', function () { q = si.value; drawGrid(); });
    bar.insertBefore(search, bar.firstChild);
    var fold = btn('Fold clients', 'btn-sm', function () {
      var allShut = C.CLIENTS.every(function (c) { return shut[c.id]; });
      C.CLIENTS.forEach(function (c) { shut[c.id] = !allShut; });
      drawGrid();
    });
    bar.appendChild(fold);
    f.appendChild(bar);

    /* ---- the sheet --------------------------------------------------------- */
    var panel = U.panel('Revenue sheet', cols.note + ' · click a month to make it the reporting month · unsaved cells are highlighted', null, true);
    var host = panel.querySelector('.panel-body');
    var saveBar = el('<div class="rg-save" hidden><span class="rg-save-txt"></span><span class="rg-save-acts"></span></div>');
    var discard = btn('Discard', 'btn-ghost btn-sm', function () { pending = {}; root.App.render(); U.toast('Changes discarded', { detail: 'The sheet is back to what is booked.' }); });
    var save = btn('Save changes', 'btn-primary btn-sm', function () {
      var keys = Object.keys(pending), ms = pendingMonths();
      keys.forEach(function (k) { var kv = k.split('|'); C.setRevenue(kv[0], kv[1], pending[k]); });
      pending = {};
      U.toast('Revenue saved', { kind: 'success', detail: keys.length + ' cell' + (keys.length === 1 ? '' : 's') + ' written across ' + ms.length + ' month' + (ms.length === 1 ? '' : 's') + '. Every other month is untouched.' });
      root.App.render();
    });
    saveBar.querySelector('.rg-save-acts').appendChild(discard);
    saveBar.querySelector('.rg-save-acts').appendChild(save);
    f.appendChild(panel);
    f.appendChild(saveBar);

    var wrap, rows = [], inputs = {};       // inputs[pid][m] -> input element

    function spec() {
      var cs = [{ label: 'Client' }, { label: 'Project' }, { label: 'Type' }].concat(months.map(function (m) { return { label: C.mshort(m), num: true }; }), [{ label: 'Total', num: true }]);
      var rs = rows.map(function (p) {
        var vals = months.map(function (m) { return C.isActiveProj(p, m) ? shown(m, p.id) : ''; });
        var t = vals.reduce(function (a, v) { return a + (v || 0); }, 0);
        return [(C.byId(C.CLIENTS, p.clientId) || {}).name || '', p.name, p.type].concat(vals.map(function (v) { return v === '' ? '' : money(v); }), [money(t)]);
      });
      return { name: 'Revenue sheet ' + cols.note, title: 'Revenue sheet', subtitle: 'Code to Click · ' + cols.note, cols: cs, rows: rs };
    }

    function drawGrid() {
      rows = visibleProjects(s, months); inputs = {};
      host.innerHTML = '';
      if (!rows.length) {
        host.appendChild(U.emptyState('No projects match', 'Clear the filters or search for something else.', '', 'search'));
        updateSaveBar(); return;
      }
      var h = '<div class="rg-wrap"><table class="rg"><thead><tr><th class="rg-side">Client / project</th>';
      months.forEach(function (m) {
        h += '<th class="rg-m' + (m === m0 ? ' cur' : '') + '" data-m="' + m + '" title="Make ' + esc(C.mlabel(m)) + ' the reporting month"><span>' + esc(C.mabbr(m)) + '</span><small>' + m.slice(2, 4) + '</small></th>';
      });
      h += '<th class="rg-tot">Total</th><th class="rg-trend">Trend</th></tr></thead><tbody>';
      var lastClient = null;
      rows.forEach(function (p) {
        if (p.clientId !== lastClient) {
          lastClient = p.clientId;
          var cl = C.byId(C.CLIENTS, p.clientId) || {}, n = rows.filter(function (x) { return x.clientId === p.clientId; }).length;
          h += '<tr class="rg-client' + (shut[p.clientId] ? ' shut' : '') + '" data-c="' + p.clientId + '"><th class="rg-side"><button type="button" class="rg-tog" aria-label="Fold or unfold ' + esc(cl.name || '') + '">' + icon('chevron') + '</button>' +
            '<span class="rg-cname">' + esc(cl.name || '') + '</span><span class="rg-n">' + n + ' project' + (n === 1 ? '' : 's') + '</span></th>';
          months.forEach(function (m) { h += '<td class="rg-sub' + (m === m0 ? ' cur' : '') + '" data-m="' + m + '"></td>'; });
          h += '<td class="rg-tot rg-sub"></td><td class="rg-trend"></td></tr>';
        }
        h += '<tr class="rg-proj" data-p="' + p.id + '" data-c="' + p.clientId + '"' + (shut[p.clientId] ? ' hidden' : '') + '><th class="rg-side"><a class="rg-name" href="#" data-go="' + p.id + '">' + esc(p.name) + '</a><span class="rg-type">' + esc(p.type) + '</span></th>';
        months.forEach(function (m) {
          if (!C.isActiveProj(p, m)) { h += '<td class="rg-cell off' + (m === m0 ? ' cur' : '') + '"><span title="Not running in ' + esc(C.mshort(m)) + '">·</span></td>'; return; }
          var v = shown(m, p.id), dirty = key(m, p.id) in pending;
          h += '<td class="rg-cell' + (m === m0 ? ' cur' : '') + '"><input class="rg-in' + (dirty ? ' dirty' : '') + '" type="text" inputmode="decimal" data-m="' + m + '" data-p="' + p.id + '" value="' + v.toLocaleString() + '" aria-label="' + esc(p.name + ' ' + C.mlabel(m)) + '"></td>';
        });
        h += '<td class="rg-tot"></td><td class="rg-trend"></td></tr>';
      });
      h += '</tbody><tfoot><tr class="rg-total"><th class="rg-side">Total · ' + rows.length + ' project' + (rows.length === 1 ? '' : 's') + '</th>';
      months.forEach(function (m) { h += '<td class="rg-ft' + (m === m0 ? ' cur' : '') + '" data-m="' + m + '"></td>'; });
      h += '<td class="rg-tot"></td><td class="rg-trend"></td></tr><tr class="rg-mom"><th class="rg-side">Month on month</th>';
      months.forEach(function (m) { h += '<td class="rg-fm' + (m === m0 ? ' cur' : '') + '" data-m="' + m + '"></td>'; });
      h += '<td></td><td></td></tr></tfoot></table></div>';
      host.innerHTML = h;
      wrap = host.querySelector('.rg-wrap');

      wrap.querySelectorAll('.rg-in').forEach(function (inp) {
        var pid = inp.getAttribute('data-p'), m = inp.getAttribute('data-m');
        (inputs[pid] = inputs[pid] || {})[m] = inp;
        inp.addEventListener('focus', function () { var v = num(inp.value); inp.value = isNaN(v) ? '' : String(v); inp.select(); inp.closest('tr').classList.add('on'); });
        inp.addEventListener('blur', function () { var v = num(inp.value); if (!isNaN(v)) inp.value = Math.round(v).toLocaleString(); inp.closest('tr').classList.remove('on'); });
        inp.addEventListener('input', function () { mark(inp); recalc(); });
        inp.addEventListener('keydown', function (e) { nav(e, inp); });
        inp.addEventListener('paste', function (e) { paste(e, inp); });
      });
      wrap.querySelectorAll('th.rg-m').forEach(function (th) { th.addEventListener('click', function () { root.App.setMonth(th.getAttribute('data-m')); }); });
      wrap.querySelectorAll('.rg-tog').forEach(function (b) {
        b.addEventListener('click', function () {
          var tr = b.closest('tr'), cid = tr.getAttribute('data-c');
          shut[cid] = !shut[cid]; tr.classList.toggle('shut', !!shut[cid]);
          wrap.querySelectorAll('tr.rg-proj[data-c="' + cid + '"]').forEach(function (x) { x.hidden = !!shut[cid]; });
        });
      });
      wrap.querySelectorAll('a.rg-name').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); root.App.go('project', { id: a.getAttribute('data-go') }); }); });
      recalc();
    }

    function mark(inp) {
      var pid = inp.getAttribute('data-p'), m = inp.getAttribute('data-m'), v = num(inp.value), k = key(m, pid);
      var bad = isNaN(v) || v < 0;
      inp.classList.toggle('bad', bad);
      if (bad) return;
      if (Math.round(v) !== booked(m, pid)) pending[k] = Math.round(v); else delete pending[k];
      inp.classList.toggle('dirty', k in pending);
    }

    function cellValue(pid, m) {
      var inp = inputs[pid] && inputs[pid][m];
      if (!inp) return 0;
      var v = num(inp.value); return isNaN(v) || v < 0 ? 0 : v;
    }

    function recalc() {
      var monthTot = {}, clientTot = {};
      months.forEach(function (m) { monthTot[m] = 0; });
      rows.forEach(function (p) {
        var vals = months.map(function (m) { return cellValue(p.id, m); });
        var t = vals.reduce(function (a, b) { return a + b; }, 0);
        var tr = wrap.querySelector('tr.rg-proj[data-p="' + p.id + '"]');
        tr.querySelector('.rg-tot').textContent = money(t);
        tr.querySelector('.rg-trend').innerHTML = spark(vals);
        clientTot[p.clientId] = clientTot[p.clientId] || {};
        months.forEach(function (m, i) { monthTot[m] += vals[i]; clientTot[p.clientId][m] = (clientTot[p.clientId][m] || 0) + vals[i]; });
      });
      wrap.querySelectorAll('tr.rg-client').forEach(function (tr) {
        var cid = tr.getAttribute('data-c'), ct = clientTot[cid] || {}, vals = months.map(function (m) { return ct[m] || 0; });
        tr.querySelectorAll('td.rg-sub[data-m]').forEach(function (td) { var v = ct[td.getAttribute('data-m')] || 0; td.textContent = v ? money(v) : '—'; });
        tr.querySelector('.rg-tot').textContent = money(vals.reduce(function (a, b) { return a + b; }, 0));
        tr.querySelector('.rg-trend').innerHTML = spark(vals);
      });
      var grand = 0;
      months.forEach(function (m, i) {
        grand += monthTot[m];
        wrap.querySelector('td.rg-ft[data-m="' + m + '"]').textContent = money(monthTot[m]);
        var prev = i ? monthTot[months[i - 1]] : (C.MONTHS.indexOf(C.maddMonths(m, -1)) !== -1 ? C.rollup(C.maddMonths(m, -1)).company.revenue : 0);
        wrap.querySelector('td.rg-fm[data-m="' + m + '"]').innerHTML = chg(monthTot[m], prev);
      });
      var ft = wrap.querySelector('tr.rg-total');
      ft.querySelector('.rg-tot').textContent = money(grand);
      ft.querySelector('.rg-trend').innerHTML = spark(months.map(function (m) { return monthTot[m]; }));
      updateSaveBar();
    }

    function updateSaveBar() {
      var n = Object.keys(pending).length, ms = pendingMonths();
      saveBar.hidden = !n;
      if (n) saveBar.querySelector('.rg-save-txt').innerHTML = '<strong>' + n + ' unsaved cell' + (n === 1 ? '' : 's') + '</strong> in ' +
        ms.map(function (m) { return C.mshort(m); }).join(', ') + ' · nothing is booked until you save';
    }

    function nav(e, inp) {
      var pid = inp.getAttribute('data-p'), m = inp.getAttribute('data-m');
      var order = rows.filter(function (p) { return !shut[p.clientId]; }).map(function (p) { return p.id; });
      var ri = order.indexOf(pid), ci = months.indexOf(m), target = null;
      function at(r, c) { var id = order[r], mm = months[c]; return id && mm && inputs[id] && inputs[id][mm]; }
      if (e.key === 'Enter' || e.key === 'ArrowDown') { for (var r = ri + 1; r < order.length && !target; r++) target = at(r, ci); }
      else if (e.key === 'ArrowUp') { for (var r2 = ri - 1; r2 >= 0 && !target; r2--) target = at(r2, ci); }
      else if (e.key === 'ArrowRight' && inp.selectionStart === inp.value.length) { for (var c = ci + 1; c < months.length && !target; c++) target = at(ri, c); }
      else if (e.key === 'ArrowLeft' && inp.selectionStart === 0) { for (var c2 = ci - 1; c2 >= 0 && !target; c2--) target = at(ri, c2); }
      else if (e.key === 'Escape') { inp.value = String(shown(m, pid)); mark(inp); recalc(); inp.blur(); return; }
      if (target) { e.preventDefault(); e.stopPropagation(); target.focus(); }
    }

    /* A block copied from a spreadsheet lands with its top-left on this cell:
       rows go down, tab-separated columns go across. Cells a project is not
       running in are skipped, not filled. */
    function paste(e, inp) {
      var txt = (e.clipboardData || window.clipboardData).getData('text') || '';
      var lines = txt.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim() !== ''; });
      if (lines.length < 2 && lines[0] && lines[0].indexOf('\t') === -1) return;
      e.preventDefault();
      var order = rows.filter(function (p) { return !shut[p.clientId]; }).map(function (p) { return p.id; });
      var ri = order.indexOf(inp.getAttribute('data-p')), ci = months.indexOf(inp.getAttribute('data-m')), n = 0;
      lines.forEach(function (line, dr) {
        line.split('\t').forEach(function (cell, dc) {
          var id = order[ri + dr], mm = months[ci + dc], t = id && mm && inputs[id] && inputs[id][mm];
          var v = num(cell); if (!t || isNaN(v)) return;
          t.value = Math.round(v).toLocaleString(); mark(t); n++;
        });
      });
      recalc();
      U.toast('Pasted ' + n + ' value' + (n === 1 ? '' : 's'), { detail: 'Check the highlighted cells, then save.' });
    }

    drawGrid();

    /* ---- who the money comes from, across the shown months ------------------ */
    var perClient = {};
    months.forEach(function (m) {
      var r = C.rollup(m);
      Object.keys(r.byClient).forEach(function (k) { perClient[k] = perClient[k] || { name: r.byClient[k].name, total: 0, vals: {} }; perClient[k].total += r.byClient[k].revenue; perClient[k].vals[m] = r.byClient[k].revenue; });
    });
    var ranked = Object.keys(perClient).map(function (k) { return perClient[k]; }).sort(function (a, b) { return b.total - a.total; });
    var topN = ranked.slice(0, 5), rest = ranked.slice(5);
    var palette = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--text-3)'];
    var series = topN.map(function (c, i) { return { label: c.name, color: palette[i], values: months.map(function (m) { return c.vals[m] || 0; }) }; });
    if (rest.length) series.push({ label: rest.length + ' other client' + (rest.length === 1 ? '' : 's'), color: palette[5], values: months.map(function (m) { return rest.reduce(function (t, c) { return t + (c.vals[m] || 0); }, 0); }) });
    var chart = U.stackedColumnChart({ months: months, series: series, height: 220, totalLabel: 'Revenue', onClickMonth: function (m) { root.App.setMonth(m); } });
    var cp = U.panel('Revenue by client', cols.note + ' · booked figures, largest clients first', chart);
    cp.appendChild(el('<div class="pv-legend" style="padding-top:0">' + series.map(function (sr) { return '<span><i style="background:' + sr.color + '"></i>' + esc(sr.label) + '</span>'; }).join('') + '</div>'));
    cp.style.marginTop = '16px';
    f.appendChild(cp);
    return f;
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================================
   Profitability 360 — company, clients and projects on one screen.

   One page answers the questions a leadership team asks each month: are we
   making money, is it getting better, where does it come from, who is
   dragging it down, and how much of our payroll is actually earning. Every
   figure is a sum of monthly records over the reporting period; the tabs
   only change which layer is expanded, never the numbers.
   ========================================================================== */
(function (root) {
  'use strict';
  var C = root.CTC, U = root.UI, V = root.VIEWS, H = root.VIEWHELP;
  var money = U.money, moneyK = U.moneyK, pct = U.pct, esc = U.esc, el = U.el, icon = U.icon;
  var head = H.head, btn = H.btn, frag = H.frag, section = H.section;

  var tab = 'company';                 // company | clients | projects — survives re-renders
  var matrixSort = 'revenue';

  function deltaPts(a, b) { return b == null ? '' : U.deltaChip(a, b, { points: true }); }

  /* ---------- the numbers behind the page ---------------------------------- */
  function compute(s) {
    var p = H.periodBlock(s), a = p.agg, b = p.prevAgg, ms = p.months, last = ms[ms.length - 1];
    var heads = ms.map(function (m) { return C.rollup(m).company.headcount; });
    var avgHead = heads.reduce(function (t, x) { return t + x; }, 0) / (ms.length || 1);
    var clients = C.aggregateBy(ms, 'client').sort(function (x, y) { return y.revenue - x.revenue; });
    var projects = C.aggregateBy(ms, 'project');
    var billable = projects.filter(function (x) { return x.billable; });
    var costCentres = projects.filter(function (x) { return !x.billable; });
    var bands = { healthy: [], watch: [], critical: [], loss: [] };
    billable.forEach(function (x) { bands[U.band(x.margin).key].push(x); });
    var top1 = clients[0], top3 = clients.slice(0, 3).reduce(function (t, x) { return t + x.revenue; }, 0);
    var t12 = H.trailing12(last);
    var series = function (k) { return t12.map(function (m) { return C.rollup(m).company[k]; }); };
    return {
      p: p, a: a, b: b, ms: ms, last: last, avgHead: avgHead, clients: clients, projects: projects, billable: billable, costCentres: costCentres, bands: bands,
      util: a.employeeCost ? a.projectEmpCost / a.employeeCost : 0,
      utilPrev: b && b.employeeCost ? b.projectEmpCost / b.employeeCost : null,
      bench: a.employeeCost ? a.unallocatedEmpCost / a.employeeCost : 0,
      benchPrev: b && b.employeeCost ? b.unallocatedEmpCost / b.employeeCost : null,
      revPerHead: avgHead ? a.revenue / ms.length / avgHead : 0,
      profitPerHead: avgHead ? a.profit / ms.length / avgHead : 0,
      conc1: a.revenue && top1 ? top1.revenue / a.revenue : 0, conc3: a.revenue ? top3 / a.revenue : 0, top1: top1,
      t12: t12, series: series
    };
  }

  /* ---------- decision strip ------------------------------------------------- */
  function decisionStrip(d) {
    var a = d.a, b = d.b, vs = b ? (d.p.isSingle ? 'vs ' + C.mshort(C.maddMonths(d.ms[0], -1)) : 'vs prior period') : '';
    var cells = [
      { label: 'Revenue', value: moneyK(a.revenue), foot: U.deltaChip(a.revenue, b && b.revenue) + ' ' + vs, tip: 'Exact: ' + money(a.revenue) },
      { label: 'Gross profit', value: moneyK(a.profit), foot: U.deltaChip(a.profit, b && b.profit) + ' ' + vs, tip: 'Revenue − all payroll − all other cost. Exact: ' + money(a.profit) },
      { label: 'Gross margin', value: pct(a.margin), foot: deltaPts(a.margin, b && b.margin) + ' <span class="pill ' + U.band(a.margin).cls + '">' + U.band(a.margin).label + '</span>', tip: 'Profit ÷ revenue' },
      { label: 'Billable utilisation', value: pct(d.util), foot: deltaPts(d.util, d.utilPrev) + ' of payroll on client projects', tip: 'Payroll allocated to billable projects ÷ total payroll. Internal time, non-billable projects and bench are the rest.' },
      { label: 'Bench', value: pct(d.bench), foot: money(a.unallocatedEmpCost) + ' unallocated', tip: 'Payroll with no allocation at all — the first place to look when margin slips.' },
      { label: 'Revenue per head', value: money(Math.round(d.revPerHead)), unit: '/ month', foot: 'across ' + d.avgHead.toFixed(1) + ' people on average', tip: 'Monthly revenue ÷ average headcount in the period' },
      { label: 'Profit per head', value: money(Math.round(d.profitPerHead)), unit: '/ month', foot: money(Math.round(a.employeeCost / (d.ms.length || 1) / (d.avgHead || 1))) + ' payroll per head', tip: 'Monthly gross profit ÷ average headcount' },
      { label: 'Client concentration', value: pct(d.conc1, 0), foot: (d.top1 ? esc(d.top1.name) + ' · top 3 = ' + pct(d.conc3, 0) : '—'), tip: 'Share of revenue from the largest client. Above 30–35% is a dependency worth managing.' }
    ];
    var n = el(U.sumStrip(cells)); n.classList.add('four'); return n;
  }

  /* ---------- layer 1: company ---------------------------------------------- */
  function companyLayer(d) {
    var f = frag(), a = d.a;
    var g = el('<div class="grid-2"></div>');
    g.appendChild(U.panel('Revenue, cost and profit', 'Trailing twelve months to ' + C.mshort(d.last) + ' · click a month to open it', U.lineChart({
      months: d.t12, height: 240, onClickMonth: function (m) { root.App.setMonth(m); },
      series: [
        { label: 'Revenue', color: 'var(--s1)', area: true, values: d.series('revenue') },
        { label: 'Total cost', color: 'var(--s2)', values: d.series('totalCost') },
        { label: 'Gross profit', color: 'var(--s3)', values: d.series('profit') }
      ]
    })));
    g.appendChild(U.panel('Where the money goes', d.p.label, U.waterfall({
      height: 240,
      steps: [
        { label: 'Revenue', value: a.revenue, kind: 'total' },
        { label: 'Project people', value: -a.projectEmpCost, kind: 'sub', note: 'Payroll on billable projects' },
        { label: 'Project cost', value: -(a.otherCost - a.companyOtherCost), kind: 'sub', note: 'Cloud, contractors, travel, licences' },
        { label: 'Idle payroll', value: -(a.internalEmpCost + a.unallocatedEmpCost), kind: 'sub', note: 'Internal ' + money(a.internalEmpCost) + ' + bench ' + money(a.unallocatedEmpCost) },
        { label: 'Overhead', value: -a.companyOtherCost, kind: 'sub', note: 'Company-level cost' },
        { label: 'Profit', value: a.profit, kind: 'total' }
      ]
    })));
    f.appendChild(g);

    /* margin trend with the bands drawn in */
    var mg = el('<div class="grid-2" style="margin-top:16px"></div>');
    var margins = d.t12.map(function (m) { return C.rollup(m).company.margin; });
    mg.appendChild(U.panel('Gross margin by month', 'Healthy ≥ ' + pct(U.BANDS.healthy, 0) + ' · watch ' + pct(U.BANDS.watch, 0) + '–' + pct(U.BANDS.healthy, 0) + ' · critical below', U.columnChart({
      months: d.t12, values: margins, label: 'Margin', height: 200,
      tickFmt: function (v) { return (v * 100).toFixed(0) + '%'; }, tipFmt: function (v) { return pct(v); },
      colorFor: function (v) { return v < 0 ? 'var(--err)' : v < U.BANDS.watch ? 'var(--s2)' : v < U.BANDS.healthy ? 'var(--s1)' : 'var(--s3)'; },
      onClickMonth: function (m) { root.App.setMonth(m); }
    })));
    /* payroll destination: the utilisation story in one bar */
    var pay = [
      { label: 'Client projects', value: a.projectEmpCost, color: 'var(--s1)' },
      { label: 'Internal & non-billable', value: a.internalEmpCost, color: 'var(--s4)' },
      { label: 'Bench', value: a.unallocatedEmpCost, color: 'var(--m-other)' }
    ];
    var payBox = el('<div></div>');
    payBox.appendChild(U.segbar(pay, a.employeeCost, { aria: 'Payroll by destination' }));
    payBox.appendChild(el('<div class="recon" style="margin-top:14px">' +
      '<div class="r"><span>Payroll</span><span>' + money(a.employeeCost) + '</span></div>' +
      '<div class="r"><span>Software licences carried by people</span><span>' + money(a.licenceCost || 0) + '</span></div>' +
      '<div class="r"><span>Cost centres (non-billable projects)</span><span>' + money(d.costCentres.reduce(function (t, x) { return t + x.totalCost; }, 0)) + '</span></div>' +
      '<div class="r total"><span>Every $1 of payroll earned</span><span>' + (a.employeeCost ? '$' + (a.revenue / a.employeeCost).toFixed(2) : '—') + '</span></div></div>'));
    mg.appendChild(U.panel('Payroll by destination', pct(d.util) + ' of payroll reached a client project in ' + d.p.label, payBox));
    f.appendChild(mg);

    /* the same ladder as the project tables, at company level */
    var pl = el('<div class="recon">' +
      '<div class="r"><span>Revenue</span><span>' + money(a.revenue) + '</span></div>' +
      '<div class="r neg"><span>Employee cost (all payroll)</span><span>−' + money(a.employeeCost) + '</span></div>' +
      '<div class="r total"><span>Contribution after people · ' + pct(a.revenue ? (a.revenue - a.employeeCost) / a.revenue : 0) + ' people margin</span><span>' + money(a.revenue - a.employeeCost) + '</span></div>' +
      '<div class="r neg"><span>Other cost (projects + overhead)</span><span>−' + money(a.otherCost) + '</span></div>' +
      '<div class="r total"><span>Profit · ' + pct(a.margin) + ' margin</span><span>' + money(a.profit) + '</span></div></div>');
    var plg = el('<div class="grid-2" style="margin-top:16px"></div>');
    plg.appendChild(U.panel('Company ladder', d.p.label + ' · the project columns, summed for the whole company', pl));
    var pm12 = d.t12.map(function (m) { var c = C.rollup(m).company; return c.revenue ? (c.revenue - c.employeeCost) / c.revenue : 0; });
    plg.appendChild(U.panel('People margin by month', 'Revenue less all payroll, ÷ revenue · the gap to gross margin is other cost', U.columnChart({
      months: d.t12, values: pm12, label: 'People margin', height: 200,
      tickFmt: function (v) { return (v * 100).toFixed(0) + '%'; }, tipFmt: function (v) { return pct(v); },
      colorFor: function () { return 'var(--m-people)'; }, onClickMonth: function (m) { root.App.setMonth(m); }
    })));
    f.appendChild(plg);

    /* quarters and year-to-date, summed from months */
    var groups = {}, order = [];
    C.MONTHS.forEach(function (m) { var k = C.fiscalLabel(m) + ' Q' + C.mquarter(m); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(m); });
    var qrows = order.map(function (k) { var ms2 = groups[k], q = C.aggregate(ms2); return { label: k, months: ms2.length, revenue: q.revenue, totalCost: q.totalCost, profit: q.profit, margin: q.margin, ms: ms2 }; });
    var cols = [
      { key: 'label', label: 'Period', cell: function (r) { return '<strong>' + esc(r.label) + '</strong><div class="muted" style="font-size:11px">' + r.months + ' month' + (r.months === 1 ? '' : 's') + '</div>'; } },
      { key: 'revenue', label: 'Revenue', num: true, cell: function (r) { return money(r.revenue); } },
      { key: 'totalCost', label: 'Total cost', num: true, cell: function (r) { return money(r.totalCost); } },
      { key: 'profit', label: 'Profit', num: true, cell: function (r) { return '<strong>' + money(r.profit) + '</strong>'; } },
      { key: 'margin', label: 'Margin', num: true, cell: function (r) { return U.marginPill(r.margin); } }
    ];
    var qt = U.table(cols, qrows, { sortKey: 'label', sortDir: 1, bar: false, pageSize: 0, onRow: function (r) { root.App.setMonth(r.ms[r.ms.length - 1]); root.App.setPeriod('quarter'); } });
    var starts = [];
    C.MONTHS.forEach(function (m) { var st = C.fiscalYearStart(m); if (starts.indexOf(st) === -1) starts.push(st); });
    var span = C.mindex(d.last) - C.mindex(C.fiscalYearStart(d.last));
    var yrows = starts.map(function (st) {
      var ms2 = []; for (var i = 0; i <= span; i++) { var m = C.maddMonths(st, i); if (C.MONTHS.indexOf(m) !== -1) ms2.push(m); }
      if (!ms2.length) return null; var q = C.aggregate(ms2);
      return { label: C.fiscalLabel(st) + ' · ' + C.mabbr(ms2[0]) + '–' + C.mabbr(ms2[ms2.length - 1]), months: ms2.length, revenue: q.revenue, totalCost: q.totalCost, profit: q.profit, margin: q.margin, ms: ms2 };
    }).filter(Boolean);
    var yt = U.table(cols, yrows, { sortKey: 'label', sortDir: 1, bar: false, pageSize: 0 });
    var qg = el('<div class="grid-2" style="margin-top:16px"></div>');
    qg.appendChild(U.panel('Quarters', 'Financial year starts in ' + C.MONTH_NAMES[C.getFiscalStart() - 1] + ' · click one to report on it', qt, true));
    qg.appendChild(U.panel('Year to date', 'Like-for-like months against the same point in earlier years', yt, true));
    f.appendChild(qg);
    return f;
  }

  /* ---------- layer 2: clients ----------------------------------------------- */
  function clientLayer(d) {
    var f = frag(), a = d.a, clients = d.clients;
    var maxRev = Math.max.apply(null, clients.map(function (c) { return c.revenue; }).concat([1]));
    var trend = function (cid) { return U.sparkline(d.t12.map(function (m) { var r = C.rollup(m).byClient[cid]; return r ? r.margin : 0; }), 'var(--m-margin)', 72, 22); };
    var t = U.table([
      { key: 'name', label: 'Client', cell: function (c) { return '<strong class="link">' + esc(c.name) + '</strong><div class="muted" style="font-size:11px">' + (C.byId(C.CLIENTS, c.id) || {}).industry + '</div>'; } },
      { key: 'revenue', label: 'Revenue', num: true, cell: function (c) { return U.bullet(c.revenue, maxRev, 'var(--m-revenue)', money(c.revenue)); } },
      { key: 'share', label: 'Share', num: true, sortVal: function (c) { return c.revenue; }, cell: function (c) { var sh = a.revenue ? c.revenue / a.revenue : 0; return '<span class="' + (sh > 0.3 ? 'bad' : '') + '">' + pct(sh, 0) + '</span>'; } },
      { key: 'empCost', label: 'Employee cost', num: true, cell: function (c) { return money(c.empCost); } },
      { key: 'afterPeople', label: 'Contribution after people', num: true, sortVal: function (c) { return c.revenue - c.empCost; }, cell: function (c) { return money(c.revenue - c.empCost); } },
      { key: 'peopleMargin', label: 'People margin', num: true, sortVal: function (c) { return c.revenue ? (c.revenue - c.empCost) / c.revenue : -9; }, cell: function (c) { return c.revenue ? pct((c.revenue - c.empCost) / c.revenue) : '—'; } },
      { key: 'otherCost', label: 'Other cost', num: true, cell: function (c) { return money(c.otherCost); } },
      { key: 'profit', label: 'Profit', num: true, cell: function (c) { return '<strong class="' + (c.profit < 0 ? 'bad' : '') + '">' + money(c.profit) + '</strong>'; } },
      { key: 'margin', label: 'Margin', num: true, cell: function (c) { return U.marginPill(c.margin); } },
      { key: 'trend', label: 'Margin trend', sortable: false, noExport: true, cell: function (c) { return trend(c.id); } },
      { key: 'n', label: 'Projects', num: true, sortVal: function (c) { return d.projects.filter(function (x) { return x.clientId === c.id; }).length; },
        cell: function (c) { var ps = d.projects.filter(function (x) { return x.clientId === c.id; }); var weak = ps.filter(function (x) { return x.billable && x.margin < U.BANDS.watch; }).length; return ps.length + (weak ? ' <span class="bad" data-tip="' + weak + ' below the watch line">· ' + weak + ' weak</span>' : ''); } }
    ], clients, {
      title: 'Client profitability', subtitle: 'Code to Click · ' + d.p.label, exportName: 'Client profitability ' + d.p.label, sortKey: 'profit', search: false, pageSize: 0,
      onRow: function (c) { root.App.go('client', { id: c.id }); },
      foot: (function () { var e = clients.reduce(function (t2, c) { return t2 + c.empCost; }, 0), o = clients.reduce(function (t2, c) { return t2 + c.otherCost; }, 0);
        return { name: clients.length + ' clients', revenue: money(a.revenue), empCost: money(e), afterPeople: money(a.revenue - e), peopleMargin: a.revenue ? pct((a.revenue - e) / a.revenue) : '—', otherCost: money(o), profit: money(a.revenue - e - o) }; })(),
      empty: 'No client had an active project in ' + esc(d.p.label) + '.'
    });
    f.appendChild(U.panel('Clients ranked', d.p.label + ' · revenue bar is relative to the largest client · share above 30% is flagged', t, true));

    /* revenue vs margin: who is big and who is good */
    var g = el('<div class="grid-2" style="margin-top:16px"></div>');
    var quad = el('<div class="quad"></div>');
    var medRev = clients.length ? clients[Math.floor(clients.length / 2)].revenue : 0;
    var Q = [['Large & healthy', 'Protect and grow', function (c) { return c.revenue >= medRev && c.margin >= U.BANDS.healthy; }, 'good'],
             ['Large & thin', 'Reprice or re-staff — biggest lever on company margin', function (c) { return c.revenue >= medRev && c.margin < U.BANDS.healthy; }, 'watch'],
             ['Small & healthy', 'Expand the relationship', function (c) { return c.revenue < medRev && c.margin >= U.BANDS.healthy; }, 'neutral'],
             ['Small & thin', 'Fix the scope or let go', function (c) { return c.revenue < medRev && c.margin < U.BANDS.healthy; }, 'crit']];
    Q.forEach(function (q) {
      var list = clients.filter(q[2]);
      var box = el('<div class="quad-cell"><div class="quad-head"><span class="pill ' + q[3] + '">' + list.length + '</span><strong>' + q[0] + '</strong><span class="muted">' + q[1] + '</span></div><div class="quad-list"></div></div>');
      var ul = box.querySelector('.quad-list');
      if (!list.length) ul.appendChild(el('<span class="muted" style="font-size:12px">None</span>'));
      list.slice(0, 6).forEach(function (c) {
        var row = el('<button type="button" class="quad-row"><span>' + esc(c.name) + '</span><span class="mono muted">' + moneyK(c.revenue) + '</span>' + U.marginPill(c.margin) + '</button>');
        row.addEventListener('click', function () { root.App.go('client', { id: c.id }); }); ul.appendChild(row);
      });
      if (list.length > 6) ul.appendChild(el('<span class="muted" style="font-size:12px">+ ' + (list.length - 6) + ' more</span>'));
      quad.appendChild(box);
    });
    g.appendChild(U.panel('Size against margin', 'Split at the median client (' + money(medRev) + ') and the healthy line (' + pct(U.BANDS.healthy, 0) + ')', quad, true));

    /* concentration */
    var conc = el('<div></div>');
    var top = clients.slice(0, 5), rest = clients.slice(5);
    var rows = top.map(function (c, i) { return { label: c.name, value: c.revenue, color: ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'][i] }; });
    if (rest.length) rows.push({ label: rest.length + ' other clients', value: rest.reduce(function (t2, c) { return t2 + c.revenue; }, 0), color: 'var(--text-3)' });
    conc.appendChild(U.segbar(rows, a.revenue, { aria: 'Revenue concentration' }));
    conc.appendChild(el('<div class="callout" style="margin-top:14px;font-size:13px">' +
      (d.conc1 > 0.35 ? '<strong>' + esc(d.top1.name) + ' is ' + pct(d.conc1, 0) + ' of revenue.</strong> Losing them would take the period to ' + money(a.revenue - d.top1.revenue) + ' revenue and ' + money(a.profit - d.top1.profit) + ' profit.'
        : d.conc3 > 0.6 ? '<strong>Top three clients are ' + pct(d.conc3, 0) + ' of revenue.</strong> Healthy for a small firm, but a second tier is worth building.'
        : 'Revenue is well spread — no client above ' + pct(d.conc1, 0) + '.') + '</div>'));
    g.appendChild(U.panel('Revenue concentration', 'Largest five clients and the rest', conc));
    f.appendChild(g);
    return f;
  }

  /* ---------- layer 3: projects ---------------------------------------------- */
  function projectLayer(d) {
    var f = frag(), a = d.a, bands = d.bands;
    var B = [['healthy', 'Healthy', 'good'], ['watch', 'Watch', 'watch'], ['critical', 'Critical', 'crit'], ['loss', 'Loss making', 'loss']];
    f.appendChild(el(U.sumStrip(B.map(function (b) {
      var list = bands[b[0]], rev = list.reduce(function (t, x) { return t + x.revenue; }, 0), pr = list.reduce(function (t, x) { return t + x.profit; }, 0);
      return { label: b[1], value: '<span class="pill ' + b[2] + '">' + list.length + '</span> ' + moneyK(rev), foot: (a.revenue ? pct(rev / a.revenue, 0) : '0%') + ' of revenue · ' + money(pr) + ' profit' };
    }).concat([{ label: 'Cost centres', value: String(d.costCentres.length), foot: money(d.costCentres.reduce(function (t, x) { return t + x.totalCost; }, 0)) + ' non-billable cost' }]))));

    /* watch list with the reason */
    var weak = d.billable.filter(function (x) { return x.margin < U.BANDS.watch; }).sort(function (x, y) { return x.profit - y.profit; });
    var why = function (x) {
      var people = x.revenue ? x.empCost / x.revenue : 1, other = x.revenue ? x.otherCost / x.revenue : 1;
      if (!x.revenue) return 'No revenue booked against ' + money(x.totalCost) + ' of cost';
      if (people > 0.6 && other > 0.25) return 'Both people (' + pct(people, 0) + ' of revenue) and other cost (' + pct(other, 0) + ') are heavy';
      if (people > 0.6) return 'Over-staffed for its revenue: people are ' + pct(people, 0) + ' of revenue';
      if (other > 0.25) return 'Other cost is ' + pct(other, 0) + ' of revenue — check contractors, cloud and licences';
      return 'Thin margin on ' + money(x.revenue) + ' of revenue';
    };
    var wt = U.table([
      { key: 'name', label: 'Project', cell: function (x) { return '<strong class="link">' + esc(x.name) + '</strong><div class="muted" style="font-size:11px">' + esc((H.clientOf(x.id) || {}).name || '') + '</div>'; } },
      { key: 'revenue', label: 'Revenue', num: true, cell: function (x) { return money(x.revenue); } },
      { key: 'peopleMargin', label: 'People margin', num: true, sortVal: function (x) { return x.revenue ? (x.revenue - x.empCost) / x.revenue : -9; }, cell: function (x) { return x.revenue ? pct((x.revenue - x.empCost) / x.revenue) + '<div class="muted" style="font-size:11px">' + money(x.revenue - x.empCost) + ' after people</div>' : '—'; } },
      { key: 'profit', label: 'Profit', num: true, cell: function (x) { return '<strong class="' + (x.profit < 0 ? 'bad' : '') + '">' + money(x.profit) + '</strong>'; } },
      { key: 'margin', label: 'Margin', num: true, cell: function (x) { return U.marginPill(x.margin); } },
      { key: 'gap', label: 'To reach ' + pct(U.BANDS.healthy, 0), num: true, sortVal: function (x) { return x.revenue * U.BANDS.healthy - x.profit; },
        cell: function (x) { var gap = x.revenue * U.BANDS.healthy - x.profit; return gap > 0 ? '<span class="bad">' + money(gap) + '</span><div class="muted" style="font-size:11px">less cost, or more revenue</div>' : '—'; } },
      { key: 'why', label: 'Likely cause', sortable: false, cell: function (x) { return '<span style="white-space:normal;font-size:12.5px">' + esc(why(x)) + '</span>'; } }
    ], weak, { sortKey: 'profit', sortDir: 1, bar: false, pageSize: 0, onRow: function (x) { root.App.go('project', { id: x.id }); },
      empty: 'Every billable project is above the ' + pct(U.BANDS.watch, 0) + ' watch line in ' + esc(d.p.label) + '.' });
    var wp = U.panel('Watch list', weak.length + ' project' + (weak.length === 1 ? '' : 's') + ' below ' + pct(U.BANDS.watch, 0) + ' margin · the gap column is the cost you would have to remove (or revenue add) to make each one healthy', wt, true);
    wp.style.marginTop = '16px'; f.appendChild(wp);

    /* the full table */
    var t = U.table([
      { key: 'name', label: 'Project', cell: function (r) { return '<strong class="link">' + esc(r.name) + '</strong><div class="muted" style="font-size:11px">' + esc((H.clientOf(r.id) || {}).name || '') + (r.billable ? '' : ' · <span class="tag">Non-billable</span>') + '</div>'; } },
      { key: 'revenue', label: 'Revenue', num: true, cell: function (r) { return r.billable ? money(r.revenue) : '<span class="muted">—</span>'; } },
      { key: 'empCost', label: 'Employee cost', num: true, cell: function (r) { return money(r.empCost); } },
      { key: 'afterPeople', label: 'Contribution after people', num: true, sortVal: function (r) { return r.revenue - r.empCost; }, cell: function (r) { return r.billable ? money(r.revenue - r.empCost) : '<span class="muted">—</span>'; } },
      { key: 'peopleMargin', label: 'People margin', num: true, sortVal: function (r) { return r.revenue ? (r.revenue - r.empCost) / r.revenue : -9; }, cell: function (r) { return r.billable && r.revenue ? pct((r.revenue - r.empCost) / r.revenue) : '<span class="muted">—</span>'; } },
      { key: 'otherCost', label: 'Other cost', num: true, cell: function (r) { return money(r.otherCost); } },
      { key: 'profit', label: 'Profit', num: true, cell: function (r) { return r.billable ? '<strong class="' + (r.profit < 0 ? 'bad' : '') + '">' + money(r.profit) + '</strong>' : '<span class="muted">cost centre</span>'; } },
      { key: 'margin', label: 'Margin', num: true, sortVal: function (r) { return r.billable ? r.margin : 9; }, cell: function (r) { return r.billable ? U.marginPill(r.margin) : '<span class="pill neutral">n/a</span>'; } },
      { key: 'trend', label: 'Margin trend', sortable: false, noExport: true, cell: function (r) { return r.billable ? U.sparkline(d.t12.map(function (m) { var q = C.rollup(m).byProject[r.id]; return q ? q.margin : 0; }), 'var(--m-margin)', 72, 22) : ''; } }
    ], d.projects, { title: 'Project profitability', subtitle: 'Code to Click · ' + d.p.label, exportName: 'Project profitability ' + d.p.label, sortKey: 'margin', sortDir: 1,
      onRow: function (r) { root.App.go('project', { id: r.id }); },
      foot: { name: d.projects.length + ' projects', revenue: money(a.revenue), empCost: money(d.projects.reduce(function (t2, x) { return t2 + x.empCost; }, 0)), otherCost: money(d.projects.reduce(function (t2, x) { return t2 + x.otherCost; }, 0)), profit: money(d.billable.reduce(function (t2, x) { return t2 + x.profit; }, 0)) } });
    var tp = U.panel('All projects', d.p.label + ' · sorted weakest first', t, true); tp.style.marginTop = '16px'; f.appendChild(tp);

    /* client → project matrix */
    var clients = d.clients.slice().sort(function (x, y) { return y[matrixSort] - x[matrixSort]; });
    var h = '<div class="dt-scroll capped"><table class="grid"><thead><tr><th class="stick">Client / project</th><th class="n">Revenue</th><th class="n">Employee cost</th><th class="n">After people</th><th class="n">People margin</th><th class="n">Other cost</th><th class="n">Profit</th><th class="n">Margin</th></tr></thead><tbody>';
    clients.forEach(function (c) {
      h += '<tr class="group-row clickable" data-c="' + c.id + '"><td class="stick"><span class="mono muted" data-x="' + c.id + '">▸</span> <strong>' + esc(c.name) + '</strong></td>' +
        '<td class="n">' + money(c.revenue) + '</td><td class="n">' + money(c.empCost) + '</td><td class="n">' + money(c.revenue - c.empCost) + '</td><td class="n">' + (c.revenue ? pct((c.revenue - c.empCost) / c.revenue) : '—') + '</td><td class="n">' + money(c.otherCost) + '</td><td class="n">' + money(c.profit) + '</td><td class="n">' + U.marginPill(c.margin) + '</td></tr>';
      d.projects.filter(function (x) { return x.clientId === c.id; }).sort(function (x, y) { return y.revenue - x.revenue; }).forEach(function (x) {
        h += '<tr class="sub-row clickable" data-p="' + x.id + '" data-parent="' + c.id + '" hidden><td class="stick">' + esc(x.name) + (x.billable ? '' : ' <span class="tag">Non-billable</span>') + '</td>' +
          '<td class="n">' + (x.billable ? money(x.revenue) : '—') + '</td><td class="n">' + money(x.empCost) + '</td><td class="n">' + (x.billable ? money(x.revenue - x.empCost) : '—') + '</td><td class="n">' + (x.billable && x.revenue ? pct((x.revenue - x.empCost) / x.revenue) : '—') + '</td><td class="n">' + money(x.otherCost) + '</td><td class="n">' + (x.billable ? money(x.profit) : '—') + '</td><td class="n">' + (x.billable ? U.marginPill(x.margin) : '<span class="pill neutral">n/a</span>') + '</td></tr>';
      });
    });
    h += '</tbody></table></div>';
    var node = el(h);
    node.querySelectorAll('tr[data-c]').forEach(function (tr) {
      tr.addEventListener('click', function () {
        var id = tr.dataset.c, open = tr.querySelector('[data-x]').textContent === '▾';
        tr.querySelector('[data-x]').textContent = open ? '▸' : '▾';
        node.querySelectorAll('tr[data-parent="' + id + '"]').forEach(function (r) { r.hidden = open; });
      });
    });
    node.querySelectorAll('tr[data-p]').forEach(function (tr) { tr.addEventListener('click', function (ev) { ev.stopPropagation(); root.App.go('project', { id: tr.dataset.p }); }); });
    var sorter = el('<div class="chips"></div>');
    [['revenue', 'Revenue'], ['profit', 'Profit'], ['margin', 'Margin'], ['totalCost', 'Cost']].forEach(function (k) {
      var b = el('<button class="chip" aria-pressed="' + (matrixSort === k[0]) + '">' + k[1] + '</button>');
      b.addEventListener('click', function () { matrixSort = k[0]; root.App.render(); });
      sorter.appendChild(b);
    });
    var mp = U.panel('Client → project matrix', 'Expand a client to see its projects · sorted by ' + matrixSort, node, true, sorter);
    mp.style.marginTop = '16px'; f.appendChild(mp);
    return f;
  }

  /* ---------- the page -------------------------------------------------------- */
  V.profitability = function (s) {
    var f = frag(), d = compute(s), a = d.a, band = U.band(a.margin);
    if (s.params && s.params.tab) { tab = s.params.tab; delete s.params.tab; }
    f.appendChild(head('Profitability', 'Company, clients and projects for ' + esc(d.p.label) + ' — every figure is a sum of that period’s monthly records.',
      [btn('Management report', 'btn-ghost', function () { root.App.go('report-management'); }, 'report')],
      '<div class="ph-stamp' + (band.cls === 'good' ? '' : band.cls === 'watch' ? ' watch' : ' closed') + '"><span class="dotlive"></span>' + esc(band.label) + ' &middot; ' + pct(a.margin) + ' gross margin &middot; ' + esc(d.p.label) + '</div>'));
    f.appendChild(decisionStrip(d));

    /* insights: the sentences a manager would write */
    var ins = H.insights(s, d.p).slice(0, 4);
    if (ins.length) {
      var row = el('<div class="insights-row" style="margin-top:16px"></div>');
      ins.forEach(function (i) { row.appendChild(el(U.insightCard(esc(i.text) + (i.why ? ' <span class="muted">' + esc(i.why) + '</span>' : ''), i.tone === 'neg' ? 'crit' : i.tone === 'warnc' ? 'warn' : i.tone === 'pos' ? 'good' : '', i.tone === 'neg' || i.tone === 'warnc' ? 'info' : 'spark'))); });
      f.appendChild(row);
    }

    /* the three layers */
    var tabs = el('<div class="tabbar" role="tablist" aria-label="Profitability layers" style="margin-top:20px;margin-bottom:0"></div>');
    [['company', 'Company', 'i-company'], ['clients', 'Clients', 'i-clientprofit'], ['projects', 'Projects', 'i-projectprofit']].forEach(function (t) {
      var on = tab === t[0];
      var b = el('<button type="button" role="tab" aria-selected="' + on + '"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + t[2] + '"></use></svg>' + t[1] +
        (t[0] === 'clients' ? '<em class="cnt">' + d.clients.length + '</em>' : t[0] === 'projects' ? '<em class="cnt">' + d.projects.length + '</em>' : '') + '</button>');
      b.addEventListener('click', function () { tab = t[0]; var y = window.scrollY; root.App.render(); window.scrollTo(0, y); });
      tabs.appendChild(b);
    });
    f.appendChild(tabs);
    var body = el('<div style="margin-top:16px"></div>');
    body.appendChild(tab === 'clients' ? clientLayer(d) : tab === 'projects' ? projectLayer(d) : companyLayer(d));
    f.appendChild(body);
    return f;
  };

  /* the three old screens live on as bookmarks into the tabs */
  V['profit-company'] = function (s) { tab = 'company'; return V.profitability(s); };
  V['profit-client'] = function (s) { tab = 'clients'; return V.profitability(s); };
  V['profit-project'] = function (s) { tab = 'projects'; return V.profitability(s); };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* =============================================================================
   Sign in / sign out.

   The password is checked by PostgreSQL, not here. This file only collects it,
   posts it to /api/login, and renders whatever the server says. The session
   lives in an httpOnly cookie the page cannot read, so nothing on this page —
   including anything injected into it — can copy a session out.

   On load the page asks /api/me rather than trusting anything stored locally:
   the server decides who is signed in, every time.
============================================================================= */
(function (root) {
  'use strict';
  var U = root.UI, el = U.el, esc = U.esc;

  var session = null;      /* whatever /api/me last told us, or null */
  var ready = false;       /* have we heard back yet? */

  function api(path, opts) {
    return fetch(path, Object.assign({
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin'        /* send the session cookie */
    }, opts || {}));
  }

  function whoAmI() {
    return api('/api/me')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { return d && d.user ? d.user : null; })
      .catch(function () { return null; });   /* offline or no API: signed out */
  }

  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }

  /* ---------- the screen --------------------------------------------------- */
  function screen() {
    var wrap = el('<div class="signin" id="signin" hidden></div>');

    wrap.appendChild(el(
      '<section class="si-brand">' +
        '<div class="si-logo">' +
          '<svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><use href="#mark"></use></svg>' +
          '<span><span class="w">Code<span class="to">to</span>Click</span>' +
          '<span class="ws">Profitability Intelligence</span></span>' +
        '</div>' +
        '<div class="si-pitch">' +
          '<h2>Every month, closed and accounted for.</h2>' +
          '<p>Revenue, payroll and licences resolved down to a single margin per project, ' +
             'per client and per company — with the month as the record.</p>' +
          '<ul class="si-points">' +
            '<li><svg class="ico" viewBox="0 0 24 24"><use href="#i-check"></use></svg>' +
              '<span>Allocation-driven people cost, capped at 100%</span></li>' +
            '<li><svg class="ico" viewBox="0 0 24 24"><use href="#i-check"></use></svg>' +
              '<span>Licences split across the team and carried by allocation</span></li>' +
            '<li><svg class="ico" viewBox="0 0 24 24"><use href="#i-check"></use></svg>' +
              '<span>Closed months are immutable — history stays true</span></li>' +
          '</ul>' +
        '</div>' +
        '<div class="si-foot">USD · monthly ledger</div>' +
      '</section>'));

    var panel = el('<section class="si-panel"></section>');
    var card = el('<div class="si-card"></div>');
    card.appendChild(el('<h1>Sign in</h1>'));
    card.appendChild(el('<p class="si-lede">Use your Code to Click account.</p>'));

    var form = el('<form class="si-form" novalidate></form>');

    var err = el('<div class="si-err" role="alert" hidden>' +
      '<svg class="ico" viewBox="0 0 24 24"><use href="#i-info"></use></svg><span></span></div>');
    form.appendChild(err);

    var emailWrap = el('<div></div>');
    emailWrap.appendChild(el('<label class="si-lab" for="si-email">Email</label>'));
    var email = el('<input class="si-in" id="si-email" type="email" name="email" autocomplete="username" ' +
      'placeholder="you@codetoclick.ai" required>');
    emailWrap.appendChild(email);
    form.appendChild(emailWrap);

    var pwWrap = el('<div></div>');
    pwWrap.appendChild(el('<label class="si-lab" for="si-pw">Password</label>'));
    var pwBox = el('<div class="si-pw"></div>');
    var pw = el('<input class="si-in" id="si-pw" type="password" name="password" ' +
      'autocomplete="current-password" placeholder="••••••••••" required>');
    var peek = el('<button type="button" class="si-peek" aria-label="Show password">Show</button>');
    peek.addEventListener('click', function () {
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      peek.textContent = showing ? 'Show' : 'Hide';
      peek.setAttribute('aria-label', (showing ? 'Show' : 'Hide') + ' password');
      pw.focus();
    });
    pwBox.appendChild(pw); pwBox.appendChild(peek);
    pwWrap.appendChild(pwBox);
    form.appendChild(pwWrap);

    var btn = el('<button class="si-btn" type="submit">Sign in</button>');
    form.appendChild(btn);
    card.appendChild(form);

    function fail(msg) {
      err.querySelector('span').textContent = msg;
      err.hidden = false;
      email.setAttribute('aria-invalid', 'true');
      pw.setAttribute('aria-invalid', 'true');
      pw.value = ''; pw.focus();
    }
    function clearErr() {
      err.hidden = true;
      email.removeAttribute('aria-invalid'); pw.removeAttribute('aria-invalid');
    }
    email.addEventListener('input', clearErr);
    pw.addEventListener('input', clearErr);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      clearErr();
      if (!email.value.trim()) { fail('Enter your email address.'); email.focus(); return; }
      if (!pw.value) { fail('Enter your password.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="si-spin" aria-hidden="true"></span>Signing in…';

      api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ email: email.value.trim(), password: pw.value })
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, data: d }; });
      }).then(function (out) {
        btn.disabled = false; btn.textContent = 'Sign in';
        if (!out.ok || !out.data.user) {
          fail((out.data && out.data.message) || 'That email and password do not match an account.');
          return;
        }
        session = out.data.user;
        AUTH.loadData().then(function () {
          apply();
          if (root.App && root.App.render) root.App.render();
          if (U.toast) U.toast('Signed in as ' + session.name);
        });
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Sign in';
        fail('Could not reach the server. Check your connection and try again.');
      });
    });

    panel.appendChild(card);
    wrap.appendChild(panel);

    wrap._focus = function () { (email.value ? pw : email).focus(); };
    return wrap;
  }

  /* ---------- account menu in the topbar ---------------------------------- */
  function mountMenu() {
    var btn = document.getElementById('profile-btn');
    if (!btn || btn._acctReady) return;
    btn._acctReady = true;

    var host = el('<div class="acct"></div>');
    btn.parentNode.insertBefore(host, btn);
    host.appendChild(btn);
    var pop = el('<div class="acct-pop" role="menu" hidden></div>');
    host.appendChild(pop);

    btn.setAttribute('aria-haspopup', 'menu');
    btn.setAttribute('aria-expanded', 'false');

    function close() { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    function fill() {
      if (!session) { pop.innerHTML = ''; return; }
      pop.innerHTML =
        '<div class="acct-who"><div class="nm">' + esc(session.name) + '</div>' +
        '<div class="em">' + esc(session.email) + '</div>' +
        '<span class="rl">' + esc(session.role) + '</span></div>';
      var out = el('<button type="button" class="acct-item danger">' +
        '<svg class="ico" viewBox="0 0 24 24"><use href="#i-x"></use></svg>Sign out</button>');
      out.addEventListener('click', function () { close(); AUTH.signOut(); });
      pop.appendChild(out);
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!session) return;
      var open = pop.hidden;
      if (open) fill();
      pop.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function (e) { if (!host.contains(e.target)) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    host._close = close;
    AUTH._menu = { fill: fill, close: close, btn: btn };
  }

  /* ---------- gate --------------------------------------------------------- */
  var gate = null;
  function ensure() {
    if (!gate) { gate = screen(); document.body.appendChild(gate); }
    return gate;
  }

  function apply() {
    var app = document.querySelector('.app');
    ensure();
    if (!ready) { gate.hidden = true; if (app) app.hidden = true; return; }
    if (session) {
      gate.hidden = true;
      if (app) app.hidden = false;
      var btn = document.getElementById('profile-btn');
      if (btn) {
        btn.textContent = initials(session.name);
        btn.setAttribute('aria-label', session.name + ' — account menu');
        btn.setAttribute('data-tip', session.name + ' · ' + session.role);
      }
      if (AUTH._menu) AUTH._menu.fill();
    } else {
      gate.hidden = false;
      if (app) app.hidden = true;
      if (gate._focus) gate._focus();
    }
  }

  var AUTH = {
    /* Who is signed in, or null. Display only — the server decides access. */
    user: function () { return session; },
    role: function () { return session ? session.role : null; },

    signOut: function () {
      api('/api/logout', { method: 'POST' })
        .catch(function () { })            /* revoke server-side, best effort */
        .then(function () {
          session = null;
          if (root.CTC && root.CTC.clearAll) { root.CTC.syncState.on = false; root.CTC.clearAll(); }
          apply();
        });
    },

    /* Ask the server who we are, then show the app or the gate. */
    refresh: function () {
      return whoAmI().then(function (u) {
        session = u;
        if (!u) { ready = true; apply(); return null; }
        return AUTH.loadData().then(function () {
          ready = true; apply();
          if (root.App && root.App.render) root.App.render();
          return u;
        });
      });
    },

    /* Pull this organization's records from the database into the working copy. */
    loadData: function () {
      var C = root.CTC;
      if (!C || !C.loadFromServer) return Promise.resolve(false);
      return C.loadFromServer();
    },

    /* Test-harness entry: the suites run from a file:// page with no API, so
       they set the display state directly. Grants nothing — every endpoint
       checks the cookie server-side regardless of what this says. */
    devSignIn: function (who) {
      session = who || { email: 'owner@codetoclick.ai', name: 'Akhil Kaushal', role: 'owner' };
      ready = true; apply();
      return true;
    },

    mount: function () {
      mountMenu();
      apply();            /* nothing visible while we ask */

      /* A refused write must never leave the screen disagreeing with the
         database: say what happened, then reload from the server. */
      if (root.CTC && root.CTC.syncState) {
        root.CTC.syncState.onError = function (msg, status) {
          if (status === 401) { session = null; apply(); return; }
          if (U.toast) U.toast(msg, { kind: 'error' });
          AUTH.loadData().then(function () {
            if (root.App && root.App.render) root.App.render();
          });
        };
      }
      AUTH.refresh();
    }
  };

  root.AUTH = AUTH;
  if (root.App) root.App.auth = AUTH;

  /* This file is the last script on the page, so the shell already exists. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', AUTH.mount);
  } else {
    AUTH.mount();
  }
})(window);
</script>
